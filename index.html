<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KIMNAMYONG</title>
<meta name="description" content="김남용 — 일, 글, 삶.">
<meta name="theme-color" id="themeColor" content="#FFFFFF">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
/* ─── 토큰 ─────────────────────────────────────────────── */
:root{
  --paper:#FFFFFF;        /* 일반 바탕 */
  --warm:#F2F1EE;         /* 「글」 미색 바탕 */
  --ink:#16181C;
  --ink-soft:#6E7681;
  --faint:#9AA1A9;        /* 크레딧 라벨 */
  --line:#E4E8EC;
  --slot:#EAECEE;         /* 이미지 자리 회색 박스 */
  --slot-mark:#C2C8CE;
  --accent:#3A5A78;
  --band:#111315;         /* 레터박스 띠 */
  --scrim:rgba(12,14,17,.34);
  --sans:"Pretendard Variable",Pretendard,-apple-system,'Apple SD Gothic Neo',system-ui,sans-serif;
  --drawer-w:264px;
  --ease:cubic-bezier(.22,1,.36,1);
  --edge:env(safe-area-inset-left,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0C0E11; --warm:#101215; --ink:#E8E9EB; --ink-soft:#8C949E;
    --faint:#6B737C; --line:#252A31; --slot:#191D22; --slot-mark:#333A42;
    --accent:#7FA6C4; --band:#000000; --scrim:rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0C0E11; --warm:#101215; --ink:#E8E9EB; --ink-soft:#8C949E;
  --faint:#6B737C; --line:#252A31; --slot:#191D22; --slot-mark:#333A42;
  --accent:#7FA6C4; --band:#000000; --scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
/* 브라우저 바탕을 시트 바탕과 일치시킨다 — 가장자리에 띠가 생기지 않도록 */
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--sans); overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  transition:background-color .28s var(--ease);
}
body[data-layout="E"]{background:var(--warm)}
:focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:2px}
img{display:block; width:100%; height:100%; object-fit:cover}

/* ─── 무대 ─────────────────────────────────────────────── */
.stage{
  min-height:100vh; min-height:100dvh;
  display:flex; align-items:center; justify-content:center;
  padding:clamp(1.5rem,4vh,3.5rem) 0;   /* 위아래 레터박스 띠 */
  transition:opacity .26s var(--ease),filter .26s var(--ease);
}
body[data-drawer="open"] .stage{opacity:.25; filter:blur(1px)}

.sheet{
  width:min(1920px, 100vw);
  background:var(--paper);
  overflow:hidden;
}
.sheet[data-layout="E"]{background:var(--warm)}

/* ─── 이미지 슬롯 ───────────────────────────────────────── */
.slot{background:var(--slot); position:relative; overflow:hidden; min-height:0; min-width:0}
.slot.is-empty::after{
  content:"이미지"; position:absolute; inset:0;
  display:grid; place-items:center;
  font-size:.7rem; letter-spacing:.18em; color:var(--slot-mark);
}
.details{display:grid; gap:1px; background:var(--line)}
.details[data-n="1"]{grid-template-columns:1fr}
.details[data-n="2"]{grid-template-columns:1fr 1fr}
.details[data-n="3"]{grid-template-columns:1fr 1.5fr 1fr}
.details[data-n="4"]{grid-template-columns:repeat(4,1fr)}
.details[data-n="5"],.details[data-n="6"]{grid-template-columns:repeat(3,1fr)}

/* ─── 공통 텍스트 ───────────────────────────────────────── */
.title{
  font-size:clamp(1.35rem,1.1rem + .9vw,1.75rem); font-weight:600;
  line-height:1.4; letter-spacing:-.02em; margin:0; text-wrap:balance;
}
.lead{
  font-size:clamp(.95rem,.9rem + .3vw,1.1rem); font-weight:500;
  line-height:1.75; letter-spacing:-.01em; margin:0; color:var(--ink);
  text-wrap:pretty;
}
.para{
  font-size:.82rem; font-weight:400; line-height:1.95;
  letter-spacing:-.005em; margin:0 0 1.1em; color:var(--ink-soft);
  text-wrap:pretty;
}
.para:last-child{margin-bottom:0}
.sub{
  font-size:.9rem; font-weight:600; line-height:1.5; color:var(--ink);
  margin:1.8em 0 .7em;
}

/* 크레딧 */
.credits{display:grid; gap:.42rem 1.6rem; align-content:start}
.credits.two{grid-template-columns:1fr 1fr}
.cred{display:flex; align-items:baseline; gap:.6rem; font-size:.72rem; line-height:1.5}
.cred dt{color:var(--faint); flex:none; min-width:3.2em}
.cred dd{margin:0; color:var(--ink-soft)}
.cred dd:empty::after{
  content:""; display:inline-block; width:5.5em;
  border-bottom:1px dotted var(--slot-mark); transform:translateY(-.25em);
}

/* ─── 레이아웃 A : 좌측 이미지 + 우측 텍스트 ─────────────── */
/* 이미지는 비율을 고정하고, 텍스트는 길이대로 흐르게 둔다.
   안쪽 스크롤에 가두면 분량을 눈으로 가늠할 수 없다. */
.sheet[data-layout="A"]{display:grid; grid-template-columns:58fr 42fr; align-items:stretch}
/* 본문이 길어도 이미지 칼럼은 늘어나지 않는다. 스크롤 중에도 보이도록 붙여둔다. */
.A-media{
  display:grid; grid-template-rows:auto auto; gap:1px; background:var(--line);
  align-self:start; position:sticky; top:0;
}
.A-media .hero{aspect-ratio:1112/701}
.A-media .details{aspect-ratio:1112/378}
.A-text{
  display:flex; flex-direction:column;
  padding:clamp(1.8rem,3.4vw,3.4rem);
  gap:clamp(1.4rem,3vh,2.6rem);
}
.A-text .credits{border-top:1px solid var(--line); padding-top:1.3rem; margin-top:auto}

/* ─── 레이아웃 C : 상단 이미지 + 하단 3단 ────────────────── */
.sheet[data-layout="C"]{display:grid; grid-template-rows:auto auto auto}
/* 밴드 비율은 원안(1920×616)을 따른다 — 본문이 길어져도 이미지는 커지지 않는다 */
.C-media{
  display:grid; grid-template-columns:54fr 23fr 23fr; gap:1px;
  background:var(--line); aspect-ratio:1920/616;
}
.C-media .hero{min-height:0}
.C-media .stack{display:grid; grid-template-rows:1fr 1fr; gap:1px; background:var(--line)}
.C-head{padding:clamp(1.2rem,2.4vw,2rem) clamp(1.6rem,3vw,3rem) 0}
.C-cols{
  display:grid; grid-template-columns:32fr 40fr 28fr;
  gap:0 clamp(1.4rem,2.6vw,2.6rem);
  padding:clamp(1.2rem,2.4vw,2rem) clamp(1.6rem,3vw,3rem) clamp(1.6rem,3vw,3rem);
  border-top:1px solid var(--line); margin-top:clamp(1.2rem,2.4vw,2rem);
}
.C-cols > * + *{border-left:1px solid var(--line); padding-left:clamp(1.4rem,2.6vw,2.6rem)}

/* 7장 초과분 */
.overflow{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:1px; background:var(--line); border-top:1px solid var(--line);
}
.overflow .slot{aspect-ratio:3/2}

/* ─── 레이아웃 E : 「글」 가운데 정렬 ─────────────────────── */
.sheet[data-layout="E"]{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:clamp(3rem,10vh,7rem) clamp(1.5rem,6vw,3rem);
  min-height:min(1080px, 86vh);
}
.E-title{
  font-size:clamp(1.4rem,1.2rem + 1vw,1.9rem); font-weight:700;
  letter-spacing:-.02em; margin:0 0 clamp(2rem,5vh,3.2rem); color:var(--ink);
}
.E-body{max-width:44rem; display:flex; flex-direction:column; gap:1.9em}
.E-stanza{
  font-size:clamp(.9rem,.86rem + .25vw,1rem); font-weight:440;
  line-height:2.05; letter-spacing:-.01em; margin:0; color:var(--ink-soft);
  white-space:pre-line; text-wrap:pretty;
}
.E-credit{
  margin:clamp(3.5rem,9vh,6rem) 0 0; font-size:.68rem;
  letter-spacing:.04em; color:var(--faint);
}

/* ─── 좌측 힌트 / 드로어 ───────────────────────────────── */
.hint{
  position:fixed; top:0; bottom:0; left:0; width:2px;
  background:var(--ink); opacity:.14; border:0; padding:0;
  z-index:30; cursor:pointer; transition:opacity .2s var(--ease);
}
.hint:hover{opacity:.34}
body[data-drawer="open"] .hint{opacity:0; pointer-events:none}

.drawer{
  position:fixed; inset:0 auto 0 0; z-index:40; width:var(--drawer-w);
  padding:clamp(2rem,5vh,3rem) 1.25rem clamp(1.5rem,4vh,2.25rem) max(1.75rem,var(--edge));
  background:var(--paper);
  display:flex; flex-direction:column; gap:2.2rem;
  transform:translateX(-100%); opacity:0;
  transition:transform .26s var(--ease),opacity .2s var(--ease);
  overflow-y:auto; overscroll-behavior:contain;
}
body[data-drawer="open"] .drawer{transform:translateX(0); opacity:1}

.dnav{display:flex; gap:1.5rem; align-items:baseline}
.dnav button{
  font-family:var(--sans); font-size:1.05rem; font-weight:500;
  background:none; border:0; cursor:pointer; padding:.2rem 0 .35rem;
  color:var(--ink-soft); border-bottom:1.5px solid transparent;
  transition:color .18s var(--ease),border-color .18s var(--ease);
}
.dnav button:hover{color:var(--ink)}
.dnav button[aria-current="true"]{color:var(--ink); font-weight:700; border-bottom-color:var(--accent)}

.rule{height:1px; background:var(--line); margin:0; border:0}
.titles{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:.1rem; flex:1}
.titles button{
  font-family:var(--sans); font-size:.88rem; background:none; border:0;
  padding:.5rem 0; cursor:pointer; color:var(--ink-soft); text-align:left;
  width:100%; display:flex; align-items:baseline; gap:.5rem; line-height:1.45;
  transition:color .18s var(--ease);
}
.titles button:hover,.titles button:focus-visible{color:var(--ink)}
.titles button[aria-current="true"]{color:var(--accent)}
.titles button[aria-current="true"] .dash{opacity:1}
.dash{flex:none; width:.7rem; height:1px; background:currentColor; opacity:0;
  transition:opacity .18s var(--ease); transform:translateY(-.3em)}
.titles button:hover .dash{opacity:.45}
.sig{font-size:.66rem; letter-spacing:.22em; color:var(--faint); margin:0; text-transform:uppercase}

.backdrop{
  position:fixed; inset:0; z-index:35; background:var(--scrim);
  opacity:0; pointer-events:none; transition:opacity .26s var(--ease);
  border:0; padding:0;
}
body[data-drawer="open"] .backdrop{opacity:1}

/* ─── 반응형 ───────────────────────────────────────────── */
@media (max-width:1023px){
  .sheet[data-layout="A"]{grid-template-columns:1fr}
  .A-media{position:static}
  .C-cols{grid-template-columns:1fr; gap:1.6rem}
  .C-cols > * + *{border-left:0; border-top:1px solid var(--line);
    padding-left:0; padding-top:1.6rem}
  .credits.two{grid-template-columns:1fr}
}
@media (hover:none),(pointer:coarse),(max-width:767px){
  .hint{
    top:max(.75rem,env(safe-area-inset-top,0px)); bottom:auto;
    left:max(.75rem,var(--edge)); width:44px; height:44px; opacity:1;
    display:grid; place-items:center; background:none; border-radius:50%;
  }
  .hint::before{content:""; width:14px; height:1px; background:var(--ink);
    box-shadow:0 5px 0 var(--ink),0 -5px 0 var(--ink); opacity:.5}
  body[data-drawer="open"] .backdrop{pointer-events:auto}
}
@media (max-width:767px){
  :root{--drawer-w:min(80vw,300px)}
  .stage{padding:0}
  .C-media{grid-template-columns:1fr; grid-template-rows:auto auto}
  .C-media .stack{grid-template-rows:auto; grid-template-columns:1fr 1fr}
  .details[data-n="3"],.details[data-n="4"],
  .details[data-n="5"],.details[data-n="6"]{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important; transition-duration:.01ms !important}
}
</style>
</head>
<body data-drawer="closed">

<button class="hint" id="hint" aria-label="목록 열기" aria-expanded="false" aria-controls="drawer"></button>
<button class="backdrop" id="backdrop" tabindex="-1" aria-label="목록 닫기"></button>

<nav class="drawer" id="drawer" aria-label="주요 메뉴">
  <div class="dnav" id="dnav" role="tablist"></div>
  <hr class="rule">
  <ul class="titles" id="titles"></ul>
  <p class="sig">Kim Nam Yong</p>
</nav>

<main class="stage" id="stage"><article class="sheet" id="sheet"></article></main>

<script>
const DATA = {"work":[{"slug":"p1577","title":"2021 K 社 온라인 고객 경험 혁신 컨설팅","label":"KT샵 컨설팅 : 고객경험","layout":"A","date":"2020-10-01","year":"2020","lead":"","body":[{"t":"h","v":"2020년 10월~11월, K 온라인 고객경험 혁신 컨설팅"},{"t":"p","v":"2020년 9월, K 社의 공식 웹사이트는 닷컴(○○.com, 이하 '닷컴')과 숍(shop.○○.com, 이하 '샵')으로 분리되어 있었다. 닷컴에서 샵으로의 진입은 이질적이지 않았지만(닷컴 GNB 1 Depth 메뉴에, 샵 위치), 상당 부분 고객 경험은 단절되어 있었다. (예를 들어, 상품 구매 내역은 샵에서만 제공하고, 통신 서비스 이용 내역은 닷컴에서만 제공하는 식). K 社는 2009년부터 여러 컨설팅을 통해 이 문제의 해결 방안을 찾고자 했고, 닷컴과 샵 2개 웹사이트를 하나로 통합해야겠다는 내부적인 결론을 도출할 수 있었다.\n통합 이후 고객 경험과 여정(Customer Experience, Buying Jorney)은 어떻게 혁신되어야 하는지에 대한 의뢰가 있었다."},{"t":"p","v":"배경"},{"t":"p","v":"심리스한 고객 경험과 여정에 대한 일반적인 기대는 '선형적(linear)'이다. 그러니까, '포털을 통해 닷컴으로 인입한 고객이 상품을 클릭해 샵으로 이동하고, 샵에서 구매를 한 후 서비스를 이용한다. 그리고 서비스를 이용하다가 필요에 의해 사이트에 재접속 할 때, 개인화된 상품을 제안하여, 또다시 구매 여정으로 '올라 타게' 만든다. 그리고, 각 순간 다음 단계로의 이동을 촉진하는 계기를 제공한다.'는 것이다. 하지만, 최근 고객들의 온라인 채널 이용 패턴은 '과제 수행'에 가깝다. 해결해야 할 과제나, 달성해야 할 목적이 뚜렷하고, 빠른 해결을 원한다. 따라서, 공급자가 설계한 '선(line)'을 타고 이동하지 않는다. 고객에게 제공해야 할 것은, '심리스한 라인'이나 '파이프(pipe)'가 아니라, 언제 어느 곳에서 원하는 곳으로이 빠른 접근과 문제 해결이어야 한다."},{"t":"p","v":"컨셉 키워드"},{"t":"p","v":"플랫폼의 성격 또한 고객 상품, 서비스나 정보를 제공하는 곳이 아니라, 철저하게 '고객' 기준의 플랫폼이어야 한다. 고객 관점의 서비스가 고객의 정보와 위치 등에 따라 자동으로 제안되어져야 한다. 그래서 우리는 새로운 통합 플랫폼 컨셉을 'My'라고 명명했다. 'My K社'가 아닌, 그냥 'My'"},{"t":"p","v":"이러한 배경 속에서 우리는 다음과 같은 4개의 과제를 선별하여 제안했다."},{"t":"p","v":"과제"},{"t":"p","v":"첫째, 통합"},{"t":"p","v":"· 닷컴과 샵 통합 - 대표 채널과 유통 채널을 하나로 통합"},{"t":"p","v":"· 마이페이지 통합 - '나'(고객 개인)와 관련된 모든 서비스와 정보를 마이페이지로 통합"},{"t":"p","v":"· 앱 통합 - 인지도와 이용률이 저조한 고객 서비스 앱을 대표앱으로 통합"},{"t":"p","v":"둘째, 구매 여정 혁신"},{"t":"p","v":"· 모바일 우선 고려 설계. 인증 간소화로 구매 여정 간소화"},{"t":"p","v":"· * 20202년 12월 공인인증서가 폐기됨으로써 가능해짐"},{"t":"p","v":"셋째, 개인화/큐레이션"},{"t":"p","v":"· 상품을 혜택으로, 혜택을 정보로마케팅 정보(가입할인, 요금할인, 가입사은품 등)를 개인을 위한 혜택으로 전달하되, 광고가 아닌 개인을 위한 정보로서 전달"},{"t":"p","v":"검색고도화"},{"t":"p","v":"· 오타, 오기, 외래어, 이슈 키워드 등에 대응할 수 있는 검색 결과 품질 고도화"},{"t":"p","v":"2020년 12월~2021년 1월, K 온라인 고객경험 혁신 프로젝트 1단계"},{"t":"p","v":"위 컨설팅에 이이서 <온라인 고객경험 혁신 1단계> 프로젝트가 시작되었다. 목표는 컨설팅 내용을 기반으로 실제 구현 가능한 프로토타입을 제작하는 것으로, 그것을 바탕으로 유관부서, 개발 부문 및 협력사 등에 타당성 검토 및 공수를 산정한 후, 프로젝트를 본격화 하는 것이었다."},{"t":"p","v":"배경\n프로젝트가 본격화하면서, 대내적으로 의사결정을 이끌어 내고, 오픈 시점에 대외적으로 홍보할 '킬링포인트, 와우포인트'에 대한 고민이 시작되었다. 컨설팅 단계에서 정리한 과제는 합리적이지만 홍보 측면에서 임팩트가 약했고, 컨셉 키워드 'My' 또한 평이하게 느껴졌다. K 社는 자사 회원 및 잠재고객에게 제공하는 '혜택이 많음'을 강조하고 싶어했고, 우리는 '혜택'을 차별적으로 제공할 수 있는 방법을 고민했다."},{"t":"p","v":"컨셉 키워드 - 스위치(Switch)\n고객 혜택 강조는 금융, 유통, 통신 등 서비스 분야에서 전방위적으로 발생하고 있다. 때문에, '많은 혜택' 보다는 '내게 꼭 맞는 혜택', '쉽게 제공(오퍼링)되는 혜택'임을 강조하고 싶었고, UI/UX의 용이성까지 담아 토글 형식의 '스위치'(비주얼 이미지)를 컨셉 키워드로 제안했다. 이는 향후, 고객사 내부에서 고민하고 있는 다양한 서비스들에 접목되어 확장 가능성이 높게 받아들여졌다. 다만, 하나의 단어('스위치')가 성격이 다른 서비스들에 사용될 때 고객들이 혼란을 느낄 수 있으므로, 네이밍 보다는 컨셉 키워드로만 사용하고, 각 서비스별 네이밍은 별도로 만들어갈 것을 제안했다."},{"t":"p","v":"과제\n이러한 배경과 맥락, 컨셉을 반영하여 모바일웹 메인, 서브 메인, (통합) 앱 메인과 서브, 그리고 PC웹 메인 화면 등의 프로토타입 작업을 진행하였다. 또, 기존 닷컴과 샵에 산재해 있던 15개의 1 Depth 메뉴를, 3개의 글로벌 메뉴와 2개의 유틸리티 메뉴로 단순화하는 작업을 진행했다. 고객 관점에서 가장 빈번하게 찾는 2개의 메뉴(마이, 혜택)를 화면 하단 탭바 영역에 고정하여, 전 화면 어디에서나 바로 접근할 수 있도록 설계하였다."},{"t":"p","v":"이상의 컨설팅, 고객요구사항, 2차 프로토타입 디자인을 토대로 구현타당성과 공수 산정을 마친 후, 2021년 2월부터 본격적인 프로젝트(<온라인 고객경험 혁신> 1단계)에 돌입하게 되었다."}],"hero":{"src":"/images/work/p1577/01.webp","alt":"2021 K 社 온라인 고객 경험 혁신 컨설팅 — 이미지 1","w":900,"h":485},"details":[],"extra":[],"credits":[{"k":"고객사","v":""},{"k":"수행사","v":""},{"k":"기간","v":""},{"k":"PM","v":""},{"k":"디렉터","v":""},{"k":"기획","v":""},{"k":"디자인","v":""},{"k":"퍼블리싱","v":""}]},{"slug":"p1566","title":"2021 E 社 앱/웹 개편 제안","label":"이마트 앱/웹 개편","layout":"A","date":"2020-08-02","year":"2020","lead":"오프라인 유통이 위기다. 코로나 19 팬데믹 공포가 몰아닥쳤던 2020년 2월 온라인 유통 채널의 매출이 34.3% 증가한 반면, 오프라인은 동년 3월에 17.6나 감소했다.","body":[{"t":"p","v":"E 社 오프라인 매출 비중 및 할인점 부문 영업이익또한 계속해서 우하향을 그려가고 있다. 코로나 19의 장기화가 우려되면서, 오프라인 유통 채널의 O4O 현신, 디지털 트랜스포메이션이 절실하다."},{"t":"p","v":"Findings - 10 Minutes Shoppers"},{"t":"p","v":"219년 이후 위기 타개를 위한 대형마트, 할인점들의 노력은 생존경쟁에 가까웠다. 초저가 경쟁, 혜택 마케팅, 단골 마케팅 같은 전통적 방식에, 최저가 보상, 스캔 배송, 클럽, 선충전 등 디지털 마케팅 기법의 응용과 차용을 더했다."},{"t":"p","v":"비슷비슷한 마케팅 기법이 범람하는, 쪼그라드는 시장에서 살아남는 '단 하나의 기업'이 되기 위해, 온라인 채널을 어떻게 활용할 것인가?"},{"t":"p","v":"통계를 통해 새롭게 발견한 점은 '고객'이었다. 사회, 경제적 환경이 불안정할수록 근거리, VIP 고객이 중요해졌다(우리는 이들을 '10 Minutes Shoppers'라고 부르기로 했다)."},{"t":"p","v":"이들이 집을 나와 매장을 방문하여 이용하고, 집으로 돌아갔다가 재방문하기까지의 여정을 분석한 후, 방문과 재방문 구매를 지속, 반복할 수 있는 과제를 도출했다."},{"t":"p","v":"Challenge - Shift"},{"t":"p","v":"'VIP'를 테마로 한 핵심 문제는 3가지였다."},{"t":"p","v":"· 첫째, 어떻게 하면 현 VIP 고객에게 더 많은 구매 경험을 제공할까?"},{"t":"p","v":"· 둘째, 어떻게 하면 새로운 VIP 고객들을 창출할 수 있을까?"},{"t":"p","v":"· 셋째, 어떻게 하면 미래의 VIP 고객들을 만들어갈 수 있을까?"},{"t":"p","v":"그리고, 아래와 같은 방안으로 위 문제들을 해결하기로 했다."},{"t":"p","v":"· 첫째, 자주, 반복적이고 지속적으로 방문하는 VIP 고객에게 '더 많은 혜택'을 제공하는, 혜택 최적화 앱"},{"t":"p","v":"· 둘째, 계산대 앞에서, 포인트 누적을 위한 용도로만 앱을 사용하는 일반 고객을 위해 구매 여정별로 더 많고 쉬운 보상을 적립해 주는 앱"},{"t":"p","v":"· 셋째, 미래 고객 창출을 위한 가족간 포인트 공유, 특화 마케팅 기회를 제공하는 앱"},{"t":"p","v":"· 고객사 – E 社"},{"t":"p","v":"· 대행사 – ELUO C&C (www.eluocnc.com)"},{"t":"p","v":"· 컨설팅 – 김남용"},{"t":"p","v":"· 디자인 – 전미선, 전은진"},{"t":"p","v":"· 퍼블리싱 – 이승현"},{"t":"p","v":"· 기간 – 2020년 8월"},{"t":"p","v":"· 문의 – nykim@eluocnc.com, aprilleaf@gmail.com"},{"t":"p","v":"※ 위 내용은 2020년 8월에 진행한 제안 내용에 기초한 것으로, 보안 유지를 위하여 고객 기업명 및 구체적인 내용은 공개하지 않습니다."}],"hero":{"src":"/images/work/p1566/01.webp","alt":"2021 E 社 앱/웹 개편 제안 — 이미지 1","w":900,"h":485},"details":[],"extra":[],"credits":[{"k":"고객사","v":""},{"k":"수행사","v":""},{"k":"기간","v":""},{"k":"PM","v":""},{"k":"디렉터","v":""},{"k":"기획","v":""},{"k":"디자인","v":""},{"k":"퍼블리싱","v":""}]},{"slug":"p1555","title":"2020 K 社 마케팅 아이디어 컨설팅","label":"KT샵 컨설팅 : 마케팅","layout":"C","date":"2020-08-01","year":"2020","lead":"K 社의 공식 웹사이트는 물리적으로 대표 웹사이트(.com, 이하 '닷컴')와 유통 채널(shop)로 나뉘어져 있다. 닷컴 GNB에는 Shop을 메뉴로 노출하여, 고객은 이질감 없이 닷컴에서 Shop 사이트로 이동할 수 있다. K 社는 공식 웹사이트인 닷컴의 방문자를 Shop 채널 고객으로 전환하기 위한 온라인 마케팅 아이디어를 의뢰했다.","body":[{"t":"p","v":"정의/미션\nK 社 온라인 채널의 고객 여정을 살펴보면 다음과 같다."},{"t":"p","v":"· 인입 - 공식 웹사이트인 닷컴 사이트로의 인입 제고"},{"t":"p","v":"· 관심 - 인입된 고객이 이탈하지 않고, 상품 가입 및 구매 계기를 발견"},{"t":"p","v":"· 이동 - 유통 채널인 Shop 사이트로의 이동"},{"t":"p","v":"· 구매/가입 - 실질적인 상품 가입 및 구매 행동"},{"t":"p","v":"과제\n위 4대 미션별 마케팅 아이디어를 다음과 같이 제안했다."},{"t":"p","v":"인입"},{"t":"p","v":"· 아래의 아이디어로 고객 방문을 촉진"},{"t":"p","v":"· 기존 주3회 핫딜의 Daily, 정례화"},{"t":"p","v":"· 스타벅스 e-프리퀀시와 삼성카드의 제휴와 같은 방식의 크로스 마케팅"},{"t":"p","v":"관심"},{"t":"p","v":"· 아래의 아이디어로 상품에 대한 고객 주의를 환기"},{"t":"p","v":"· 개인화와 큐레이션 리포트"},{"t":"p","v":"· 구매 여정 복귀"},{"t":"p","v":"이동"},{"t":"p","v":"· 아래의 아이디어로 구매 결정을 촉진"},{"t":"p","v":"· 카카오 마케팅고 추가 할인 제공"},{"t":"p","v":"· 챗봇 주문 프로세스"},{"t":"p","v":"재방문"},{"t":"p","v":"· 아래의 아이디어로 이탈 고객 복귀 촉진"},{"t":"p","v":"· 멤버십 포인트 복원 등"},{"t":"p","v":"· 고객사 – K 社"},{"t":"p","v":"· 에이전시 – 엘루오씨앤씨"},{"t":"p","v":"· 사업관리 - 이상봉"},{"t":"p","v":"· 컨설팅 – 김남용"},{"t":"p","v":"· 카피라이팅 - 김남용"},{"t":"p","v":"· 기획 - 이진우"},{"t":"p","v":"· 디자인 - 유지성, 정형준"},{"t":"p","v":"· 퍼블리싱 - 여재원"},{"t":"p","v":"· 기간 – 2020년 3월 16일 ~ 5월 4일"},{"t":"p","v":"· 문의 – nykim@eluocnc.com, aprilleaf@gmail.com"},{"t":"h","v":"※ 위 내용은 2020년 7월~8월 동안 진행한 컨설팅 내용에 기초한 것으로, 보안 유지를 위하여 고객 기업명 및 구체적인 아이디어 및 내용은 공개하지 않습니다."}],"hero":null,"details":[],"extra":[],"credits":[{"k":"고객사","v":""},{"k":"수행사","v":""},{"k":"기간","v":""},{"k":"PM","v":""},{"k":"디렉터","v":""},{"k":"기획","v":""},{"k":"디자인","v":""},{"k":"퍼블리싱","v":""}]},{"slug":"p1344","title":"2020 K 다이렉트 커뮤니케이션 콘셉트 컨설팅","label":"KT샵 컨설팅 : 다이렉트","layout":"C","date":"2020-05-13","year":"2020","lead":"KT는 2020년 5월 11일 신한은행과 제휴해 '5G 다이렉트 신한 쏠(SOL)' 요금제를 출시했다. 이를 앞둔 3월 초, KT는 엘루오씨앤씨에 커뮤니케이션 콘셉트 전략에 관한 컨설팅을 의뢰해 왔다. 그런데, KT가 고객들에게 제공하고자 하는 무약정, 데이터 무제한 등은 경험은 이미 KT M Mobile, Liiv M 등 알뜰폰 사업자가 경쟁 우위에서 제공하고 있었다. 또, 경쟁사 LG유플러스는 이미 U+Shop에서 '5G 다이렉트' 요금제를 판매중이었다.  KT 최초의 온라인 전용 요금제, '5G 다이렉트 신한 쏠(SOL)' 요금제는 무엇을 전달해야 하는가?","body":[{"t":"h","v":"'언택트' 시대에 온라인 서비스는 어떻게 만들어야 할까?"},{"t":"p","v":"코로나19 바이러스가 촉발한 '언택트(Untact)' 시대. 손 안에 모바일 기기 하나만 있으면, 필요한 모든 물건이 하루만에 집 앞에 도착한다. 사회적 거리 두기 시행으로 사람과의 관계는 멀어졌지만, 온라인과의 관계는 어느 때보다 돈독해졌다. 언택트는 기업에도 피할 수 없는 생존요건이 됐다. 덕분에 사용자들은 다양한 온라인 언택트 서비스를 경험하며, 점점 쉽고 편리하고 빠른 것에 익숙해지고 있다."},{"t":"p","v":"이제는 웬만해선 사용자를 만족시키기 어려운 이 시대에, 어떠한 UI(사용자 인터페이스)와 UX(사용자 경험)의 온라인 언택트 서비스가 그들의 마음을 사로잡을 수 있을까?"},{"t":"p","v":"온라인 언택트 서비스의 UI 및 UX는 쉽고 빠르게 사용자의 이용 목적을 달성할 수 있도록 설계돼야 한다. 사용자에게 불필요한 건 과감히 없애고, 사용자 편의성을 최우선으로 고려한 UI, UX가 주목받는다. '토스', '카카오뱅크'로 대표되는 핀테크 서비스는 사용자의 서비스 이용 목적을 시중은행보다 쉽고 빠르게 달성하게 함으로써, 금융은 어렵다는 편견을 깨고 시장의 판도를 바꿨다."},{"t":"p","v":"국내 통신사 중 KT의 경우, 사용자가 온라인에서 주문(가입)하는 과정에서 부담감을 느낀다는 의견에 귀를 기울였다. 이에 지난 5월 온라인 전용 'KT 다이렉트' 요금제를 출시하며 가입 절차를 간소화했다. '불필요한 것은 비우고 혜택은 채운다'는 콘셉트로 복잡한 가입 절차를 개편한 것이다."},{"t":"p","v":"먼저 UI, UX를 PC가 아닌 모바일에 최적화했다. 여기에 정보 입력 단계를 축소하고, 하나의 화면에서 가입 절차를 모두 처리하게 만들었다. 단계별 안내 멘트 역시 사용자 중심의 간결한 언어를 적용했으며, 색상도 최소로 사용하는 등 단순 직관적인 디자인을 구현했다."},{"t":"p","v":"모바일 환경에 최적화된 KT다이렉트 UI, UX <출처=IT동아>"},{"t":"p","v":"이 같은 KT 다이렉트의 UI, UX는 이후 론칭한 '1분 주문, 1시간 배송' 서비스의 출발점이 됐다. 이 서비스는 온라인에서 휴대전화를 주문하면 1시간 안에 원하는 곳으로 배송해준다(수도권 기준, 일부 지역 제외). 가까운 대리점에서 전문 배달업체 '부릉'을 통해 상품을 퀵 배송하는 것이다. 휴대전화 없이는 단 1분 1초도 버틸 수 없는 젊은 세대의 요구를 충족함과 동시에, 언택트라는 세계적 흐름을 타고 이용자 수가 늘어나고 있다."},{"t":"p","v":"'1분 주문' 서비스는 'KT 다이렉트'와 마찬가지로 1분 안에 주문을 완료할 수 있을 만큼 절차가 간단하다. 본인인증, 기종 선택, 요금제 선택, 이 세 단계로 가입이 완료된다. 서비스 가입이라는 사용자의 이용 목적을 쉽고 빠르게 이룰 수 있어, 사용자의 소중한 시간을 아끼고 통신 쇼핑 경험도 개선하는 효과를 얻게 됐다."},{"t":"p","v":"온라인 주문으로 1시간 내에 스마트폰을 수령할 수 있다 <출처=IT동아>"},{"t":"p","v":"언택트는 사람의 일을 기술/기계가 대신하기 때문에, 사람에게 그렇듯이 기술/기계에 인내심을 갖기 어렵다. 바쁜 현대인들은 특별한 이유 없이 느리고, 불편하고, 복잡한 과정을 마냥 기다릴 수 없다. 초기 언택트 서비스인 키오스크 주문, 은행 ATM 등을 떠올려보자. 공급자 입장에선 인건비를 절감하고, 사용자 입장에선 직원과 대면하려 오래 기다리지 않아도 되는 이점이 있었다. 때문에 사용법이 어렵고 불편해도 어느 정도 감내했고, 정 어려우면 직원에게 도움을 요청하기도 했다."},{"t":"p","v":"코로나19 대유행 이후로 모든 것이 달라졌다. 누군가와의 대면이 위험해진 상황에서 비대면은 선택이 아닌 필수로 자리 잡았다. 서비스 이용에 문제가 발생하면, 이제는 불편함을 느끼는 것을 넘어 생활 전반에 지장을 줄 수도 있다. 학습 공백을 줄이기 위해 지난 4월 초중고등학교가 실시한 온라인 개학과 원격 수업은 시행 초기 접속 장애와 지연, 오류 등이 빈번히 발생했다. 학생과 학부모는 큰 불편을 겪었고, 일부는 수업에 참여하지 못하는 상황에 망연자실했다. 이러한 사례로 볼 때, 코로나 이후 시대 사용자는 이용에 불편함 없이 자신의 목적을 쉽고 빠르게 달성케 하는 서비스를 더욱 선호할 수 밖에 없다."},{"t":"p","v":"한편, 서비스를 만드는 방법과 기술도 좋은 UI, UX를 만들 수 있는 요소 중 하나다. 온라인 서비스를 구축할 때 전통적인 업무 진행 방식은 기획자, 디자이너, 퍼블리셔, 개발자 등이 순차적으로 처리하는 것이었다. 또 고객사/클라이언트와의 소통은 주로 기획자가 했고, 다른 작업자들의 의견을 취합해 전달하는 역할도 겸했다."},{"t":"p","v":"요즘엔 재택근무와 화상회의 등이 자연스러워지며 비대면으로 일하는 기업이 많아졌다. 이때 '공개'와 '협업'을 중심으로 업무를 진행하면 대면 방식보다 훨씬 효율적으로 일할 수 있다."},{"t":"p","v":"필자가 소속된 엘루오씨앤씨에서는 모든 작업자가 공동작업 툴을 이용해 실시간으로 진행 상황과 결과물을 공유하고 있다. 그때그때 공개적으로 의견을 주고 받으며 소통 오류를 줄이고, 빠른 의사결정과 실행을 한다. 이로써 과정과 결과물 등이 정확히 공유되지 않아 최종안이 번복되거나 재작업을 해야 하는 문제가 눈에 띄게 줄었다. 이러한 방식은 작업 시간 단축은 물론 결과물 품질 향상도 기대할 수 있다."},{"t":"p","v":"앞서 언급한 KT 다이렉트 콘셉트 컨설팅도 이 업무 방식의 결과 중 하나다. 이 컨설팅을 수행하면서, 업무의 모든 과정을 투명하게 공개하고 협업하며 빠르게 움직이는 우리의 '에자일(민첩성) 프로세스'가 효과적으로 적용됐음을 확인했다."},{"t":"p","v":"직접 대면하지 않는 언택트 환경에서는 사람의 말투, 표정, 제스처, 반응 시간 등 비언어적 커뮤니케이션이 오가지 않는다. 요구와 언어만 보일 뿐이다. 이에 사용자 탐구의 중요성은 이전보다 커질 것이다. 사람에 대한 섬세한 해석과 깊은 탐색, 이해를 충실히 한 서비스만이 사용자들의 선택을 받을 수 있는 시대다. 포스트 코로나 시대에 지속가능한 서비스가 되기 위해서는, 시시각각 변화하는 사용자에 맞춰 서비스도 진화를 거듭해야 한다."},{"t":"p","v":"· 엘루오씨앤씨 전략컨설팅본부 김남용 팀장"},{"t":"p","v":"· 정리 - IT전문 남시현 기자 shnam@donga.com"},{"t":"p","v":"· 출처 - '언택트' 시대에 온라인 서비스는 어떻게 만들어야 할까? (동아닷컴 2020.8.7)"},{"t":"p","v":"Concept Slogan"},{"t":"p","v":"· 고객사 – KT"},{"t":"p","v":"· 에이전시 – 엘루오씨앤씨 (www.eluocnc.com)"},{"t":"p","v":"· 사업관리 - 이상봉"},{"t":"p","v":"· 컨설팅 – 김남용"},{"t":"p","v":"· 카피라이팅 - 김남용"},{"t":"p","v":"· 기획 - 이진우"},{"t":"p","v":"· 디자인 - 유지성, 정형준"},{"t":"p","v":"· 퍼블리싱 - 여재원"},{"t":"p","v":"· 기간 – 2020년 3월 16일 ~ 5월 4일"},{"t":"p","v":"· 문의 – aprilleaf@gmail.com"}],"hero":{"src":"/images/work/p1344/01.webp","alt":"2020 K 다이렉트 커뮤니케이션 콘셉트 컨설팅 — 이미지 1","w":640,"h":497},"details":[{"src":"/images/work/p1344/02.webp","alt":"2020 K 다이렉트 커뮤니케이션 콘셉트 컨설팅 — 이미지 2","w":640,"h":497},{"src":"/images/work/p1344/03.webp","alt":"2020 K 다이렉트 커뮤니케이션 콘셉트 컨설팅 — 이미지 3","w":900,"h":485},{"src":"/images/work/p1344/04.webp","alt":"2020 K 다이렉트 커뮤니케이션 콘셉트 컨설팅 — 이미지 4","w":900,"h":485},{"src":"/images/work/p1344/05.webp","alt":"2020 K 다이렉트 커뮤니케이션 콘셉트 컨설팅 — 이미지 5","w":900,"h":485},{"src":"/images/work/p1344/06.webp","alt":"2020 K 다이렉트 커뮤니케이션 콘셉트 컨설팅 — 이미지 6","w":900,"h":830},{"src":"/images/work/p1344/07.webp","alt":"2020 K 다이렉트 커뮤니케이션 콘셉트 컨설팅 — 이미지 7","w":900,"h":485}],"extra":[],"credits":[{"k":"고객사","v":""},{"k":"수행사","v":""},{"k":"기간","v":""},{"k":"PM","v":""},{"k":"디렉터","v":""},{"k":"기획","v":""},{"k":"디자인","v":""},{"k":"퍼블리싱","v":""}]},{"slug":"p1359","title":"2020 Bodyluv Semi-Renewal","label":"바디럽 세미 개편","layout":"A","date":"2020-03-15","year":"2020","lead":"블랭크코퍼레이션은 2019/2020 가장 성공한 커머스 스타트업 기업이자, 미디어커머스 분야의 선두기업이다. 2016년 '셀프 옆머리 다운펌'으로 사업을 시작한 이래, 마약베개, 퓨어썸샤워기 등 리빙, 뷰티, 생활건강, 패션, 반려동물, 식음료 부문에서 23개 브랜드, 300여개 이상의 상품을 출시했다.","body":[{"t":"p","v":"바디럽은 퓨어썸 샤워기(Water 라인)과 마약베개(Fabric 라인) 등을 중심으로 한 라이프스타일 브랜드이다. 2020년 5월 현빈을 TV CF 광고 모델로 내세우며 더 공격적인 마케팅에 나서며 2020년 5월 자사몰 사이트(www.bodyluv.kr)의 부분 개편을 진행했다."},{"t":"p","v":"▲ 브랜드 캠페인, <생활 속 불편함을 말해 주세요>"},{"t":"p","v":"부분 개편의 핵심은, 새 TV CF 모델인 현빈을 '캠페인 오프너'로 활용한, '생활 속 불편함을 말해 주세요'. Youtube의 캠페인 영상을 본 일반인들이 일상 생활 중 불편함이나 아쉬웠던 점, 개선이 필요한 아이디어를 남기면, 하나의 아이디어를 선정하여 자사몰에서 사용가능한 50만 포인트(현금 50만원 상당)를 지급하는 캠페인이다. 일반인들의 실제 삶에서 느끼는 문제를 파악하고, 실제로 개선할 수 있는 제품 개발로까지 이어 보겠다는 바디럽의 의지가 담긴 캠페인이다."},{"t":"p","v":"https://bodyluv.kr/campaign.html"},{"t":"p","v":"▲ 세일즈 프로모션, <바디럽 생활 습관 테스트>"},{"t":"p","v":"사람들이 물을 사용할 때의 습관, 잠을 잘 때의 버릇에 관한 퀴즈를 풀면, 적합한 바디럽 제품을 추천하는 세일즈 프로모션이다. 퀴즈를 모두 풀고 나면, 합당한 사람 유형을 제시하고 유형에 적합한 상품군을 추천하려던 계획이었지만, 구현 과정에서 '하나의 문제'를 풀 때마다 '하나의 제품을 추천하는' 방식으로 변경되어, '유형별 제품 추천'이라는 재미 요소가 덜해졌다."},{"t":"p","v":"https://bodyluv.kr/promotion.html"},{"t":"p","v":"▲ 신기획상품 구축, 기존상품 개편"},{"t":"p","v":"세트 상품인 <한방에 퓨어썸 SET>와 <한방에 침구류 SET> 페이지, 그리고 기존상품 중 모델 및 정보 변경이 이뤄진 5개 상품 상세 화면을 개편했다.\nhttps://bit.ly/2yJIjjP 외"},{"t":"p","v":"▲ 브랜드 스토리, 배너"},{"t":"p","v":"기존에 제공중이던 <브랜드 스토리>도 현빈을 Key VIsual로 활용하여 수정했고,\nhttps://bodyluv.kr/shopinfo/brand_2020.html"},{"t":"p","v":"위 화면들로의 접속 포인트가 되는 배너 디자인도 함께 진행했다."},{"t":"p","v":"▶️ 바디럽 웹사이트 바로가기\nhttps://bodyluv.kr"},{"t":"p","v":"· 고객사 – 블랭크코퍼레이션 / 바디럽"},{"t":"p","v":"· 에이전시 – 엘루오씨앤씨 (www.eluocnc.com)"},{"t":"p","v":"· 기획 – 김남용, 신재은"},{"t":"p","v":"· 디자인 – 손동현, 김원경, 이아령Illustraion - 임은지"},{"t":"p","v":"· 퍼블리싱 - 오세희, 함효선"},{"t":"p","v":"· 기간 – 2020년 3월 23일 ~ 5월 9일"},{"t":"p","v":"· 문의 – nykim@eluocnc.com"}],"hero":{"src":"/images/work/p1359/01.webp","alt":"2020 Bodyluv Semi-Renewal — 이미지 1","w":900,"h":1669},"details":[],"extra":[],"credits":[{"k":"고객사","v":""},{"k":"수행사","v":""},{"k":"기간","v":""},{"k":"PM","v":""},{"k":"디렉터","v":""},{"k":"기획","v":""},{"k":"디자인","v":""},{"k":"퍼블리싱","v":""}]},{"slug":"p1537","title":"2020 K 社 Shop 개선 전략 컨설팅","label":"KT샵 컨설팅 : 개선","layout":"C","date":"2020-01-01","year":"2020","lead":"2019~2002년도 유통업계의 키워드는 단연 '핫딜'이었다. '0원 특가', '100원 특가' 등 고객을 모집하는 일이라면, 가격 포기도 마다하지 않았다. 하지만, 그 이면에는 인입된 방문자들의 순고객 전환을 위한 고심도 깊어지고 있었다.\n특히, 통신상품이나 가전렌탈처럼, 고가의 서비스 가입을 유도해야 하는 경우는 더했다. 명백하게 증가한 방문자를 어떻게 하면 '고객'으로 전환시킬 수 있을까? 이것이 문제였다.","body":[{"t":"p","v":"정의\n핫딜 마케팅이 특성은 화제성이 클수록 순간 방문자가 모이고, 이슈의 빈도가 높을수록 누적 방문자가 증가한다는 점이다. 문제는 희소성이 높을수록 화제성도 증가하는데, 이슈의 빈도가 높을수록 희소성은 떨어진다는 점이다. 이를 극복하기 위해서는, 빈도가 높아도 화제성을 유지하거나 높이도록, 마케팅 비용이 증가한다는 점이다.\n이를 극복하려면, 체리 피커가 아닌, 일상적 방문자를 증가시켜야 한다."},{"t":"p","v":"미션, 전략 또는 프레임워크\n기존의 전략적 프레임워크는 '방문자가 늘면 매출이 증가할 것(구매전환율)'이라는 생각에 기초했다. 따라서, 이유불문을 막론하고 방문자 인입을 극대화하는데 집중했다.\n새로운 전략적 프레임워크는 '방문의 지속성과 반복성'을 높이는데서 출발한다. '방문자'가 아니라, '방문'이 많아야 한다는 생각.\n그리고, 이들이 자연스럽게 구매전환으로 이어질 것이라는 생각을 포기했다. 통신상품 가입 의향이 있는 고객에게는 더 많은 혜택을 제공하고, 통신상품 가입에 관심이 없는 고객에게는 또 다른 판매 방식(매출 기회)을 제공해야 한다."},{"t":"p","v":"과제"},{"t":"p","v":"· 컨텐츠 - 통신은 텔레커뮤니케이션이 아니라 이제 삶(Life), 그 자체다. 그 삶의 속(내용)을 제공해 주는 매체는 의외로 많지 않다. 상품세일즈 뿐만 아니라, 상품이 구현하고 있는 '디지털 삶'을 정보화한 컨텐츠 채널이 필요하다."},{"t":"p","v":"· 혜택 - 통신상품에 관심이 있는 고객이라면 부인할 수 없는 구매 결정 요인은 가격과 혜택이다. '핫딜'을 찾아 들어온 스마트 유저라면 더욱 그럴 것이다. 통신상품 구매 시의 이익(혜택)의 '쓰임'을 더욱 다변화 해야 한다."},{"t":"p","v":"· New - MZ세대는 스마트 유저이다. 온라인에서 손쉽게 최적의 구매 상품과 구매처를 찾아낸다. 불필요한 지출을 하지 않는다. 반면, 즐겁거나, 가치 있는 일이라면 기껍게 지불을 의향이 있다. MZ 세대를 타겟으로 한 판매 방식의 변화를 모색할 필요가 있다."},{"t":"p","v":"※ 위 내용은 2020년 1월~2월 사이에 진행한 <K 社 온라인 숍 개선 전략 컨설팅> 내용 중 일부를 정리한 것입니다. 보안 유지를 위하여 고객 기업명 및 구체적인 아이디어 및 내용은 공개하지 않습니다."},{"t":"p","v":"· 고객사 – K 社 (비공개)"},{"t":"p","v":"· 에이전시 – 엘루오씨앤씨 (www.eluocnc.com)"},{"t":"p","v":"· 컨설턴트 – 김남용"},{"t":"p","v":"· 기간 – 2019년 11월 ~ 2020년 1월"},{"t":"p","v":"· 연락처 – nykim@eluocnc.com, aprilleaf@gmail.com"}],"hero":null,"details":[],"extra":[],"credits":[{"k":"고객사","v":""},{"k":"수행사","v":""},{"k":"기간","v":""},{"k":"PM","v":""},{"k":"디렉터","v":""},{"k":"기획","v":""},{"k":"디자인","v":""},{"k":"퍼블리싱","v":""}]},{"slug":"p1474","title":"2020 V 社 글로벌 웹사이트 개편 컨설팅","label":"바텍 글로벌 컨설팅","layout":"A","date":"2019-11-01","year":"2019","lead":"V 社는 치과용 의료장비 전문 기업이다. 전세계 치과용 엑스레이 시장점유율 1위, 구강센서 시장점유율 1위로, 전체 매출액 중 수출 비중이 86%에 달한다(2019년말 기준). 17개 국가에 해외법인, 100여 개 국가에 대리점이 진출해 있다.","body":[{"t":"p","v":"해외법인별 웹사이트는 각 법인에서 별도로 구축 및 운영을 하고 있는데, 도메인, Visual, UI/UX 부문의 통일성 및 일관성이 부족한 상황이다."},{"t":"p","v":"정의 - 문제재인식"},{"t":"p","v":"해외법인이 진출한 17개 국가 중 11개 나라는 웹사이트를 보유하고 있었고, 6개 국가는 개별 국가의 웹사이트가 없었따. 대리점이 진출한 100여 개 국가 중 80여 개 국가 또한 웹사이트를 운영하지 않고 있었다."},{"t":"p","v":"개별 웹사이트를 보유한 해외법인에서는 대표 웹사이트가 '기업 홍보'의 역할을 수행해 현지 마케팅을 지원하되 현지 법인 웹사이트의 마케팅과 혼선을 일으키지 않기를 원했다. 반면, 개별 웹사이트를 보유하지 못한 국가의 법인 및 대리점은 현지 마케팅 및 CS 대응 채널로서의 대표 웹사이트를 기대했다."},{"t":"p","v":"따라서, 단순히 도메인 규칙, WSG 적용이 아닌, 글로벌 No.1 브랜드 포지셔닝을 지원하고(공통), 자체 웹사이트가 없는 국가에서 온라인 마케팅과 CS를 지원할 수 있는 채널로서 대표 웹사이트의 역할을 정의하고, 그 관점에서 도메인 및 UI/UX 이슈를 제고해 보기로 했다."},{"t":"p","v":"글로벌 대표 웹사이트, 브릿지"},{"t":"p","v":"닷컴 웹사이트는 모든 국가의 모든 고객을 Needs(정보 제공과 구매, CS)에 빠르게 연결시켜 준다. 첫째, 해외법인의 웹사이트가 있는 경우 고객이 위치한 국가 정보를 인식하여 해당 지역 웹사이트로 바로 연결시킨다. 둘째, 웹사이트가 없는 해외법인 국가에서는 마케팅은 해외법인이나 딜러로 연결시키고, CS는 대표 웹사이트를 통해 HQ로 문의하도록 한다(V 사는 글로벌 24/7 CS 정책을 시행중). 셋째, 80여 대리점 국가의 경우, 대리점이나 딜러(마케팅), 또는 HQ(CS)로 연결시킨다. 아울러, 대리점조차 없는 국가에서 접속하는 경우에도 인근 국가의 대리점이나 딜러로의 contact point를 제공한다."},{"t":"p","v":"이상의 Customer Journey는 단순하게 웹사이트 접속 과정에 한하지 않고, 대표 웹사이트의 모든 콘텐츠(CS, 이벤트, 딜러찾기, 제품문의 등)가 접속 국가에 따라 가변적으로 나타남을 의미한다."},{"t":"p","v":"이야기 계단"},{"t":"p","v":"V 社는 2019년 말 현재, 덴탈 이미징 분야에서 글로벌 Top 3 내에 있었고, 평가 기준에 따라 1~3위를 오갔다. 확고한 글로벌 No.1 기업으로서의 브랜딩 포지셔닝을 원했다. 또, 단순 치과 이미징 솔루션 기업 이상의 포지셔닝을 계획중이었다.\nHQ의 홍보 파트는 일상적이고 역동적으로 활동했고, 해외법인 및 대리점은 이를 현지 영업에 즉각적인 활용할 수 있기를 기대했다.\n이를 위해, 반기별로 브랜드 메시지와 스토리를 개발하고 국내와 글로벌 대표 웹사이트에 제공하는, 일상적인 브랜드 스토리텔링 플랫폼을 제안했다."},{"t":"p","v":"· 고객사 – V 社 (비공개)"},{"t":"p","v":"· 대행사 – 엘루오씨앤씨 (www.eluocnc.com)"},{"t":"p","v":"· 컨설턴트 – 김남용"},{"t":"p","v":"· 디자인 – 유지성, 정형준"},{"t":"p","v":"· 퍼블리싱 - 이승현"},{"t":"p","v":"· 기간 – 2019년 11월 ~ 2020년 1월"},{"t":"p","v":"· 연락처 – aprilleaf@gmail.com"},{"t":"h","v":"※ 구체적인 기업명 및 서비스 아이디어는 보안상의 이슈로 공개하지 않습니다."}],"hero":{"src":"/images/work/p1474/01.webp","alt":"2020 V 社 글로벌 웹사이트 개편 컨설팅 — 이미지 1","w":900,"h":2469},"details":[],"extra":[],"credits":[{"k":"고객사","v":""},{"k":"수행사","v":""},{"k":"기간","v":""},{"k":"PM","v":""},{"k":"디렉터","v":""},{"k":"기획","v":""},{"k":"디자인","v":""},{"k":"퍼블리싱","v":""}]},{"slug":"p1065","title":"2019 Shop 가입프로세스 개선 컨설팅","label":"KT샵 컨설팅 : 가입여정","layout":"A","date":"2019-10-01","year":"2019","lead":"배경\nK 社의 고객들은 온라인에서 상품 가입하는 데 어려움을 겪고 있었다. PC에서는 재구매의사가 64%에 달한 반면, Mobile에서는 45%에 불과했다. 고객들은 핸드폰을 주문할 때 '복잡성(복잡한 주문 과정 + 복잡한 상품 설명)'을 가장 불편한 요인으로 선택했다. (2019년 7월 조사).","body":[{"t":"p","v":"정의"},{"t":"p","v":"고객들은 왜 복잡하다고 느낄까? 고객들이 복잡하다고 느끼는 상황과 이유는 무엇일까? 통신 상품 가입 여정에서의 '복잡성'의 정체는 무엇일까?"},{"t":"p","v":"· 정량적 분석 - 객관화를 위하여 특정 상품에 대한 구매 여정 속에서의 고객 행동을 정량화"},{"t":"p","v":"· 정성적 분석 - 주요 여정별 고객을 불편하게 만드는 요인들을 리스트업"},{"t":"p","v":"· 비교 분석 - 경쟁사 및 선진사례의 상품 가입 여정을 비교 분석하여 복잡성과 단순성을 정의한 결과"},{"t":"p","v":"여전히 PC Web 우선으로 설계한 구매 여정을 모바일化 (반응형 또는 적응형) 하면서 나타나는 '모바일 非 최적화'가 원인인 것으로 파악되었다."},{"t":"p","v":"미션"},{"t":"p","v":"따라서, 고객의 상품 가입 여정을 PC와 모바일에 각각 맞게 최적화하는 것을 핵심 미션으로 삼고,"},{"t":"p","v":"과제"},{"t":"p","v":"시급성과 구현 용이성을 기준으로"},{"t":"p","v":"· 단기 과제 - 간단한 UI/UX 개선만으로 당장의 고객 불만을 줄일 수 있는 사항"},{"t":"p","v":"· 중기 과제 - 개선이 필요하지만, 정책 결정 및 개발 수정 및 신규 개발이 필요한 사항"},{"t":"p","v":"· 장기 과제 - 가입 프로세스를 새롭게 정립하여, 전면적으로 개편해야 하는 사항 등"},{"t":"p","v":"을 선정하여 점진적으로 개선해 나갈 것으로 제안하였다."},{"t":"p","v":"Summary"},{"t":"p","v":"· 고객사 – K 社 (비공개)"},{"t":"p","v":"· 에이전시 – 엘루오씨앤씨 (www.eluocnc.com)"},{"t":"p","v":"· 컨설턴트 – 김남용"},{"t":"p","v":"· 기간 – 업전환(웹에이전시에서 영상 프로독션으로)이 이유였다.\n언젠가 담담하게 그날의 이야기를 정리해볼 수 있겠지. 각설하고..."},{"t":"p","v":"다급해진 나는 무슨 일이든 시도할 수밖에 없었다.\n회사에서 맡고 있던 V 社 홍보영상 시나리오 작업을 마무리 하면서\n영업 상황에 있던 한 작은 도장 전문 기업의 웹 구축 프로젝트를 진행하기로 했다.\n동시에, 위 프로젝트의 제안과 수주시 전체 PM을 맡기로 했다.\n그러면서도, 한 웹에이전시 컨설팅팀 제안 전문 인력 채용 면접에 응했다."},{"t":"p","v":"온통 살아야 한다는 생각뿐이었다. 아무것도 확실한 것이 없었다.\n새로운 회사로 옮겨가기에는 나이가 너무 많았고,\n웹 구축 프로젝트는 갑과 을의 비용 지급 조건이 5개월 어음이었다.\n제안 프로젝트는 수주 확률이 너무 낮았고 (당시 회사는 대표 1, 계약직 1, 정규직 3명에 불과했다.)\n수주를 한다고 하더라도 CD(Creative Director)가 함께 할 수 없었다(캐나다 이민).\n그런데도, 대표는 내게 수주시 비용 분할에 대한 확답을 단 한번도 하지 않았다."},{"t":"p","v":"하지만, 닥치는대로 해야 했다.\n회사에 나가지 않고, 집에서 2~3주 '귀신처럼' 일만 했다.\n영상 시나리오를 서둘러 마무리하고,\n급하게 작성한 구축 보고서를 들고 용인에 가서 회의를 하고 돌아와\n늦은 밤 캐나다에 있는 CD와 전화 통화를 한 후, 밤을 새워 제안서를 썼다.\n도중에 이력서와 포트폴리오를 정리해 1, 2차 면접에도 참여했다."},{"t":"p","v":"그렇게 일에 빠져 사는 사이에, 퇴사처리가 되었고\n구축 프로젝트는 본 궤도에 오르기 시작했다.\n면접을 본 회사로부터 합격 통지를 받았고,\n위 고객사 담당자로부터 우선협상대상자가 되었다는 연락을 받았다."},{"t":"p","v":"또 다른 고민이 시작되었다.\n비용으로 따지자면, 위 프로젝트를 당연히 맡아야 했다.\n하지만, 가장 먼저 '확답'을 준 것은 새로운 에이전시였다.\n위 프로젝트를 맡으면 진행중이던 구축 프로젝트도 함께 할 수 있었지만,\n새로운 에이전시로 가면, 2개 프로젝트를 모두 포기해야 했다."},{"t":"p","v":"하지만, 나는 새로운 회사로의 이직을 선택했다.\n대표는 여전히 비용에 대한 확답을 하지 않았고, 16년을 알아온 사람과\n사사건건 지출명세를 따져가며 일할 자신이 없었다.\n무엇보다도, '우선협상대상자'로 선정되었다는 사실을 기쁜 마음으로 알렸을 때,\n불쾌한 표정으로 '비용이 너무 낮아, 나는 더 올려달라고 하려던 참이었다.'던 말을 듣던 그 순간.\n(견적서는 스스로 작성하지 않았던가. 게다가 이미 제출한 견적서를 그런 방식으로 상향 조정한 경우는 본 적이 없었다.)\n마음 속에서 모든 것이 말끔하게 정리되었다."},{"t":"p","v":"나는 아직도 그날, 그리고 그 즈음의 일들을, 속속들이 이해할 수는 없다.\n왜 그렇게 급작스럽게 사람들을 내보냈는지.\n왜 경영이 어렵다면서 해당년도 가장 큰 규모의 프로젝트를 왜 스스로 깎아 내렸는지."},{"t":"p","v":"그저, 3명에 불과한 정직원 누구도 이 프로젝트를 전담할 수 없었던 당시 회사는 위 프로젝트를 맡아선 안되었다고,\n그래서, 내가 프로젝트 참여를 포기하고, 회사를 옮긴 이후에,\n회사 대표가 스스로 위 프로젝트를 포기한 건 다행스럽고, 올바른 판단이었다고 생각해볼 뿐이다."}],"hero":{"src":"/images/work/p1035/01.webp","alt":"2019 셀트리온 웹사이트 개편 제안 — 이미지 1","w":900,"h":1802},"details":[],"extra":[],"credits":[{"k":"고객사","v":""},{"k":"수행사","v":""},{"k":"기간","v":""},{"k":"PM","v":""},{"k":"디렉터","v":""},{"k":"기획","v":""},{"k":"디자인","v":""},{"k":"퍼블리싱","v":""}]},{"slug":"p1010","title":"2017 CTC 웹사이트 개편","label":"CTC 개편","layout":"C","date":"2017-10-01","year":"2017","lead":"CTC는 직선형 튜브 및 코일형 튜브를 생산, 유통하는 B2B 기업이다. 전세계 60여 개 나라에 수출되지만 대부분 2차 벤더로 납품하기 때문에 기업이나 제품이 잘 알려져 있지는 않다. 이번 개편에서는 잘 드러나지 않는 CTC의 글로벌 경쟁력과 규모감을 형상화하는 데 집중했다.","body":[{"t":"p","v":"제강업체에서 큰 사이즈의 강관 제품을 사다가 누르거나(압연. pilgering) 잡아당겨(인발. drawing), 가늘고 길게 만든 후, 수요처의 요구에 따라 알맞은 길이로 절단하는 것이 CTC의 주된 사업이다. 이러한 제품들은 반도체 제조 공정, 자동차 제조 공정, 지상/해양 플랜트, 조선, 오일&가스의 이동 등에 쓰이는데, 그 정밀도와 청결도가 매우 중요하다."},{"t":"p","v":"이번 개편에서는 기존에 <심리스 튜브>, <심리스 코일> 2개로만 나누어 제공하던 제품 정보를 <반도체>, <자동차>, <석유화학>, <조선>, <오일&가스>로 세분화하했다. 메뉴명을 수용자 관점으로 전환하고 현장과 스튜디오에서 사진 촬영을 진행, 텍스트 정보 대신 사진 자료를 늘려 누구나 사업 내용을 이해하기 쉽도록 했다. 그리고, 60개 국가에 수출되는 제품이 각 국가에서 어떻게 사용되는지를 시각적으로 보여주는 콘텐츠(CTC월드맵)을 신규 제안, 구현했다."},{"t":"p","v":"· 프로젝트 - CTC 공식 홈페이지 개편"},{"t":"p","v":"· 미션 - 국/영문 PC Web"},{"t":"p","v":"· PM - 김남용"},{"t":"p","v":"· 디자인 - 조낙현, 최은영"},{"t":"p","v":"· 퍼블리싱 - 김노라"},{"t":"p","v":"· 개발 - 전동표"},{"t":"p","v":"· 사진 - 지중근(chiek imaging)"},{"t":"p","v":"· 기간 - 2017.10.2(월) ~ 2018.1.31(수)"},{"t":"p","v":"· URL - www.ctckorea.com"},{"t":"p","v":"· 문의 - aprilleaf@gmail.com"}],"hero":{"src":"/images/work/p1010/01.webp","alt":"2017 CTC 웹사이트 개편 — 이미지 1","w":900,"h":1162},"details":[{"src":"/images/work/p1010/02.webp","alt":"2017 CTC 웹사이트 개편 — 이미지 2","w":750,"h":516}],"extra":[],"credits":[{"k":"고객사","v":""},{"k":"수행사","v":""},{"k":"기간","v":""},{"k":"PM","v":""},{"k":"디렉터","v":""},{"k":"기획","v":""},{"k":"디자인","v":""},{"k":"퍼블리싱","v":""}]},{"slug":"p1016","title":"2017 HPP 웹사이트 신규 구축","label":"HPP 개편","layout":"A","date":"2017-10-01","year":"2017","lead":"에이치피피는 2014년 탄생한 투자 전문 기업이다. 2017년도부터 본격적인 투자사업에 나섬과 함께 웹사이트 구축을 의뢰했다. 에이지피피는 2017년도 초반에 CI 로고도 만들었는데, '페가수스'를 형상화했다. 우리는 '페가수스'에서 연상할 수 있는 별, 구름, 왕관에 기업이 추구하는 가치 키워드 Honest, Passionate, Professional를 연결짓는 디자인을 시안으로 제안했다(2017.11.15). 이후 2018년 3월 26일까지 총 11차례의 시안 작업 계속된 끝에, 메인 1화면, 서브 1화면에 불과한, 심플하고 간결한 디자인으로 정착했다.","body":[{"t":"p","v":"남는 것은 결과뿐이다. 사람들은 결과물만 보고 이야기한다. 과정에 대해서는 알려고 하지 않는다. 억울하겠지만 당연한 일이다. 4개월 가까이, 모두 열 한 차례의 디자인 시안을 제안하는 동안 왜 억울한 일이 없었을까? 하지만 곱씹어야 할 것은 그 일들이 아니라, \"왜 그 일들이 발생했을까?\", \"어떻게 했으면 그 문제들을 해결할 수 있었을까?\" 하는 점이다."},{"t":"p","v":"이번 프로젝트의 가장 큰 문제는 \"의사결정권자와의 초기 인터뷰를 갖지 않았다\"는 점이다. 최종적인 의사결정권자가 명확(1人)했음에도 불구하고, 중간 실무자들을 통해 의사결정권자의 요구사항을 '전해 듣고', '재해석' 하려 했던 것이다."},{"t":"p","v":"대부분의 프로젝트 또한 그렇게 진행이 되지만, 이번 프로젝트의 경우 실무자들이 의사결정권자의 요구사항을 명확히 알지 못했다. 요구사항 분석 단계부터 그러한 문제를 감지했음에도 불구하고, 인터뷰 주선을 요청하지 않은 것은 프로젝트 책임자이자 담당자인 나의 잘못이다."},{"t":"p","v":"프로젝트가 '산으로 가던' 2월 중순 즈음, 다행히 고객사 PM이, 복도를 지나가던 의사결정권자를 모셔와 의견을 나눌 자리를 마련해 주었고, 그 자리에서 요구사항을 명확히 알 수 있었다. (더 다행이었던 것은, 그러한 자리가 마련될 줄 알지 못한 상황에서도, 전해들은 의사결정권자의 요구사항을 나름대로 정리하고 , 분석하여, 결론을 이끌어내기 위한 자료를 미리 준비해갔다는 점이다.)"},{"t":"p","v":"'CI 로고 그대로의 활용, 단 두 장의 화면, 단색의 컬러, 해석의 여지가 생길 수 있는 오브젝트들의 과감한 제거' 등 대부분의 세부 요건들이 이때서야 정리가 되었다. 또 배웠다. 억울해 할 것 없다."},{"t":"p","v":"·"},{"t":"p","v":"프로젝트 – HPP 웹사이트 신규 구축"},{"t":"p","v":"· 미션 – 국문, 영문"},{"t":"p","v":"· PM/기획 – 김남용"},{"t":"p","v":"· CD – 김형준"},{"t":"p","v":"· 디자인 – 최은영"},{"t":"p","v":"· 기간 – 2017년 10월 1일~2018년 4월 30일"},{"t":"p","v":"· URL – http://www.hppcompany.com/main.jsp"},{"t":"p","v":"· 문의 – aprilleaf@gmail.com"}],"hero":{"src":"/images/work/p1016/01.webp","alt":"2017 HPP 웹사이트 신규 구축 — 이미지 1","w":757,"h":2560},"details":[],"extra":[],"credits":[{"k":"고객사","v":""},{"k":"수행사","v":""},{"k":"기간","v":""},{"k":"PM","v":""},{"k":"디렉터","v":""},{"k":"기획","v":""},{"k":"디자인","v":""},{"k":"퍼블리싱","v":""}]},{"slug":"p986","title":"2017 일진디스플레이 공식 웹사이트 개편","label":"일진디스플레이 개편","layout":"C","date":"2017-06-01","year":"2017","lead":"7년전 개편된 후 운영조차 제대로 이뤄지지 않아온 자사의 웹사이트를 둔, 실무진의 가장 큰 요구사항은 \"모바일에서도 볼 수 있게 해달라\"는 것이었다. 또 자사의 제품이 실제 어떤 제품에 어떻게 쓰이는지를 일반인들에게 설명하고 싶다고 했다. 이는 중소형 B2B 기업 실무자 대부분의 요구사항이기도 했다. 반면, 착수보고 자리에서 뵌, 박제승 대표이사님의 요구사항은 결이 좀 달랐다. \"단순한 디스플레이 제조 업체가 아닌, '솔루션 프로바이더'로서 글로벌 마케팅 역량을 강화하고 싶다.\"는 것이었다.","body":[{"t":"p","v":"일진디스플레이는 터치스크린과 LED의 핵심 소재인 잉곳, 웨이퍼를 생산, 판매하는 기업이다. 터치스크린은 휴대폰, 냉장고, 자동차, 웨어러블 기기 등 'Touch'로 명령을 송,수신 하는 대부분의 전자제품에 쓰인다."},{"t":"p","v":"성장세를 계속해오던 일진디스플레이는 태블릿 시장의 침체와 OLED 기반의 터치방식에 밀려 2015년,2016년 2년 연속 적자를 냈다. 일진그룹은 이를 타개하기 위해, 2016년 12월 박제승 삼성SDI총괄부사장을 대표이사로 영입한다."},{"t":"p","v":"박제승 대표는 홈페이지 개편 당시 현재 일진디스플레이가 터치스크린을 주력으로 생산하지만, 향후에는 포스터치, 플렉시블, Micro-LED 등으로 제품과 기술 범위가 확대할 계획이라고 말했다."},{"t":"p","v":"슬로건 & 카피라이팅"},{"t":"p","v":"새로운 웹사이트에서는 이러한 메시지를 담되, 메인화면에서는 일반인들도 이해할 수 있는 전달 방법을 고민했다. 그 결과, 새로운 '온라인 슬로건'을 개발하고, 모션그래픽을 활용하여, 일진디스플레이의 기술, 제품의 특장점을 설명했다."},{"t":"p","v":"TOUCH TOMORROW"},{"t":"p","v":"차세대 입력 솔루션 전문 기업, 일진디스플레이"},{"t":"p","v":"FORCE TOUCH! GO BEYOND THE TOUCH"},{"t":"p","v":"차세대 입력 솔루션 포스터치 전문 기업, 일진디스플레이"},{"t":"p","v":"LIGHT UP YOUR LIFE"},{"t":"p","v":"LED 핵심 소재 사파이어 웨이퍼 전문 기업, 일진디스프레이"},{"t":"p","v":"부품소재 제품의 표현"},{"t":"p","v":"실무자들의 고민을 해결하기 위해, 일진디스플레이의 제품 리스트와 그것들이 사용되는 소비재의 목록을 작성, 정리(매칭)했다. 그리고, 프로토타입 디자인 과정을 통해서, 일진디스플레이 생산 제품의 사진 촬영 각도와 화각, 배경색 등을 정의하고, 디스플레이 제품 전체를 평택에서 서울 스튜디오로 공수해 미리 정의한 화각대로 사진 촬영을 진행하였다. 그 후, 웹사이트의 버튼을 클릭할 때마다, '디스플레이'가 실제 전자제품에 사용되는 모습을 간접체험할 수 있도록 하였다."},{"t":"p","v":"아쉬움"},{"t":"p","v":"개편 당시, 일진디스플레이 웹사이트는 7년전 개편 당시의 모습으로 운영이 거의 되지 않고 있었다. <공지사항>과 <보도자료> 콘텐츠를 메인화면에 노출하는 것을 두고, \"지난 7년간 되지 않던 운영이, 향후에는 정상적으로 이뤄질 것인가?\"를 우려했다. 영문 사이트는 더더욱. 하지만, 고객의 의지에 따라 해당 콘텐츠를 메인화면에 노출했다. 그 결과, 2017년 9월 8일 개편 이후 6개월 동안 새로 업데이트된 콘텐츠는 없다."},{"t":"p","v":"누군가 담당자를 찾아 내서 탓하기는 어렵다. 대기업이 아니면, B2B 부품소재 생산 기업 중에 디지털 업무를 전담하는 인력은 찾아보기 어렵기 때문이다. 경영기획, 마케팅, 영업, 관리, 총무 등의 업무를 병행하는 인력에 디지털 커뮤니케이션 업무는 어색하거나 어렵거나 귀찮은 가욋일일 수밖에 없다."},{"t":"p","v":"계산기와 엑셀 시트에 그 결과를 도저히 담을 수 없는 일이 있는데 디자인과 브랜딩, 커뮤니케이션 같은 업무가 그렇다."},{"t":"p","v":"· 프로젝트 - 일진디스플레이 웹사이트 개편"},{"t":"p","v":"· 고객사 - 일진디스플레이"},{"t":"p","v":"· PM/기획 - 김남용"},{"t":"p","v":"· 디자인 - 조낙현"},{"t":"p","v":"· 퍼블리싱 - 김노라"},{"t":"p","v":"· 개발 - 전동표"},{"t":"p","v":"· 사진 - chiek imaging(지중근 대표)"},{"t":"p","v":"· 영상 - GVLABSTUDIO(이윤성 감독)"},{"t":"p","v":"· 기간 - 2017.06 ~ 2017.09"},{"t":"p","v":"· URL - www.iljindisplay.co.kr"},{"t":"p","v":"· 문의 - aprilleaf@gmail.com"}],"hero":{"src":"/images/work/p986/01.webp","alt":"2017 일진디스플레이 공  (영써티, 영포티)"},{"t":"p","v":"· 프로젝트 - 한화생명 공식 블로그, 라이프앤톡 개편 컨설팅 및 구축 (PM)"},{"t":"p","v":"· 수행사 - PIXDINE"},{"t":"p","v":"· 컨설팅 PM - 김남용"},{"t":"p","v":"· UI 기획 - 김무성"},{"t":"p","v":"· FGI - 한국리서치(FGI)"},{"t":"p","v":"· 기간 - 2016.4 ~ 2016.10 (1, 2차)"},{"t":"p","v":"· URL - http://www.lifentalk.com"},{"t":"p","v":"· 문의 - aprilleaf@gmail.com"}],"hero":{"src":"/images/work/p967/01.webp","alt":"2016 한화생명 공식블로그 개편 컨설팅 및 구축 — 이미지 1","w":900,"h":1243},"details":[],"extra":[],"credits":[{"k":"고객사","v":""},{"k":"수행사","v":""},{"k":"기간","v":""},{"k":"PM","v":""},{"k":"디렉터","v":""},{"k":"기획","v":""},{"k":"디자인","v":""},{"k":"퍼블리싱","v":""}]},{"slug":"p957","title":"2014 일진그룹 웹콘텐트 제작 및 카피라이팅","label":"일진그룹 카피라이팅","layout":"C","date":"2014-02-01","year":"2014","lead":"ILJIN MUSEUM","body":[{"t":"p","v":"Next Step"},{"t":"p","v":"INNOVATION STORY"},{"t":"p","v":"LIFE@ILJIN"},{"t":"p","v":"대한민국 원조 벤처기업\n1968년 창립한 일진그룹은 국내 대기업 순위 50위에 해당하지만, 여전히 '대한민국 원조 벤처기업'을 내세운다. 전력인프라, 소재, 부품, IT 분야에 28개 계열사로 구성되어 있는데, 모두 '기술'과 '혁신'을 중시한다."},{"t":"p","v":"문제는, B2B 기업이다 보니, 일반 사회와 대중들에게 인지도가 의외로 높지 않다는 점이다. 구체적으로 무엇을 만들고, 그것이 사회를 어떻게 개선하는지, 우리의 삶과 어떤 관련성이 있는지 알려줄 필요가 있다고 생각했다."},{"t":"p","v":"The Next Step\n그렇게 생각한 첫 번째 콘텐트가 <The Next Step>이다. 일진그룹 생산품 하나 하나를 뜯어 놓고 보면, 일반인들이 이해하기 어렵다. 하지만, 그런 혁신과 기술들이 어떤 완제품에 사용될 때, 그것이 우리의 삶과 미래에 큰 영향을 준다. 예를 들어, 일진머티리얼즈가 생산하는 '일렉포일'은 전기자동차의 대용량 배터리의 핵심 부품이다. 그리고, 일진복합소재의 연료탱크기술은 향후 수소차의 상용화와 관련이 있다. 일진 제강의 파이프는 자동차 제조 공장의 산업용 로봇에 쓰일 수 있다. 이렇게 일진 계열사의 기술들이 우리의 미래를 만들어가는 원천이 된다."},{"t":"p","v":"이런 생각 하에서, 우리의 미래 키워드를 <통일>, <전기자동차>, <모바일>, <에너지>, <그린에너지>, <의료기기>, <도시미학>으로 꼽고, 키워드별로 일진그룹 계열사들의 기술과 혁신 제품을 소개했다."},{"t":"p","v":"이노베이션 스토리\n일진그룹은 규모와 매출액 대비 많은 연구소를 보유하고 있는 기업이다. 창업주, 허진규 회장 스스로 서울대 금속공학과 및 ROTC 1기 출신으로, '엔지니어야말로 21세기 혁신과 기술 전쟁 시대의 장수'라고 말할 정도이다. 따라서, 전국에 흩어져 있는 그룹의 핵심 연구소 5곳의 인재를 찾아가, 연구소의 활동과 앞으로의 비전에 대해 인터뷰했다."},{"t":"p","v":"이노베이션 스토리 바로가기 →"},{"t":"p","v":"라이프@일진\n10개 계열사를 찾아, 임직원 인터뷰를 통해, 계열사의 일과, 직무별 업무에 대한 소개, 취업준비생들에게 바라는 점 등을 인터뷰했다."},{"t":"p","v":"라이프@일진 바로가기 →"},{"t":"p","v":"ILJIN MUSEUM\n마지막으로, <일진의 역사>, <일진의 기술>, <일진 리더십>을 연대별로 정리한 마이크로 홍보 사이트, <ILJIN MUSEUM>을 구축했다. 공은 가장 많이 들였지만, 가장 부족한 콘텐트 페이지가 되어 버렸다. 시안 단계부터 반응형웹에 적합하지 않았는데, 내부적인 사정 탓에, 크리에이티브 디렉터도, PM도, 디자이너도, 퍼블리셔도 외면해 버렸다. 고객사에서는 '디자인 시안'을 마음에 들어 해서, 시안을 변경할 기회도 놓쳐버렸다. 오픈일이 다가올수록 예상하거나, 예상하지 못한 문제들이 불거졌다. 우여곡절 끝에, 일부 페이지를 '모바일 웹'으로 변경하면서 오픈은 했지만, 언제 보아도, 부족한 결과물이 되어 버렸다.\nILJIN MUSEUM 바로가기 →"},{"t":"p","v":"참고 - <월간 w.e.b> 2015년 5월호 기고문 – 불가능의 파도에 맞선다"},{"t":"p","v":"일진그룹 바로가기 →"}],"hero":{"src":"/images/work/p957/01.webp","alt":"2014 일진그룹 웹콘텐트 제작 및 카피라이팅 — 이미지 1","w":803,"h":422},"details":[{"src":"/images/work/p957/02.webp","alt":"2014 일진그룹 웹콘텐트 제작 및 카피라이팅 — 이미지 2","w":900,"h":766},{"src":"/images/work/p957/03.webp","alt":"2014 일진그룹 웹콘텐트 제작 및 카피라이팅 — 이미지 3","w":900,"h":791},{"src":"/images/work/p957/04.webp","alt":"2014 일진그룹 웹콘텐트 제작 및 카피라이팅 — 이미지 4","w":900,"h":791}],"extra":[],"credits":[{"k":"고객사","v":""},{"k":"수행사","v":""},{"k":"기간","v":""},{"k":"PM","v":""},{"k":"디렉터","v":""},{"k":"기획","v":""},{"k":"디자인","v":""},{"k":"퍼블리싱","v":""}]},{"slug":"p950","title":"2014 일진그룹 대표 웹사이트 개편","label":"일진그룹 웹사이트 개편","layout":"C","date":"2014-02-01","year":"2014","lead":"일진그룹은 2006년 이후 9년 동안 웹사이트를 개편하지 않았다. 때문에, 반응형웹, 웹접근성 준수 등 2014년 현재의 웹트렌드를 따라가지 못하는 측면이 많았다. 다른, 많은 B2B 기업과 마찬가지로 일진그룹은 반응형웹과 웹접근성 적용을 요구했다.","body":[{"t":"p","v":"2014 일진그룹 대표 웹사이트 개편"},{"t":"p","v":"· 프로젝트 - 일진그룹 웹사이트 리뉴얼 제안 및 구축 (2014)"},{"t":"p","v":"· 제안 PM - 김남용"},{"t":"p","v":"· 구축 PM - 김남용"},{"t":"p","v":"· 콘텐츠 기획/제작 - 김남용"},{"t":"p","v":"· 기획 PL - 정지영"},{"t":"p","v":"· 디자인 - 김지연, 이주희, 유명곤"},{"t":"p","v":"· 퍼블리싱 - 박진희"},{"t":"p","v":"· 개발 - 연규환"},{"t":"p","v":"· 기간 - 2014.02~2015.03"},{"t":"p","v":"· URL - http://www.iljin.co.kr"},{"t":"p","v":"· 문의 - aprilleaf@gmail.com"}],"hero":{"src":"/images/work/p950/01.webp","alt":"2014 일진그룹 대표 웹사이트 개편 — 이미지 1","w":900,"h":528},"details":[{"src":"/images/work/p950/02.webp","alt":"2014 일진그룹 대표 웹사이트 개편 — 이미지 2","w":900,"h":511},{"src":"/images/work/p950/03.webp","alt":"2014 일진그룹 대표 웹사이트 개편 — 이미지 3","w":900,"h":511}],"extra":[],"credits":[{"k":"고객사","v":""},{"k":"수행사","v":""},{"k":"기간","v":""},{"k":"PM","v":""},{"k":"디렉터","v":""},{"k":"기획","v":""},{"k":"디자인","v":""},{"k":"퍼블리싱","v":""}]},{"slug":"p942","title":"2013 국제종합기계 웹사이트 개편 제안","label":"국제종합기계 개편제안","layout":"C","date":"2013-11-01","year":"2013","lead":"국제종합기계는 국내 3위 농기계 전문 기업이다. 농기계의 강인함을 매력적으로 보여주기 위해, 핵심 기능에 포커싱된 풀스크린 영상으로 메인 비주얼 그래픽을 제안했다. 내용적으로는, 제품 정보와 함께 '농기계로 인한 일의 효용성, 농생활의 편익 증대'를 실제 농민 인터뷰 또는 제작 콘텐트로 보여주고 싶었다. 특히, 일회적인 콘텐트가 아니라, 계속해서 업데이트 될 수 있기를 바랐다.","body":[{"t":"p","v":"가장 고민한 점은, 농기계를 구입할 때, 해당 제조업체의 홈페이지를 참고할만한 농민이 얼마나 되느냐? 하는 문제였다. 농사를 짓는 작은 아버지들을 상상할 때, 그런 일은 거의 없을 것 같았다. 반면, 젊은 귀농인들은 그럴 수도 있을 것이라는 의견도 개진되었다. 개인적으로, 이러한 비즈니스의 경우, DM이나 프린트화된 카탈로그가 훨씬 더 마케팅에 도움이 될 것이라고 생각이 든다."},{"t":"p","v":"그래서, 웹과 모바일은 그러한 자료들을 보관, 전달해주는 '2차적인' 마케팅 도구로서 기능하고, 제조업체와 대리점주간에도 전달, 공유, 활용할 수 있는 콘텐트와 시스템을 갖추면 좋겠다고 생각한다. 문제는, 제조업 특성상, 그러한 시스템을 구축할 필요를 그다지 느끼지 못하는 것이었고, 구현을 하고 싶다고 해도 예산의 제약이 너무나도 크다는 점이다."},{"t":"p","v":"prototype A"},{"t":"p","v":"prototype B"},{"t":"p","v":"prototype C"},{"t":"p","v":"· 프로젝트 - 국제종합기계 웹사이트 리뉴얼 (2013)"},{"t":"p","v":"· PM - 김남용"},{"t":"p","v":"· CD - 김형준"},{"t":"p","v":"· 디자인 - 김지연, 이주희, 조낙현"},{"t":"p","v":"· 기간 - 2013.11 (구축 2014.04 ~ 2014.08)"},{"t":"p","v":"· URL - www.kukje21.co.kr"},{"t":"p","v":"· 문의 - nykim@graviti.co.kr"}],"hero":{"src":"/images/work/p942/01.webp","alt":"2013 국제종합기계 웹사이트 개편 제안 — 이미지 1","w":900,"h":643},"details":[{"src":"/images/work/p942/02.webp","alt":"2013 국제종합기계 웹사이트 개편 제안 — 이미지 2","w":900,"h":643},{"src":"/images/work/p942/03.webp","alt":"2013 국제종합기계 웹사이트 개편 제안 — 이미지 3","w":900,"h":506},{"src":"/images/work/p942/04.webp","alt":"2013 국제종합기계 웹사이트 개편 제안 — 이미지 4","w":900,"h":506},{"src":"/images/work/p942/05.webp","alt":"2013 국제종합기계 웹사이트 개편 제안 — 이미지 5","w":803,"h":760}],"extra":[],"credits":[{"k":"고객사","v":""},{"k":"수행사","v":""},{"k":"기간","v":""},{"k":"PM","v":""},{"k":"디렉터","v":""},{"k":"기획","v":""},{"k":"디자인","v":""},{"k":"퍼블리싱","v":""}]},{"slug":"p937","title":"2013 유니온스틸 웹사이트 개편 제안","label":"유니온스틸 개편","layout":"C","date":"2013-08-01","year":"2013","lead":"이야기는 어느 곳에나 있다!","body":[{"t":"p","v":"유니온스틸은 동국제강의 계열사로 글로벌 No.1 컬러강판 전문 기업이다(2015년 동국제강에 흡수합병). 강판은 건물 외장재, 내장재 등에 쓰이는데, 유니온스틸은 여기에 컬러 도색이나 패턴 디자인을 넣어 건축물의 미를 높이는데 일조하고 있다. B2B 제품이지만 일반 소비자도 직접적으로 접하는 특징을 갖는다. 일반 소비자들에게 컬러강판에 관한 이야기를 들려주고 싶었다."},{"t":"p","v":"스토리 - B2B 기업의 가치를 어떻게 알릴 것인가?"},{"t":"p","v":"'사회적 가치'를 만드는 에피소드 - 담당자도 모르는, 숨은 이야기들의 가치"},{"t":"p","v":"\"바퀴벌레 퇴치용 강판 이야기 들어보셨어요?\""},{"t":"p","v":"이야기 거리가 별로 없다고 한사코 손사래를 치던 담당자 왈, 강판에 컬러를 입힐 때, 바퀴벌레가 싫어하는 재료를 넣어, 건물 내 바퀴벌레 서식 확률을 줄이려는 제품이 실제 개발됐었다고 한다. '왜 출시되지 않았을까?'하는 궁금증이 들 정도로 획기적인 생각이었다. 또, 태풍 매미가 불어 닥쳐 한반도 남쪽 어린이집의 지붕이 날아가 버린 적이 있었는데, 이 이야기를 듣고 유니온스틸 대표님의 지시로 어린이집 지붕을 컬러강판으로 설치해준 적도 있단다."},{"t":"p","v":"개인적으로 못지 않게 재미있었던 이야기는, 프로야구 기아타이거즈 2군팀의 전용 연습장을 짓는데, 유니온스틸 컬러강판을 무상으로 기증했다는 내용이었다. 이야기를 들을 때마다, '꿈', '희망'과 같은 단어들이 떠올랐다. \"이야기요? 뭐 철판 만드는 회사에 재미있는 이야기가 있겠어요?\"라고 말한, 담당자의 입에서 주옥 같은 이야기가 쏟아졌다."},{"t":"p","v":"이야기를 디자인하자!"},{"t":"p","v":"이 이야기를 해야겠다고 결심했다. 4개의 이야기를 담은 메인비주얼을 시안으로 디자인했으면 좋겠고, 구축 후에도, 이런 이야기들이 계속 발굴되어 업데이트 되기를 바랐다. 하지만, 그때 이미 알고 있었다. 마케팅의 목적이 앞에 선, '보도자료' 같은 이야기들로 대체 되어 갈 것이라는 사실을 ㅠㅠ."},{"t":"p","v":"꿈으로 채운 삼각 지붕집 - 태풍 매미가 휩쓸고 간, 어린이집 지붕"},{"t":"p","v":"미래를 향한 꿈과 희망 - 프로야구 기아타이거즈 2군팀 전용 연습장"},{"t":"p","v":"스틸, 쉼을 짓다"},{"t":"p","v":"시간의 흐름을 디자인하다"},{"t":"p","v":"· 프로젝트 - 유니온스틸 웹사이트 리뉴얼 (2013)"},{"t":"p","v":"· 고객사 - 유니온스틸"},{"t":"p","v":"· 에이전시 - 그라비티인터랙티브"},{"t":"p","v":"· PM - 김남용"},{"t":"p","v":"· CD - 김형준"},{"t":"p","v":"· 디자인 - 김지연, 이주희"},{"t":"p","v":"· 기간 - 2013.08 ~ 2013.10"},{"t":"p","v":"· URL - http://www.unionsteel.co.kr"},{"t":"p","v":"· 문의 - aprilleaf@gmail.com"}],"hero":{"src":"/images/work/p937/01.webp","alt":"2013 유니온스틸 웹사이트 개편 제안 — 이미지 1","w":824,"h":618},"details":[{"src":"/images/work/p937/02.webp","alt":"2013 유니온스틸 웹사이트 개편 제안 — 이미지 2","w":900,"h":1630},{"src":"/images/work/p937/03.webp","alt":"2013 유니온 bp","alt":"2013 Daum 지속가능성보고서 사이트 개편 — 이미지 1","w":900,"h":621},"details":[],"extra":[],"credits":[{"k":"고객사","v":""},{"k":"수행사","v":""},{"k":"기간","v":""},{"k":"PM","v":""},{"k":"디렉터","v":""},{"k":"기획","v":""},{"k":"디자인","v":""},{"k":"퍼블리싱","v":""}]},{"slug":"p860","title":"2013 세아그룹 웹사이트 개편 제안 및 구축","label":"세아그룹 개편","layout":"A","date":"2013-04-01","year":"2013","lead":"세아그룹은 B2B 기업으로서는 보기드물게 브랜드 아이덴티티 정립과 대내/외 커뮤니케이션을 중시하는 기업이다. 2013년도 세아그룹은 철학과 핵심가치를 새롭게 정리했다. 정직, 열정, 실력의 3가지 철학 키워드와 9개의 핵심가치로 체계화한 것이다. 개편한지 2년 밖에 되지 않았지만, 이를 반영하기 위하여 웹사이트 개편 작업이 진행되었다.","body":[{"t":"p","v":"상황 - 세아의 핵심가치와 '랜드마크'"},{"t":"p","v":"반면, 일반인들은 '세아'를 잘 모른다. 무엇을 만드는 기업인지 잘 모르고, 세아그룹이 지향하는 바가 무엇인지에 대하여 관심이 없다. 어떻게 하면, 세아를 사람과 생활에 '밀착'되게 할 수 있을까? 하는 점을 고민으로 삼았다."},{"t":"p","v":"아이디어 1 - 일기예보와 비주얼리티"},{"t":"p","v":"나 스스로도 '얄팍하지 않나?' 고민하며 낸 아이디어가, '메인 페이지를 날씨와 연동하자!'는 것이었다. 일기예보 제공업체에 문의해 보니, '날씨'의 유형이 생각보다 다양하지 않았다. 정확하진 않지만, 12개가 아니었나 싶다. 따라서, 12개의 비주얼을 만들어 놓고, 비가 올 때는 비가 오는, 눈이 올 때는 눈이 오는 모습의 비주얼이 노출되도록 하면 어떨까? IP 기준으로, 지역별로 현재 '기온'도 노출시켜주고 말이다. 엄청난 친절은 아니지만, '기업 웹사이트'에 접속했을 때, 창 밖의 날씨와 같은 느낌을 모니터에서 받을 수 있다는 정도의 '위트'라고 생각하면 어떨까? 지하철을 타고 가다가, 우연히 세아그룹 홈페이지에 접속했을 때, 첫눈이 내린다는 소식을 접하면 어떨까? \"우리는 사람과 생활을 생각하는 기업입니다.\"라는 메시지를 전달하고 싶었다."},{"t":"p","v":"아이디어 2 - 철의 철학, 세아의 핵심가치, 그리고 비주얼리티"},{"t":"p","v":"좀더 나아가서, 그렇다면 12장의 비주얼은 어떻게 만들 수 있을까? '철'이 만들어지는 과정을 공부했다. 숯을 연료로 1,000도가 넘는 고온에서 철광석이나 사철을 녹인 후, 수만 번 반복해서 내려 철을 만드는 과정에서 제련, 단조, 주조, 압연 등의 12개 키워드를 꼽았다. 이것을 12개의 '철학과 핵심키워드'와 연결 짓고 관련 카피를 썼다. 그리고, 이러한 (1) 철이 만들어지는 과정과 키워드 (2) 세아의 철학과 핵심가치를 다시 (3) '날씨 유형'과 의미적으로 연결짓고, '철'을 상징화한 세아의 로고타입에 비주얼 그래픽 작업을 완료했다."},{"t":"p","v":"지금은 사라지고 없지만, 카피라이팅을 위해 밤을 새워 공부하고, 고민했던 날들이 생각난다. 어쩌면 아무도 읽어주지 않을 글자들.......(실제로 오픈 후에 2~3줄 서브 카피는 모두 없앴다). '아무도 모를 거야'라고 생각했는데, 그 해 웹어워드에서 최우수상을 수상했다."},{"t":"p","v":"사람들은 세아의 메인페이지를 보고 어떤 느낌을 받을까? 참, 그런데, 구축할 때나 지금이 마음 속에 해결되지 않는 문제가 하나 있다. '기업의 철학과 핵심가치'를 굳이 '일반 이용자'에게 전달할 필요가 있었을까?"},{"t":"p","v":"생각의 흐름"},{"t":"p","v":"· '세아타워' - 서울 서부권의 랜드마크 + 세아의 제품은 안쓰이는 곳이 없다(상하수도관, 자동차 배관, 수세미...) → '생활밀착형 기업?' → '날씨' 따라 '메인비주얼' 연동"},{"t":"p","v":"· '세아'의 '핵심가치'가 새로 정립됨 → 3대 핵심 가치 + 9개 행동강령 → '철'이 만들어지는 주요 단계별 키워드 선정 → 카피 작성"},{"t":"p","v":"카피라이팅 노트"},{"t":"p","v":"철의 역사와 철의 생산 단계로부터 9개 키워드를 뽑아 세아의 9개 행동강령과 매치시키고 3대 핵심가치인 정직, 열정, 실력으로 그룹핑을 했다"},{"t":"p","v":"그리고, 날씨의 유형과 연관지어 그래픽 작업을 한 후, 날씨의 변화에 따라 연동되어 노출되도록 하였다."},{"t":"p","v":"(오픈 시점에 고객 요청으로 9개 카피 중 3개만 선별하여 사용한 것 같은데, 나머지 카피는 보관을 제대로 하지 않아 찾을 수가 없다)"},{"t":"p","v":"철의 정직"},{"t":"p","v":"불순물 0에 도전하는 정련(精鍊)의 마음"},{"t":"p","v":"바르고 곧은 지혜와 행동으로 세상을 아름답게 합니다."},{"t":"p","v":"-세상을 아름답게, 세아-"},{"t":"p","v":"철의 정직"},{"t":"p","v":"주형이 반듯해야 철이 반듯하듯이, 주물(鑄物)의 마음으로"},{"t":"p","v":"기본과 원칙을 지켜 세상을 아름답게 하는 힘, 세아의 정직입니다."},{"t":"p","v":"-세상을 아름답게, 세아-"},{"t":"p","v":"철의 정직"},{"t":"p","v":"해갈하는 단비처럼, 물꼬를 트는 마중물처럼"},{"t":"p","v":"감사와 겸허의 마음으로 더불어 함께 살아가는 마음, 세아의 정직입니다."},{"t":"p","v":"-세상을 아름답게, 세아-"},{"t":"p","v":"철의 열정"},{"t":"p","v":"천둥번개 같은 힘과 열로 가득찬 용광로처럼"},{"t":"p","v":"도전으로 들끓는 정신, 세아의 열정입니다."},{"t":"p","v":"-세상을 아름답게, 세아-"},{"t":"p","v":"· 프로젝트 - 세아그룹 웹사이트 리뉴얼 (2013)"},{"t":"p","v":"· 고객사 - 세아홀딩스"},{"t":"p","v":"· 에이전시 - 그라비티인터랙티브"},{"t":"p","v":"· PM - 김남용"},{"t":"p","v":"· PL - 정지영"},{"t":"p","v":"· CD - 김형준"},{"t":"p","v":"· 디자인 - 이주희"},{"t":"p","v":"· 카피라이팅 - 김남용"},{"t":"p","v":"· 퍼블리싱 - 박진희"},{"t":"p","v":"· 개발 - 연규환"},{"t":"p","v":"· 기간 - 2013.04 ~ 2013.06"},{"t":"p","v":"· URL - https://www.seah.co.kr"},{"t":"p","v":"· 문의 - aprilleaf@gmail.com"}],"hero":{"src":"/images/work/p860/01.webp","alt":"2013 세아그룹 웹사이트 개편 제안 및 구축 — 이미지 1","w":900,"h":1197},"details":[{"src":"/images/work/p860/02.webp","alt":"2013 세아그룹 웹사이트 개편 제안 및 구축 — 이미지 2","w":900,"h":872}],"extra":[],"credits":[{"k":"고객사","v":""},{"k":"수행사","v":""},{"k":"기간","v":""},{"k":"PM","v":""},{"k":"디렉터","v":""},{"k":"기획","v":""},{"k":"디자인","v":""},{"k":"퍼블리싱","v":""}]},{"slug":"p866","title":"2013 대림산업 홈페이지 웹접근성 개편 제안","label":"대림산업 웹접근성","layout":"A","date":"2013-04-01","year":"2013","lead":"국내 민간기업 웹사이트의 웹접근성 준수가 의무화된 2013년도에 급하게 진행한 대림산업 홈페이지의 웹접근성 준수 프로젝트.","body":[{"t":"p","v":"2013년 4월 11일부터 장애인 차별금지 및 권리구제 등에 관한 법률이 시행되면서 공공기관을 비롯한 주요 민관기관의 웹 접근성 준수가 의무화되었다. 누구든지 신체적 · 기술적 여건과 관계없이 원하는 서비스를 이용할 수 있도록 웹 접근성을 보장할 것을 명시해놓고 있기 때문이다. 만약 이를 지키지 않아 고발되면 3년 이하의 징역 또는 3,000만 원 이하의 벌금을 물어야 한다.(http://bit.ly/21BlZua)"},{"t":"p","v":"2012년도 이후 국내 기업들의 '웹접근성' 프로젝트가 대량 발생했다. 너도 나도 앞다퉈 '웹접근성 인증서'를 받기 위해, 웹사이트 개선 또는 개편 작업을 단행했다. 대림산업도 마찬가지였다."},{"t":"p","v":"웹접근성 준수 프로젝트 유감"},{"t":"p","v":"하지만, 언제나 '이면(裏面)'도 있다. 웹접근성을 준수하는 것이 본래의 취지이지, '인증서 마크'를 푸터(Footer)에 게시하는 것이 목적이 아닌데도, 대부분의 기업은 '인증서' 획득에 골몰했다. 그래서 (진짜 장애인의 웹 사용을 깊이 고려하지 않은) 기계적인 웹접근성 프로젝트가 범람했고, 소위 웹접근성 '인증 기관'들은 '돈벌이'에 앞장 섰다."},{"t":"p","v":"실제로, '인증 기관 승인 심사'를 받기 위해, 갑자기, 3~4명에 불과한 직원을 늘리고, 사무실을 옮기는가 하면(다른 회사와 함께 쉐어하던 사무실을 단독 사무실로), 지체부자유 장애인을 고용했다가, 승인 심사에서 탈락하자마자 곧바로 해고하는 사람을 보기도 했다."},{"t":"p","v":"더군다나, 순수하게 심사와 인증 비용만 수백만원을 들여 획득한 인증서를 해마다 갱신하게 되어 있어서, 사업적으로는 실로 '대동강물'에 가깝다고 할 수 있다. 한번 획득한 인증서를 홈페이지 어딘가에 걸어 놓고, '깜박'하고 있다면, 어느날 인터넷에서 자사의 '이런 기사'를 보게 될지도 모른다."},{"t":"p","v":"KT, 케이티닷컴·올레닷컴 웹접근성 인증 6개월 넘게 무단 사용"},{"t":"p","v":"웹사이트 및 인터넷 서비스가 웹접근성을 반드시 준수해야 한다는 것에는 동의하지만, 단지 인증서를 홈페이지 구석에 게시하고 마는 방식이 아니라, 진지하게 '누구나 사용가능한 웹'을 고민하는 방향이었으면 좋겠다. 솔직히 말해, 웹접근성 도구로 웹사이트 전체를 모니터링 한 후에, 웹접근성 인증 기관에 심사를 의뢰하는 담당자와 에이전시, 클라이언트가 얼마나 될까? 현실적으로 불가능하다면, 실제 장애 및 환경적 제약을 가진 사람들이 직접 사용해보고, 그 결과를 공유해주며, 필요시 의견을 컨설팅 해줄 수 있는 기관이 있었으면 좋겠다. 기업의 돈이 '범람하는 인증서' 발급 비용으로 흘러가는 대신, 그러한 인력들의 인건비로 지급되었으면 좋겠다. '벌금 3,000만원'이라는 협박 대신, 그렇게 '공존' 할 수 있는 문화가 만들어졌으면 좋겠다."},{"t":"p","v":"· 프로젝트 - 대림산업 웹사이트 웹접근성 프로젝트 제안 및 진행 (2013)"},{"t":"p","v":"· 고객사 - 대림산업"},{"t":"p","v":"· 에이전시 - 그라비티인터랙티브"},{"t":"p","v":"· 제안(PM) - 김남용"},{"t":"p","v":"· 구축(PL) - 전민경"},{"t":"p","v":"· 기간 - 2013.04~2013.06"},{"t":"p","v":"· URL - https://www.daelim.co.kr"},{"t":"p","v":"· 문의 - aprilleaf@gmail.com"},{"t":"p","v":"※ Graphic source by BNPS Graphics, put together by User:Wcommons (http://www.nps.gov/hfc/carto/map-symbols.htm) [Public domain or Public domain], via Wikimedia Commons"}],"hero":{"src":"/images/work/p866/01.webp","alt":"2013 대림산업 홈페이지 웹접근성 개편 제안 — 이미지 1","w":900,"h":548},"details":[],"extra":[],"credits":[{"k":"고객사","v":""},{"k":"수행사","v":""},{"k":"기간","v":""},{"k":"PM","v":""},{"k":"디렉터","v":""},{"k":"기획","v":""},{"k":"디자인","v":""},{"k":"퍼블리싱","v":""}]},{"slug":"p870","title":"2013 동국제강/동국제강그룹 대표 웹사이트 개편 제안","label":"동국제강 개편","layout":"A","date":"2013-04-01","year":"2013","lead":"동국제강 웹사이트 개편 프로젝트. 동국제강은 철강을 만드는 기업이다. 생산 제품은 주로 조선, 정유, 해양플랜트 등에 쓰인다. 일반인들은 제품을 볼 기회가 별로 없다. '철강업계의 명품'으로 이미지메이킹을 하고 싶다고 했다. 나는 이야기를 만들고 싶었다. 동국제강만의 이야기.","body":[{"t":"p","v":"· 프로젝트 - 동국제강/동국제강그룹 웹사이트 리뉴얼 제안 (2013)"},{"t":"p","v":"· 제안 PM - 김남용"},{"t":"p","v":"· 구축 PM - 신경희"},{"t":"p","v":"· Creative Director - 김형준"},{"t":"p","v":"· 기간 - 2013.04~2013.09"},{"t":"p","v":"· URL - http://www.dongkuk.com, http://group.dongkuk.com"},{"t":"p","v":"· 문의 - aprilleaf@gmail.com"}],"hero":{"src":"/images/work/p870/01.webp","alt":"2013 동국제강/동국제강그룹 대표 웹사이트 개편 제안 — 이미지 1","w":900,"h":579},"details":[{"src":"/images/work/p870/02.webp","alt":"2013 동국제강/동국제강그룹 대표 웹사이트 개편 제안 — 이미지 2","w":900,"h":1477}],"extra":[],"credits":[{"k":"고객사","v":""},{"k":"수행사","v":""},{"k":"기간","v":""},{"k":"PM","v":""},{"k":"디렉터","v":""},{"k":"기획","v":""},{"k":"디자인","v":""},{"k":"퍼블리싱","v":""}]},{"slug":"p847","title":"2012 LG전자 MC연구소, '감성 Label' 프로토타입 제작","label":"LG전자 카피라이팅","layout":"A","date":"2012-08-01","year":"2012","lead":"LG전자 MC연구소에서 '휴대폰 디바이스 상의 알람 메시지 개선'을 위한 프로토타입 제작을 의뢰했다. 휴대폰을 이용할 때 다양한 알람 메시지를 보게 되는데, 제조사는 정확한 정보 전달을 중시하다 보니 사전적이고 기술적으로 문장을 작성하게 된다. 이것을 어떻게 하면 수용자 관점에서, 감성적으로 전달할 수 있을까? 하는 것이 과제였다. 우리는 연령대별로 선택할 수 있는 '언어팩'을 제공하면 재미있겠다는 생각을 했고, 우선 10대 후반~20대 이용자를 타겟으로 하는 '감성 Label 프로토타입'을 제안했다.","body":[{"t":"p","v":"휴대폰을 사용하다보면, 다양한 안내 메시지를 마주하게 된다. 이러한 문구는 대부분 '기술 용어'에 기반하고, '명확한 의미 전달'을 최우선으로 한다. 하지만, 너무 엄격하게 적용되는 과정에서, (1)지나치게 딱딱하거나 (2)오히려 어떤 의미인지 명확하지 않거나 (3)젊은 이용자들에게 이질적으로 느껴지는 등의 문제가 있다. 이 점을 개선하기 위해, '감성형 Lable'을 개발하여, '내비게이션 성우 선택 기능'처럼, 이용자가 선택, 사용할 있도록 하자는 취지에서, 그 타당성을 알아보기 위해 '감성 Label 프로토타입'을 제작했다. 예를 들면 다음과 같다."},{"t":"p","v":"1안. 친근감"},{"t":"p","v":"· Normal - 원 밖으로 움직이면 잠금해제됩니다."},{"t":"p","v":"· Emotional - 화면을 눌러보세요. / 동그라미 바깥 세상으로 이동해볼까요? / 더 큰 원을 만들면 시작합니다."},{"t":"p","v":"2안. 쉽게"},{"t":"p","v":"· Normal - 잠금 해제하려면 휴대전화를 바라보세요.(주의사항 : 얼굴 인식 잠금해제는 패턴, PIN 또는 비밀번호보다 안전하지 못합니다."},{"t":"p","v":"· Emotional - 얼굴을 알아보고 잠금 해제 할 수 있습니다. (주의: 정말 많이 닮은 사람과는 헷갈릴 수도 있어요. 패턴, PIN 또는 비밀번호 잠금해제는 본인과 닮은 사람도 열 수 없을 정도로 안전합니다.)"},{"t":"p","v":"3안. 감성형. '음슴체' 적용"},{"t":"p","v":"· Normal - 즐겨찾기와 자주 연락한 목록이 없습니다. / 알람을 삭제하시겠습니까?"},{"t":"p","v":"· Emotional - 즐겨찾기랑 자주 통화한 목록이 없ㅋ엉ㅋ. / 알람을 지운다는게 참트루?"},{"t":"p","v":"그런데, 프로젝트를 진행하면서, 실적용을 하기에는 상당한 어려움이 따를 것이라는 생각이 들었다. 일단 400개의 문장을 선별하여 작성했으나, 실제 '기능 메시지'의 양은 엄청나다. 현재의 문장 구성은 유사하거나, 반복되는 문장은 자동으로 변환되도록 개발하고, 검수만 하면 되도록 할 수 있지만, '감성형 Label'이라는 것은 상황별로 이해를 해야 하기 때문에, 문장 하나하나를 확인하고, 상황과 단계를 이해한 후, 개별적으로 작성해야 한다. 예컨데, 기존에는 어떤 이유로, 'A'를 'B'로 변경해야 할 경우, 그렇게 기술적으로 적용하면 되지만, '감성형 Lable'에서는 애시당초에, 상황과 단계별로 다른 단어를 사용하는게 '맛'인데, 나중에 일괄 변경이 어렵다. 하지만, 고민의 출발은 설득력이 있어 보인다. '다양한 감성 Label;이 빠르고, 다양하게, 자동으로 업데이트 된다면, 10대 후반~20대 이용자들은 큰 재미를 느낄 수 있을 것 같기는 하다."},{"t":"p","v":"· 프로젝트 - LG전자 MC연구소, 스마트폰 기술용어 개선 프로토타입 제작 (2012)"},{"t":"p","v":"· PM - 김남용(감성 Lable 프로토타입 가이드라인 제작, 디렉팅)"},{"t":"p","v":"· 카피라이팅 - 김지언"},{"t":"p","v":"· 수행기간 - 2012.08 ~ 2012.10"},{"t":"p","v":"· 문의 - aprilleaf@gmail.com"}],"hero":null,"details":[],"extra":[],"credits":[{"k":"고객사","v":""},{"k":"수행사","v":""},{"k":"기간","v":""},{"k":"PM","v":""},{"k":"디렉터","v":""},{"k":"기획","v":""},{"k":"디자인","v":""},{"k":"퍼블리싱","v":""}]},{"slug":"p843","title":"2012 중부재단 웹사이트 개편 제안 및 구축","label":"중부재단 개편","layout":"C","date":"2012-05-01","year":"2012","lead":"사회복지법인 중부재단 홈페이지 개편 프로젝트. 메뉴와 콘텐츠를 가변적으로, 그러니까 내용 뿐만 아니라 카테고리도 원할 때마다 생성, 수정, 삭제가 가능하게 해달라는 게 핵심 요구사항이었다. 중장기적으로 사업이 새로 생기고, 종료되곤 하는데, 그때마다 웹사이트를 개편할 수도 없고, 디자인과 퍼블 인력을 자체적으로 갖고 있지도 못하며, 운영 계약을 별도로 할 수도 없기 때문이다.","body":[{"t":"p","v":"중부재단은 중부도시가스가 설립한 사회복지법인이다. 2012년도 웹사이트 리뉴얼을 앞두고, 재단 측의 핵심적인 요청사항은 메뉴와 콘텐트를 가변적으로 운영할 수 있게 해달라는 것이었다. 즉, <1 Depth> 메뉴 구성도 재단측이 원할 때, 수정, 삭제 및 추가할 수 있게 하고, 사업별 <지원신청> 폼(Form)의 세부 항목도 사업별로 운영자가 다르게 설정하거나, 그 항목 자체를 수정, 삭제 및 추가할 수 있도록 해달라는 것이었다."},{"t":"p","v":"당연히, 첫 번째 이유는 한정된 예산 때문이었다. 운영 비용을 상시적으로 쓰고 싶어하지는 않아했고, 가능한 모든 것을 내부 운영 인력(Web에 관해서는 비전문가)이 직접 운영하고 싶어했다. 그렇게 되면, 기본적인 설계 단계부터 고려할 사항이 많았고, 실제 운영 과정을 면밀하게 시뮬레이션 해 보면서 발생할 수 있는 많은 경우에 대한 대응책도 함께 준비해야 했다."},{"t":"p","v":"하지만, 구축 비용 또한 적은 편이어서 개편 작업에 꽤 애를 먹었던 기억이 있다. 다만, 중부재단 담당자분들 한 분 한 분"},{"t":"p","v":"모두 친절하게 에이전시를 대하셨고, 우리의 일정이나 고충을 잘 참고 기다려 주셨다. 디자인에 대한 컨펌도 꽤 일찍 내주셨고, 화면설계서를 들고 가서 디테일하게 리뷰를 해드릴 때에도 인내심을 갖고 듣고, 의견을 주셨던 걸로 기억한다."},{"t":"p","v":"나는 제안을 담당하고 구축 초기에만 투입되었었는데, 혼자서 전체 프로젝트를 마무리한 (내가 만나본 가장 꼼꼼하고, 완벽을 추구하는 웹기획자), 최지은 과장의 능력 또한 큰 몫을 했다."},{"t":"p","v":"· 프로젝트 - 중부재단 웹사이트 리뉴얼 프로젝트 (2012)"},{"t":"p","v":"· 제안 PM - 김남용, 더파베르"},{"t":"p","v":"· 구축 PM - 최지은"},{"t":"p","v":"· 구축 PL - 김남용"},{"t":"p","v":"· 디자인 - 양재혁"},{"t":"p","v":"· 퍼블리싱, 개발 - 제이랩"},{"t":"p","v":"· 구축기간 - 2012.05 ~ 2012.08"},{"t":"p","v":"· URL - http://www.jbfoundation.or.kr"},{"t":"p","v":"· 문의 - aprilleaf@gmail.com"}],"hero":{"src":"/images/work/p843/01.webp","alt":"2012 중부재단 웹사이트 개편 제안 및 구축 — 이미지 1","w":900,"h":485},"details":[{"src":"/images/work/p843/02.webp","alt":"2012 중부재단 웹사이트 개편 제안 및 구축 — 이미지 2","w":900,"h":841}],"extra":[],"credits":[{"k":"고객사","v":""},{"k":"수행사","v":""},{"k":"기간","v":""},{"k":"PM","v":""},{"k":"디렉터","v":""},{"k":"기획","v":""},{"k":"디자인","v":""},{"k":"퍼블리싱","v":""}]},{"slug":"p850","title":"2012 Daum 지속가능성보고서 인쇄물 제작","label":"Daum CSR Print 2012","layout":"C","date":"2012-03-04","year":"2012","lead":"2012년 Daum 회사소개 홈페이지(http://www.daumcorp.com) 개편 작업과 함께, <2012 지속가능성 보고서> 페이지의 온라인 콘텐트 또한 새롭게 업데이트했다. 또, 이 내용을 바탕으로 국,영문 인쇄물도 발간했다. 인쇄물 버전을 위해 온라인의 9개 주요 내용 이외에 이해관계자 인터뷰, 이해관계자 설문 결과 등 더 많은 내용과 시각자료(이미지)를 보강했다.","body":[{"t":"p","v":"· 프로젝트 - DAUM 지속가능성 보고서 제작 (인쇄물, 국/영문, 2012)"},{"t":"p","v":"· 디렉터 - 정연주"},{"t":"p","v":"· 에디터 - 김남용, 최지은"},{"t":"p","v":"· 디자인 - AAA"},{"t":"p","v":"· 기간 - 2012.08 ~ 2012.10"},{"t" "},{"k":"수행사","v":""},{"k":"기간","v":""},{"k":"PM","v":""},{"k":"디렉터","v":""},{"k":"기획","v":""},{"k":"디자인","v":""},{"k":"퍼블리싱","v":""}]},{"slug":"p833","title":"2012 Daum 회사소개 사이트 영상 콘텐츠 제작","label":"Daum CSR Video 2012","layout":"C","date":"2012-03-02","year":"2012","lead":"2012년 더파베르와 그라비티인터랙티브는 다음커뮤니케이션(現 카카오) 회사소개 웹페이지 개편 및 지속가능성보고서 제작 프로젝트를 진행했다.","body":[{"t":"p","v":"<2012 지속가능성보고서>는 '제주'를 특집으로 꾸렸는데, 그라비티인터랙티브는 여기에 들어갈 동영상 콘텐츠들을 제작했다."},{"t":"p","v":"<Daum人 제주 24시>는 새로 지은 제주 사옥에서 생활하는 다음 직원들의 새로운 근무 환경과 문화를 다뤘고, <제주 사람들, Daum을 말하다>에서는 대학생, 부동산 중개인, 횟집 사장, 호프집 경영인, 셔틀버스 기사, 택시기사, 유치원 교사 등 제주 현지인들에게 Daum에 대해 물었다."},{"t":"p","v":"Daum人 제주 24시"},{"t":"p","v":"제주 사람들, Daum을 말하다"},{"t":"p","v":"· 프로젝트 - 2012 Daum 회사소개 사이트 영상 콘텐츠 제작"},{"t":"p","v":"· 고객사 - 다음커뮤니케이션"},{"t":"p","v":"· 에이전시/프로듀싱 - 더파베르"},{"t":"p","v":"· 연출/스크립트 - 정연주"},{"t":"p","v":"· 진행/섭외 - 김남용, 최지은"},{"t":"p","v":"· 촬영/편집 - 이윤성"},{"t":"p","v":"· 제작기간 - 2012.03 ~ 2012.09"},{"t":"p","v":"· 자료 - 2012 다음커뮤니케이션 지속가능성보고서 PDF"},{"t":"p","v":"· 문의 - aprilleaf@gmail.com"}],"hero":null,"details":[],"extra":[],"credits":[{"k":"고객사","v":""},{"k":"수행사","v":""},{"k":"기간","v":""},{"k":"PM","v":""},{"k":"디렉터","v":""},{"k":"기획","v":""},{"k":"디자인","v":""},{"k":"퍼블리싱","v":""}]},{"slug":"p829","title":"2012 Daum 회사소개 사이트 개편 제안 및 제작","label":"Daum 회사소개 개편","layout":"A","date":"2012-03-01","year":"2012","lead":"카카오와 합병되기 이전의 Daum 회사소개 사이트 개편 프로젝트. UI 개편에 그치지 않고, '즐거운 변화'라는 컨셉으로 Daum의 비전과 문화를 상징할 수 있는 약 20개의 이야기를 만들어 제주, 기업문화, 사회공헌, 도전이라는 4개의 카테고리에 담았다.","body":[{"t":"p","v":"2012년도 초에 Daum은 회사소개 사이트를 개편하고자 했다. 그라비티인터랙티브는 디자인과 개발, 더파베르를 기획과 콘텐트를 담당했다. 하지만, 디자인 컨펌이 계속 지연되었고, 해당 이슈에 대한 대응이 적절치 않아서, 더파베르는 자체적으로 디자이너를 투입해 문제를 해결해 나갔다."},{"t":"p","v":"일정 지연으로 인한 어려움"},{"t":"p","v":"초기에 있었던 디자인 컨펌이 늦어지면서, 전반적인 일정이 굉장히 지연되었으나, 후반부 일정이 충분히 확보되지 않음으로 해서, 구현 단계에서 많은 오류가 발생했고, 결국 오픈을 목전에 앞두고 고객사 테스트가 여러번 지연될 정도로 어려움이 많았던 프로젝트다."},{"t":"p","v":"에이전시에서 일하면서 겪는 '일정'의 문제 유형은 크게 2가지!"},{"t":"p","v":"하나, 고객사에서 무리하게 서두르는 경우! 내부 사정으로 오픈일은 정해져 있으나, 전반적인 내부 기획과 자료 준비 등이 부족한 상황이다. 이런 경우, 대행사는 더 많은 인력을 투입해서, 최대한 일정을 준수하기 위해 노력하지만, 일정 압박이 무리하면 무리할수록, 어느 정도의 '품질 저하'를 동반할 수밖에 없다."},{"t":"p","v":"둘, 고객사에서 지나치게 느긋할 경우! 3~4개월이면 될 프로젝트를 일부러 1년 이상 끌고 가는 경우가 있다. 이해할 수 없지만, 그런 경우가 발생하기도 한다. (1) 담당자가 여러 업무를 하고 있고, 'Web'은 중요도가 약한 '여러가지 일' 중의 하나이며, 사내에서 별로 중요하게 여기지 않거나, (2) 담당자가 나쁜 마음으로, '별것 아닌 일을 장기간 끌고 가면서, 실적으로 과시하고자 할 경우에 발생한다. (3) 또는, 완벽주의적 성향을 가진 고객사 담당자가 스스로의 의도나, 기준에 도달하지 않으면 컨펌을 내지 않아서, 다음 단계로 도저히 넘어갈 수 없는 경우다. 이번 프로젝트가 여기에 해당했다."},{"t":"p","v":"디자인 컨펌이 나야 다음 단계로 넘어가는데, 예정된 일정의 2/3가 도달할 때까지 그렇지 않았다. 그런데, 이런 경우, 책임은 양측에 있는 경우가 대부분이다. 대행사가 고객사를 만족시키지 못한 이유도 크기 때문이다. (4) 아울러, 이렇게 일정이 지연될 경우, 파생되는 또 하나의 문제인데, 대행사가 되려, 일정을 무리하게 서두르는 경우이다. 대행사 입장에서는 프로젝트가 일정대로 끝나야, 수금을 하고, 현금이 흐르는데, 예상치 못하게 일정이 지연되면, '회사 대표' 입장에서 당연히 일정을 서두르게 된다. 문제는 그 과정에서 비합리적인 의사결정이 많이 발생한다는 점이다. 예를 들어, 본 프로젝트의 후반부, 담당자가 4주가 필요하다고 보고를 했는데도 불구하고, 2주 안에 오픈하겠다고 고객사에게 전달이 되고, 결국 완료를 못해, '오픈 테스트'조차 허가가 나지 않았다. 고객사 내부적으로 다시 '테스트 일정'을 잡아야 했는데, 다른 고객사의 프로젝트들로 인해, 테스트 일정은 그로부터 4주 이후에 잡혀, 결론적으로, 일정이 더 지연되어 버리는 상황이 발생했다."},{"t":"p","v":"· 프로젝트 - 2012 DAUM 회사소개 사이트 개편"},{"t":"p","v":"· 에이전시 - 더파베르"},{"t":"p","v":"· 제안 PM - 김남용"},{"t":"p","v":"· 제안 CD - 양재혁"},{"t":"p","v":"· 구축 PM - 정연주"},{"t":"p","v":"· 구축 PL - 김남용, 최지은"},{"t":"p","v":"· 기간 - 2012.03 ~ 2012.09"},{"t":"p","v":"· 링크 - http://www.daumcorp.com"},{"t":"p","v":"· 자료 - 2012 다음커뮤니케이션 지속가능성보고서 PDF"},{"t":"p","v":"· 문의 - aprilleaf@gmail.com"}],"hero":{"src":"/images/work/p829/01.webp","alt":"2012 Daum 회사소개 사이트 개편 제안 및 제작 — 이미지 1","w":900,"h":827},"details":[],"extra":[],"credits":[{"k":"고객사","v":""},{"k":"수행사","v":""},{"k":"기간","v":""},{"k":"PM","v":""},{"k":"디렉터","v":""},{"k":"기획","v":""},{"k":"디자인","v":""},{"k":"퍼블리싱","v":""}]},{"slug":"p825","title":"2012 CJ E&M 뉴스사이트, enews24.net 개편 제안","label":"CJ E&M enews24 UI","layout":"A","date":"2012-02-01","year":"2012","lead":"CJ E&M에서 운영하는 연예 전문 뉴스 사이트 eNews24 개편 프로젝트. 개편 제안에 참여, 수주를 한 후 기획과 디자인 시안 작업까지 진행을 하였으나 고객사 내부 사정으로 중단되었다.","body":[{"t":"p","v":"eNEWS24 는 CJ E&M에서 운영하는 연예뉴스 사이트이다. 2012년 초에 사이트 리뉴얼 제안에 참여했고, 수주해서 초기 기획과 디자인 시안작업을 진행했다. 하지만, 고객사 내부 사정 (www.interest.met 구축에 집중)으로 중단되었다. 최근에 다시 방문해 보니, 기존 주소(www.enews24.net)가 enews24.interest.me로, 그리고 다시 enews24.tving.com으로(2018년도 3월 확인) 변경이 되었고, www.interest.me는 폐쇄, enews24는 개편 작업이 마무리 된 것을 알 수 있었다."},{"t":"p","v":"당시, 고객사 담당 팀장님께서 진행한 부분에 대한 금전적 보상을 신속하게 해주시며 굉장히 미안해하셨는데, 오히려 빠르고 깔끔한 마무리에 감사의 마음이 들었었다. 다만, 한 명의 Web - User 입장에서, pinterest의 아류작 같은 interest.me가 성공할 것이라고 생각하지는 않았다. 또, 'interest.me' 서비스를 중단 한 것 같은데도, 대중을 대상으로 하는 미디어의 도메인을 왜 여전히 'enews24.interest.me'로 유지하고 있는지 의문이다."},{"t":"p","v":"· 프로젝트 - 2012 CJ E&M 뉴스사이트, enews24.net 개편 제안"},{"t":"p","v":"· 고객사 - CJ E&M"},{"t":"p","v":"· 에이전시 - 더파베르"},{"t":"p","v":"· 제안 PM/PT - 김남용"},{"t":"p","v":"· 구축 PM - 김남용"},{"t":"p","v":"· 구축 PL - 정연주, 최지은"},{"t":"p","v":"· 디자인 - 양재혁"},{"t":"p","v":"· 기간 - 2012.02 ~ 2012.04"},{"t":"p","v":"· URL - http://www.enews24.net"},{"t":"p","v":"· 문의 - aprilleaf@gmail.com"}],"hero":{"src":"/images/work/p825/01.webp","alt":"2012 CJ E&M 뉴스사이트, enews24.net 개편 제안 — 이미지 1","w":900,"h":1175},"details":[],"extra":[],"credits":[{"k":"고객사","v":""},{"k":"수행사","v":""},{"k":"기간","v":""},{"k":"PM","v":""},{"k":"디렉터","v":""},{"k":"기획","v":""},{"k":"디자인","v":""},{"k":"퍼블리싱","v":""}]},{"slug":"p817","title":"2011 ADT시큐리티 대표 웹사이트 개편","label":"ADT시큐리티 개편","layout":"C","date":"2011-06-29","year":"2011","lead":"ADT 캡스 구축 이후 계열사인 ADT 시큐리티의 웹사이트 개편 작업도 진행했다. 고객의 요구사항은 ADT캡스와 같았다.","body":[{"t":"p","v":"· 프로젝트 - ADT 시큐리티 홈페이지 개편 (2011)"},{"t":"p","v":"· URL - www.adtsecurity.co.kr"},{"t":"p","v":"· 고객사 - ADT캡스"},{"t":"p","v":"· 에이전시 - 더파베르"},{"t":"p","v":"· 기간 - 2011.06 ~ 2011.09"},{"t":"p","v":"· PM - 김남용"},{"t":"p","v":"· CD - 소병구"},{"t":"p","v":"· 문의 - aprilleaf@gmail.com"}],"hero":{"src":"/images/work/p817/01.webp","alt":"2011 ADT시큐리티 대표 웹사이트 개편 — 이미지 1","w":900,"h":748},"details":[],"extra":[],"credits":[{"k":"고객사","v":""},{"k":"수행사","v":""},{"k":"기간","v":""},{"k":"PM","v":""},{"k":"디렉터","v":""},{"k"
