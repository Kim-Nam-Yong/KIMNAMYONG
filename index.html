t":"p","v":"Vol.02"},{"t":"p","v":"<Vol.02>는 '호기심(Curiosity)'를 주제로 다음과 같은 이야기를 다뤘다."},{"t":"p","v":"이 중에서, 나는 <PEOPLE>을 담당, '3인의 차 속을 엿보다'라는 주제로 국립무용단 수석무용수 이정윤, 가수 정엽, 소믈리에 황지미씨와 인터뷰, 스튜디오 촬영을 진행하고, 콘텐트를 제작했다."},{"t":"p","v":"﻿"},{"t":"p","v":"Vol.03"},{"t":"p","v":"Finder는 르노삼성자동차에서 2010~2012년도에 5차례 걸쳐 발행한 디진털매거진이다. 초기에 태블릿(아이패드, 갤럭시탭) 전용으로 발행되었고, 추후 스마트폰 버전도 추가되었다. 지금은 삭제되었는지 검색되지 않는다. <Vol.03>는 'Beyond the Expectation'을 주제로 다음과 같은 이야기를 다뤘다."},{"t":"p","v":"이 중에서, 나는 <PEOPLE>을 담당, '소리 위를 걷다'라는 주제로 가수 이은미씨와 인터뷰, 스튜디오 촬영을 진행하고, 콘텐트를 제작했다. 또, <INSIGHT>를 위한 남해 사진 촬영을 <스튜디오643> 아놀드박 실장님과 함께 진행했다."},{"t":"p","v":"Vol.04"},{"t":"p","v":"Finder는 르노삼성자동차에서 2010~2012년도에 5차례 걸쳐 발행한 디진털매거진이다. 초기에 태블릿(아이패드, 갤럭시탭) 전용으로 발행되었고, 추후 스마트폰 버전도 추가되었다. 지금은 삭제되었는지 검색되지 않는다. <Vol.04>는 'URBANNIZED'을 주제로 다음과 같은 이야기를 다뤘다."},{"t":"p","v":"이 중에서, 나는 <DISCOVERE>를 담당, '어반 폴리 인 아일랜드'라는 주제로 제주에 불시착한 사람들과 예술에 대한 이야기를 취재하고 썼다. 또, <PEOPLE>을 담당, '도시남녀'라는 주제로 배우 오병진, 아나운서 김민아씨와 인터뷰, 스튜디오 촬영을 진행하고, 콘텐트를 제작했다."},{"t":"p","v":"· 프로젝트 - 르노삼성 디지털매거진, <Finder> vol.02 ~ vol.04 콘텐트 제작 (2011)"},{"t":"p","v":"· 2010.12 ~ 2011.12"},{"t":"p","v":"· 고객사 - 르노삼성자동차"},{"t":"p","v":"· 에이전시 - 미디어포스 (PM, 디자인, 퍼블리싱), 더파베르(콘텐츠)"},{"t":"p","v":"· 편집장 - 정연주"},{"t":"p","v":"· 에디터 - 김남용, 최지은"},{"t":"p","v":"· 사진 - 타임오브블루"},{"t":"p","v":"· 영상 - 인영컴스"},{"t":"p","v":"· 문의 - aprilleaf@gmail.com"}],"hero":{"src":"/images/work/p794/01.webp","alt":"2011 르노삼성 디지털매거진  콘텐트 제작 — 이미지 1","w":900,"h":675},"details":[{"src":"/images/work/p794/02.webp","alt":"2011 르노삼성 디지털매거진  콘텐트 제작 — 이미지 2","w":900,"h":675},{"src":"/images/work/p794/03.webp","alt":"2011 르노삼성 디지털매거진  콘텐트 제작 — 이미지 3","w":900,"h":675},{"src":"/images/work/p794/04.webp","alt":"2011 르노삼성 디지털매거진  콘텐트 제작 — 이미지 4","w":900,"h":675},{"src":"/images/work/p794/05.webp","alt":"2011 르노삼성 디지털매거진  콘텐트 제작 — 이미지 5","w":900,"h":675},{"src":"/images/work/p794/06.webp","alt":"2011 르노삼성 디지털매거진  콘텐트 제작 — 이미지 6","w":900,"h":675}],"extra":[],"credits":[{"k":"고객사","v":""},{"k":"수행사","v":""},{"k":"기간","v":""},{"k":"PM","v":""},{"k":"디렉터","v":""},{"k":"기획","v":""},{"k":"디자인","v":""},{"k":"퍼블리싱","v":""}]},{"slug":"p790","title":"2010 ADT캡스 홈페이지 구축 제안 및 개편","label":"ADT캡스 개편","layout":"C","date":"2010-07-01","year":"2010","lead":"미국 타이코그룹(www.tyco.com, 이하 타이코)은 세계적인 보안솔루션 전문기업이다. ADT(www.adt.com)는 타이코그룹의 화재 및 시큐리티 사업 부문 계열사이다. 1890년 세계 최초로 무인 경비 사업을 시작했다. 타이코는 1999년 우리나라의 ㈜캡스를 인수, ADT캡스, 캡스텍, ADT시큐리티를 아울러 'ADT코리아' 부르고, ADT의 한국 내 법인격으로 경영해 왔다. 2010년 ADT 글로벌의 웹스타일가이드를 적용해 달라는 고객사의 요구에 따라 ADT캡스 웹사이트를 개편했다.","body":[{"t":"p","v":"· 프로젝트 - ADT캡스 홈페이지 개편 (2010)"},{"t":"p","v":"· 에이전시 - 더파베르"},{"t":"p","v":"· 역할 - PM : ADT 본사 가이드라인을 적용한 홈페이지 개편. 전체 진행 및 커뮤니케이션"},{"t":"p","v":"· 팀 - 소병구(Design), 서영미(PL) / 더파베르"},{"t":"p","v":"· 기간 - 2010.07 ~ 2010.12"},{"t":"p","v":"· URL - www.adtcaps.co.kr"},{"t":"p","v":"· 문의 aprilleaf@gmail.com"},{"t":"p","v":"국내 환경에 맞지 않은 글로벌 웹스타일가이드 적용"},{"t":"p","v":"2010년 당시 ADT의 웹사이트는, 작은 텍스트가 화면 가득한, 초기 미국 또는 유럽 스타일의 B2B 기업 웹사이트 방식에 가까웠다. 이미, '읽는 웹'에서 '보는 웹'으로 웹사이트 수용 행태가 옮겨가는 국내 환경상 적합한 형태가 아님을 고객사에 언급했지만, 글로벌 그룹 전체적으로 동일한 웹스타일가이드라인을 준수해야 한다는 고객사의 의지가 강했다."},{"t":"p","v":"후회"},{"t":"p","v":"어쩔 수 없이, 글로벌 가이드라인을 준수하여 웹사이트를 구축했고 오픈했지만, 평가는 좋지 않았다. 너무나도 예상 가능한 비평들이 들려왔다. 텍스트가 작다거나, 텍스트가 너무 많다거나, 읽기 어렵다거나 하는 내용들이었다. 문제는, 프로젝트를 리딩한 고객사 담당자마저, 그것이 에이전시의 잘못인 듯한 뉘앙스로 비평을 해왔다는 점이다. 그런데 돌이켜보면, 우리의 잘못이고, 내 잘못이다. 설득하거나, 일을 하지 말았어야 했다. 결국 오픈한지 얼마 지나지 않아서, 웹사이트는 다시 개편작업을 진행한 것으로 알고 있다."},{"t":"p","v":"2014년 타이코는 ADT코리아를 '먹튀 논란' 속에서 글로벌 사모펀드 그룹에 100% 팔아치우고 떠났다. 이제, ADT 홈페이지도 더 이상 텍스트가 아니라 비주얼 중심의 웹사이트로 개편되었다. 글로벌 그룹의 웹스타일 가이드를 준수할 때(비록 그것이 고객의 분명한 요구사항이라고 할지라도), 예상되는 결과물에 대해서도 사전에 충분히 논의해야 하며, 불가피하게, 국내 실정에 맞지 않는 스타일을 적용해야만 할 경우, 목적에 따라 버전이 다른 방식의 웹사이트 구축을 별도로 제안할 필요가 있다.국내 환경에 맞지 않은 글로벌 웹스타일가이드 적용"}],"hero":{"src":"/images/work/p790/01.webp","alt":"2010 ADT캡스 홈페이지 구축 제안 및 개편 — 이미지 1","w":900,"h":748},"details":[],"extra":[],"credits":[{"k":"고객사","v":""},{"k":"수행사","v":""},{"k":"기간","v":""},{"k":"PM","v":""},{"k":"디렉터","v":""},{"k":"기획","v":""},{"k":"디자인","v":""},{"k":"퍼블리싱","v":""}]},{"slug":"p783","title":"2010 iSKY 대표 웹사이트 유지운영","label":"iSKY 운영","layout":"A","date":"2010-02-01","year":"2010","lead":"01지금은 사라진 팬택의 휴대폰 브랜드 SKY의 브랜드 사이트, isky.co.kr. 프리미엄 휴대폰 브랜드에 걸맞는 '프리미엄 팝 콘텐츠 & 서비스 기반의 전면 개편'을 ㈜그라비티인터랙티브에서 제안해 수주했다. 최선을 다한 주축 인력들이 개편 직후 회사를 떠나면서, 2010년 잠시 운영을 맡았다. 크게, <The 스카이>, <Live 메시지>, <Fun 스테이지>, <It 스토어> 4개 메뉴로 구성되어 있었는데, <Live 메시지>와 <It 스토어>를 담당했다.","body":[{"t":"p","v":"· 프로젝트 - iSKY 웹사이트 운영 (2010)"},{"t":"p","v":"· 고객사 - 팬택"},{"t":"p","v":"· 역할 - 2010 상반기 운영 PM - <Live 메시지>, <It 스토어> 실무 운영 및 전체 보고"},{"t":"p","v":"· 팀 - 정연주(PM), 최지은(PL), 서영미(PL) 외 (2009)"},{"t":"p","v":"· 기간 - 2010.02~2010.07"},{"t":"p","v":"· URL - www.isky.co.kr"},{"t":"p","v":"· 문의 - aprilleaf@gmail.com"},{"t":"p","v":"정연주, 최지은. 최고의 인력들이 최고의 프로젝트를 만들이 위해 전력을 다했다.  내가 경험해 본 프로젝트 중 아이디어 제안과 기획 과정이 가장 훌륭했던 프로젝트. 하지만, 결말이 아쉬웠다. '프리미엄' 브랜드로 끌고 가려는 고객사 마케팅 팀과 '판매 결과' 즉, '매출 증진'을 위해 저가의 상품으로 쇼핑몰을 채우려는 또 다른 사내 조직 간의 이견이 조정되지 않았다. 대행사 내부적으로도, 느슨한 개발로 인한 납기일 지연과 검증되지 않은 기술 적용(FLEX, AJAX 등의 ADMIN 적용 후 고객사의 문제제기로 재개발) 등에 대한 책임 규명을 하지 않는 등 혼란 속에서 핵심인력들이 대거 이탈했다."}],"hero":{"src":"/images/work/p783/01.webp","alt":"2010 iSKY 대표 웹사이트 유지운영 — 이미지 1","w":900,"h":599},"details":[{"src":"/images/work/p783/02.webp","alt":"2010 iSKY 대표 웹사이트 유지운영 — 이미지 2","w":900,"h":570}],"extra":[],"credits":[{"k":"고객사","v":""},{"k":"수행사","v":""},{"k":"기간","v":""},{"k":"PM","v":""},{"k":"디렉터","v":""},{"k":"기획","v":""},{"k":"디자인","v":""},{"k":"퍼블리싱","v":""}]},{"slug":"p777","title":"2009 KT SNS 구축 제안 및 운영","label":"KT SNS 운영","layout":"A","date":"2009-09-01","year":"2009","lead":"2009년 12월 kt가 애플 아이폰을 출시했다. 그리고 트위터를 비롯한 SNS의 열풍이 불어닥쳤다. kt 홍보팀 조주환 대리(당시)는 이 흐름을 예측했다. 같은해 7월 즈음 kt 트위터를 오픈했고, 11월 블로그를 오픈했다. 정상적인 의사결정을 거치려면 늦을 것 같아, 먼저 계정을 개설하고 고객과의 대화에 나섰다. 마침, 해외 출장에 나섰던 대표이사가 고객으로부터 \"트위터 계정이 있느냐?\"는 질문을 받았고, 홍보팀은 이미 개설해서 활동중이라는 보고를 드렸다. 이후, kt는 홍보팀에서 마케팅 조직에 이르기까지 전사적으로 SNS를 활용했고, 국내 기업 SNS의 대표 주자가 되었다.","body":[{"t":"p","v":"· 프로젝트 - olleh kt SNS 운영 대행 (2009~2010)"},{"t":"p","v":"· 고객사 - KT"},{"t":"p","v":"· 역할 - 포스팅, 윤색, 영상 촬영, 인터넷 생방송 진행"},{"t":"p","v":"· 팀 - 정지영, 함수린, 현상필"},{"t":"p","v":"· 기간 - 2009.09 ~ 2010.12"},{"t":"p","v":"· URL - blog.kt.com, www.twitter.com/ollehkt"},{"t":"p","v":"· 문의 - aprilleaf@gmail.com"},{"t":"p","v":"아이폰과 olleh kt, 그리고 SNS"},{"t":"p","v":"그 선두에 olleh kt가 있었다. olleh kt는 2009년 11월 11일 11시 11분, 블로그를 오픈하며, '고객의 소리를 듣겠다'는 '경청(傾聽, Listen)'의 자세를 다짐했다. olleh kt는 이미 몇 달 동안 트위터를 통해 고객들과의 직접적인 소통에 나서고 있던 터였다."},{"t":"p","v":"그리고, 그 배경에 조주환 대리(2016년 현재, JTBC 홍보마케팅팀 차장)가 있었다. 조주환 차장은 소셜미디어를 통한 고객과의 소통의 중요성을 간파했다. 하지만, 사내 의사결정 기간이 길어지자, 스스로 olleh kt 트위터 계정을 개설하고 고객과의 직접 소통에 나선다. 이 즈음, 해외에 출장을 나갔던 이석채 회장이 해외에서 트위터의 인기를 실감, 출장길에서 돌아오자마자 홍보임원에게 '우리는 트위터를 왜 열지 않느냐?'고 물었고, 조주환 과장은 이 시점을 계기로 공식적이고 본격적인 SNS 활동에 들어간다."},{"t":"p","v":"사내에서는 계열사 및 주요 브랜드별로 SNS 담당자를 지정하고 조주환 과장이 직접 교육에 나섰으며, 대외적으로는 다양한 컨퍼런스에 강사로 참여하여, olleh kt SNS 운영 사례를 공유한다."},{"t":"p","v":"제안과 추억"},{"t":"p","v":"2000년대 초반부터 블로그에 관심을 갖고 있던 나 또한 2009년 트위터의 유행을 목격한다. 하지만, 성향상 트위터보다는 블로그가 더 편안했고, olleh kt의 블로그 제안에 뛰어들게 되었다. 당시, 유명 PR기업에서 SNS 전문 컨설팅 부문에 뛰어들었기 때문에, 수주 가능성은 매우 낮아 보였다. 하지만, 디테일한 준비와 웹에이전시의 실제 구현과 운영 능력을 앞세워 SNS 운영 대행을 수주하였다."},{"t":"p","v":"이후 2010년, 1년은 힘들었지만 즐거움으로 가득한 한 해였다. 조주환 차장이 수시로 신선한 아이디어를 제공했고, 나는 디자인과 포스팅 윤색, 영상 촬영 등으로 그를 지원했다. 특히, 아이폰 출시, 이석채 회장님의 주요 기자 회견 및 사내의 주요 행사를 가정용 캠코더와 노트북 하나로, olleh kt 블로그를 통해 생방송으로 전했다. 당시 여러가지 환경으로 방송이 도중에 끊기는 등의 문제가 있었지만, 그 모든 것을 '일어날 수 있는 일, 해프닝' 정도로 감싸 안아준, 조주환 차장에게 고맙다는 말씀을, 지금도 전하고 싶다. 아울러, 2010년 남아공 월드컵 당시에는 조주환 과장, 블로거들과 함께 남아공에 출장을 가서, 16강 진출까지의 과정을 SNS로 전하기도 했다."},{"t":"p","v":"편안한 일만 있었던 것은 아니다. 24시간 오픈되어 있는 SNS를 소수의 인원이 감당하면서, 핵심 담당자였던 조주환 차장은 정신적, 육체적인 스트레스에 시달렸다. 가끔은 사소한 말실수가 거대한 고객의 항의를 만들어내 그에 대응하느라 몇 날밤을 지새우기도 했다. 당시 아이폰 출시 때마다 고객들의 관심과 출시 지연에 따른 항의가 엄청났는데, SNS를 통해 그에 대응하는 것도 초인적인 의지를 필요로 했다."},{"t":"p","v":"슬럼프, 그리고"},{"t":"p","v":"일면, 긍정적인 기여를 했다고 생각하지만, 에이전시로서 SNS 운영을 대행한다는 것에 대한 어려움이 있었다. 물리적인 것보다 정신적인 것에 가까운데, 고객사의 상황을 속속들이 알기 어렵기 때문에, 최적의 콘텐트를 기획하고 제작하는데 한계가 있었다. 그러다 보니, 몸은 능동적으로 대응하지만, 마음과 정신은 수동적으로 기다릴 수밖에 없는 상황이 많았다. 에이전시의 숙명이긴 했지만, 개인적으로 'SNS를 대행한다는 것이 가능할까?' 하는 고민을 하기 시작했고, 슬럼프에 빠져들었다."},{"t":"p","v":"지금 생각해보면, 에이전시의 도움은 당연히 필요하다. 그런데, 그 부분은 영상, 디자인, 플랫폼 구축과 같은 기능적인 부분에 국한되는 것이 좋겠다는 생각이다. 실제 커뮤니케이션과 콘텐트(위 요소들을 제외하거나 일부 포함한) 제작은 아이디어부터 최종 결과물의 단계까지 고객사에서 직접 담당하는 게 좋고, 그 둘의 영역은 보다 명확하게 구분되는 것이 좋지 않을까 생각한다. 나는 그 중간 어디쯤에서 고민이 많았고, 2011년 olleh kt SNS 운영 업체 선정 제안에 참여하지 못했다. 그런 마음으로 '대행' 할 수는 없었기 때문이다."}],"hero":{"src":"/images/work/p777/01.webp","alt":"2009 KT SNS 구축 제안 및 운영 — 이미지 1","w":900,"h":619},"details":[{"src":"/images/work/p777/02.webp","alt":"2009 KT SNS 구축 제안 및 운영 — 이미지 2","w":900,"h":537}],"extra":[],"credits":[{"k":"고객사","v":""},{"k":"수행사","v":""},{"k":"기간","v":""},{"k":"PM","v":""},{"k":"디렉터","v":""},{"k":"기획","v":""},{"k":"디자인","v":""},{"k":"퍼블리싱","v":""}]},{"slug":"p773","title":"2009-2012 LG전자 블로그 윤색","label":"LG전자 블로그 윤색","layout":"C","date":"2009-08-01","year":"2009","lead":"2009년 LG전자 블로그 윤색을 맡고 있던 지인의 SOS로 LG전자 블로그의 일부 포스팅을 다듬는 일을 했다. 때로는 초고의 형태로, 때로는 자료 날것 그대로 넘어오면 그것을 블로그 포스팅 형태로 다듬는 일이다. 일의 난이도가 높은 것은 아닌데, 불규칙하게 요청이 오고, 늦어도 24시간 내에는 결과물을 송고해야 하는 게 좀 까다로운 일이었다. 하지만, 화자를 나로 상상, 감정이입 해가며 일하곤 했다.","body":[{"t":"p","v":"· 프로젝트 - LG전자 블로그 리라이팅 (2009.08 ~ 2012.10) - http://social.lge.co.kr"},{"t":"p","v":"· 윤문 - 김남용"},{"t":"p","v":"· 문의 - aprilleaf@gmail.com"},{"t":"p","v":"· 윤문 예시"},{"t":"p","v":"· 처가 식구들에게 \"물\"로 점수 따기 작전 (2009.08.26)"},{"t":"p","v":"· 더욱 날씬하고 강해진 신민아가 돌아왔다! (2011.12.12)"},{"t":"p","v":"· 창의적인 혁신! 레드닷 콘셉트 디자인 어워드 시상식 현장 (2011.12.14)"},{"t":"p","v":"· 남아공 최고의 광고로 뽑힌 LG 3D TV 광고 제작 뒷이야기 (2011.12.16)"},{"t":"p","v":"· 별별 기네스 기록, 이런 기네스 기록도 다 있네? (2012.01.20)"},{"t":"p","v":"· 소프트웨어 개발자들의 축제에선 무슨 일이? (2012.02.1)"},{"t":"p","v":"· 장애인에게 책 읽어주는 휴대폰 아세요? (2012.02.20)"},{"t":"p","v":"· ‘메르하바~!’ 형제의 나라, 터키를 다녀오다 (2012.02.21)"},{"t":"p","v":"· 바람맞아 좋은 날~♬ - 조인성과 함께 한 ‘LG 휘센 좋은바람쇼’ (2012.05.24)"},{"t":"p","v":"· 시간을 지배하라, 옵티머스 LTE Ⅱ 광고 제작 뒷이야기 (2012.08.03)"},{"t":"p","v":"· 중앙아시아 실크로드의 중심, 타지키스탄을 다녀오다 (2012.09.05)"},{"t":"p","v":"· 아이디어로 승부한 옵티머스 G 글로벌 영상 제작기 (2012.10.30)"}],"hero":{"src":"/images/work/p773/01.webp","alt":"2009-2012 LG전자 블로그 윤색 — 이미지 1","w":640,"h":427},"details":[],"extra":[],"credits":[{"k":"고객사","v":""},{"k":"수행사","v":""},{"k":"기간","v":""},{"k":"PM","v":""},{"k":"디렉터","v":""},{"k":"기획","v":""},{"k":"디자인","v":""},{"k":"퍼블리싱","v":""}]},{"slug":"p761","title":"2008 KT.COM 개편 제안 및 운영","label":"KT닷컴 운영","layout":"C","date":"2008-02-01","year":"2008","lead":"2008년 임직원 10여 명 남짓한, 창업 3년차 ㈜그라비티인터랙티브가 KT 공식 홈페이지 유지운영 프로젝트를 수주했다. 이후 2010년 말까지 운영 업무 외 QOOK과 olleh 브랜드 론칭 프로모션 사이트 구축, SNS 구축 및 운영 업무 등을 잇따라 맡게 되었다. 2008년 당시 KT 웹사이트는 홍보팀과 마케팅팀의 니즈가 정리되지 않은 채 혼재되어 드러나 있었다. 내부적으로 KT.COM이라는 공식 홈페이지를 상품 판매를 위해 써야 하는가, 기업 홈페이지를 사용해야 하는가? 하는 질문에 대한 답이 명쾌하게 정리되지 않은 것이다. 이후, olleh 라는 상품 브랜드가 탄생하면서, kt.com은 기업, olleh.com은 상품을 맡는 투 트랙으로 전환되는 듯 싶다가, 2017부터는 kt.com이 다시 대표 홈페이지이자 마케팅 사이트 역할을(olleh.com을 대체) 하고, 기업홈페이지는 corp.kt.com으로 정리되었다.","body":[{"t":"p","v":"· 프로젝트 - KT.COM 유지운영 프로젝트 (2008~2009)"},{"t":"p","v":"· 고객사 - KT"},{"t":"p","v":"· 기간 - 2008.02 ~ 2009.12"},{"t":"p","v":"· 역할 - 2008 제안 PM, 2009 운영 PM (2008 제안 프레젠테이션, 2009 총괄 책임)"},{"t":"p","v":"· 팀"},{"t":"p","v":"· 2008 제안 - 김남용, 정연주, 최지은(기획), 김형준(CD)"},{"t":"p","v":"· 2008 유지운영 스태프 - 김형준(CD), 허성(Program), 김경환(Publishing), 이윤성(Motion Graphic)"},{"t":"p","v":"· 2009 제안 - 김남용, 김영민(기획), 김형준(CD)"},{"t":"p","v":"· 2009 유지운영 스태프 - 김남용(PM), 김형준(CD), 허성(Program), 김경환(Publishing), 이윤성(Motion Graphic)"},{"t":"p","v":"· URL - www.kt.com"},{"t":"p","v":"· 문의 - aprilleaf@gmail.com"},{"t":"p","v":"KT로부터 제안 참여를 요청 받았을 때 우리는 어리둥절했다. 당시, 직원 수 10여 명 남짓한, 창업 후 갓 2년을 넘긴 우리가 어떻게? 아무튼, 수주를 하게 되면, 이후 회사가 안정적으로 성장해 나갈 수 있을지도 모를, 당시로서는 규모가 큰 프로젝트였다. 겁이 났지만, 직전 직장에서 접했다면, 못할 이유도 없었다. 그러니까, 결국, '회사의 규모'에 대한 편견이 없고, 우리 스스로도 그 부담감만 떨칠 수 있다면, 해볼만하다고 생각했다."},{"t":"p","v":"제안 1주일을 앞두고 떠나신 할머니"},{"t":"p","v":"제안 준비는 더뎠다. 무턱대고 제안서를 채워나가는 것보다, 충분히 토론하고 아이디어를 도출해낸 후, 문서 작업은 최후에 하는 것이 낫다는 생각에 따른 것이었지만, 프레젠테이션이 다가올수록 마음은 무거웠다. 그런데, 그때 비보가 날아들었다. 낙상으로 허리를 다쳐 몇 년간 누워계시던 할머니께서 돌아가셨다는 것이다. 개인적인 슬픔도 컸지만, 프레젠테이션을 목전에 두고 제안 작업을 주도해 온 사람이, 회사에 이야기를 하고 자리를 비워야 하는 상황도 견디기 쉽지 않았다. 말씀 드렸을 때, 위로보다는 걱정이 먼저 스쳐가던 두 이사님의 얼굴은 지금까지도 잊을 수가 없다. 정말 죄송스러웠다."},{"t":"p","v":"난생 처음 해본 '프레젠테이션 대행'"},{"t":"p","v":"누구보다도 기획 부분을 함께 담당하던 두 동료에게 너무 미안했다. 3일상을 겨우 치르고 올라왔을 때, 놀랍게도 제안서는 얼추 작성이 되어 있었다. 두 동료가 초인적인 힘을 발휘했던 것이다. 문제는 프레젠테이션이었다. 제안서를 마무리한 동료는 '정 힘들면 자신이 할 수도 있다.'고 했지만, 나는 그 짐까지 지우고 싶지는 않았다. 금요일에 제안서를 최종 마무리하고 주말 동안 월요일 프레젠테이션을 준비했다. '남이 쓴' 제안서를 대신 프레젠테이션한 첫 경험이었다. 결과는 놀랍게도 7개 회사 중, 우리가 수주!"},{"t":"p","v":"2008 - 홍보 vs 마케팅"},{"t":"p","v":"2008년도 kt.com의 최대 이슈는 홈페이지를, 명실공히 그룹 대표 '홍보' 플랫폼으로 이해할 것이냐, 아니면, '최적의 마케팅' 플랫폼으로 활용할 것이냐 하는 문제였다. 그것은 홍보팀과 마케팅팀이라는 2개 조직의 이해관계와도 얽힌 문제라서 풀기가 여간 쉽지 않았다. 마케팅팀은 별도로 대행사를 선정해서 관련 메뉴들을 운영하고 있었고, 홍보팀은 우리를 선택해서, 관련 메뉴에 메인 페이지를 맡고 있었다. 당시 KT의 상품 브랜드들은 네이밍과 디자인부터 일관성이 없었고, 상품별 그룹 관리의 체계 또한 약했다. 처음에는 홍보팀의 요청대로 기업 아이덴티티와 이미지를 중시했으나, 점차 개별상품, 그리고 상품 그룹을 강조하는 방향으로 디자인이 변화해"},{"t":"p","v":"2009 - QOOK과 olleh의 등장"},{"t":"p","v":"2009년 초에, kt 홈상품 통합 브랜드인 QOOK이 '집 나가면 개고생이다!'라는 프로모션을 성공적으로 론칭하면서 등장했다. 이후 유ㆍ무선 통신상품 통합 브랜드인 'olleh' 또한 론칭하면서, 기업소개는 kt.com으로, 상품 마케팅은 olleh.com으로 점차 수렴되어 갔다. 2009년에 kt.com 웹사이트 유지운영 연장을 위한 프레젠테이션에서, 우리는 kt.com의 비전을 담은 비주얼을 제작해, 매월 1회씩 교체하겠다는 '비주얼 커뮤니케이션'을 제안하고 좋은 평가를 받았다."},{"t":"p","v":"단, 제안 시에는 \"한 장 한 장, 관련 사진 또는 영상을 제작하겠다\"는 것이었는데, 수주하자마자, 크리에이티브 디렉터의 의견에 따라, \"스톡이미지를 구입해서 그래픽 이미지를 만들어 제공하겠다\"고 내용이 변경되었다."},{"t":"p","v":"이후 KT 홈페이지 운영은 중대형 SI 업체로 넘어갔다. olleh.com과 kt.com을 한 업체에서 맡게 되었고, olleh.com에 무게가 쏠렸다. 객관적인 입장에서 그것은 옳은 선택이었다고 본다. 국내 1위 통신사업자로서 엄청난 양의 회원 DB(1인당 복수 ID 관리 포함), 유ㆍ무선 통신 상품 및 이용자 관리, iPhone 출시 이후 급속도로 확대되던 무ㆍ유형 상품의 판매 관리 등을 위해서는 SI 업체가 더 적합했다. 그리고, 그러한 일의 대부분은 kt.com이 아니라, olleh.com에서 발생했다."}],"hero":{"src":"/images/work/p761/01.webp","alt":"2008 KT.COM 개편 제안 및 운영 — 이미지 1","w":900,"h":625},"details":[{"src":"/images/work/p761/02.webp","alt":"2008 KT.COM 개편 제안 및 운영 — 이미지 2","w":900,"h":614},{"src":"/images/work/p761/03.webp","alt":"2008 KT.COM 개편 제안 및 운영 — 이미지 3","w":900,"h":585},{"src":"/images/work/p761/04.webp","alt":"2008 KT.COM 개편 제안 및 운영 — 이미지 4","w":900,"h":528},{"src":"/images/work/p761/05.webp","alt":"2008 KT.COM 개편 제안 및 운영 — 이미지 5","w":900,"h":562},{"src":"/images/work/p761/06.webp","alt":"2008 KT.COM 개편 제안 및 운영 — 이미지 6","w":900,"h":583}],"extra":[],"credits":[{"k":"고객사","v":""},{"k":"수행사","v":""},{"k":"기간","v":""},{"k":"PM","v":""},{"k":"디렉터","v":""},{"k":"기획","v":""},{"k":"디자인","v":""},{"k":"퍼블리싱","v":""}]},{"slug":"p757","title":"2007 SK텔레콤 HCI 프로토타입 UI 컨설팅","label":"SK텔레콤 HCI 컨설팅","layout":"A","date":"2007-04-01","year":"2007","lead":"2007년도 SK텔레콤은 국내 통신 시장의 포화상태를 예상하고, 다양한 방식으로 신규 사업을 모색했다. 그 일환으로 전임직원을 대상으로 제약 없는 신규 사업 아이디어를 공모하고, 선별된 팀의 사업화를 지원하는 HCI 프로젝트를 진행했다. 시즌1~시즌3 단계를 거치면서 50여 개의 아이디어가 선별되고, 일부는 프로토타입 단계까지 진행된 것으로 기억한다. 글로벌 인재들과 함께 팀을 이루고, 이동형 책상을 쓰면서, 때로는 선채로, 때로는 누워서 일을 하는 등 창의적인 기업 문화를 모방하기 위해 노력했지만, 국내 대기업 특유의 경직된 보고 문화는 별다를게 없었다. 실제 사업화되었거나 성공한 아이디어는 내 기억에는 없다.","body":[{"t":"p","v":"· 프로젝트 - SK텔레콤 HCI 프로젝트 (비즈니스 인큐베이팅 사업 프로토타입 디자인)"},{"t":"p","v":"· 기간 - 2007.04 ~ 2007.06"},{"t":"p","v":"· 고객사 - SK텔레콤"},{"t":"p","v":"· 역할 - PL(프로토타입 기획, 화면설계, 디자인 및 플래시 진행) with 김형준(Creative Director)"},{"t":"p","v":"· 문의 - aprilleaf@gmail.com"}],"hero":{"src":"/images/work/p757/01.webp","alt":"2007 SK텔레콤 HCI 프로토타입 UI 컨설팅 — 이미지 1","w":900,"h":675},"details":[],"extra":[],"credits":[{"k":"고객사","v":""},{"k":"수행사","v":""},{"k":"기간","v":""},{"k":"PM","v":""},{"k":"디렉터","v":""},{"k":"기획","v":""},{"k":"디자인","v":""},{"k":"퍼블리싱","v":""}]},{"slug":"p750","title":"2007 현대엔지니어링 웹사이트 개편 제안","label":"현대엔지니어링 개편","layout":"C","date":"2007-01-01","year":"2007","lead":"대림산업, 코오롱건설에 이어서 현대엔지니어링 웹사이트 구축 제안에 참여해 수주했다. 노후화된 현대엔지니어링 공식 웹사이트 개편과 신임 대표의 홈페이지 구축이 주 과제였다.","body":[{"t":"p","v":"· 프로젝트 - 현대엔지니어링 웹사이트 리뉴얼 제안 및 구축"},{"t":"p","v":"· 주소 - http://www.hec.co.kr"},{"t":"p","v":"· 기간 - 2007.01 ~ 2007.06"},{"t":"p","v":"· 고객사 - 현대엔지니어링"},{"t":"p","v":"· 역할 - 제안 PM, 구축 PL - 웹사이트 리뉴얼 제안, 웹사이트 기획 및 전체 진행"},{"t":"p","v":"· 팀 - 김형준(Creative Director), 허성(구축 PL/PROGRAMING)"},{"t":"p","v":"· 문의 - aprilleaf@gmail.com"}],"hero":{"src":"/images/work/p750/01.webp","alt":"2007 현대엔지니어링 웹사이트 개편 제안 — 이미지 1","w":900,"h":623},"details":[],"extra":[],"credits":[{"k":"고객사","v":""},{"k":"수행사","v":""},{"k":"기간","v":""},{"k":"PM","v":""},{"k":"디렉터","v":""},{"k":"기획","v":""},{"k":"디자인","v":""},{"k":"퍼블리싱","v":""}]},{"slug":"p739","title":"2007 오마이뉴스 대표 웹사이트 개편","label":"오마이뉴스 개편","layout":"A","date":"2006-12-01","year":"2006","lead":"오마이뉴스는 2000년 '모든 시민은 기자다!'를 모토로 출범한 대안 언론이다. 2006년 12월, 시민의 더 많은 참여를 위해 편집권까지 시민에게 내주는 획기적인 '시즌2' 웹사이트 구축이 목표였다. 방향과 기획 아이디어는 오마이뉴스 내부에서 정리가 된 상태였기 때문에, 어떻게 하면 시각적으로 쉽고 편하게 시민의 참여를 보여주고, 유도할 수 있을까를 고민했다.","body":[{"t":"p","v":"· 프로젝트 - 오마이뉴스 웹사이트 리뉴얼"},{"t":"p","v":"· 고객사 - 오마이뉴스"},{"t":"p","v":"· 에이전시 - 그라비티인터랙티브"},{"t":"p","v":"· 기간 - 2006.12 ~ 2007.08"},{"t":"p","v":"· 역할 - 제안 PM (웹사이트 리뉴얼 제안)"},{"t":"p","v":"· 팀 - 김형준(Creative Director), 강상희(Design), 허성(구축 PL/Program)"},{"t":"p","v":"· 주소 - http://www.ohmynews.com"},{"t":"p","v":"· 문의 - aprilleaf@gmail.com"},{"t":"p","v":"<오마이뉴스> 웹사이트 개편 제안은 '내 인생 제안'이었다. 제안서의 퀄리티를 떠나서, 내가 존경하는 분과, 존중하는 사람들 앞에서, 그들의 과제에 대해 준비하고 프리젠테이션 한다는 것 자체가 엄청난 설렘이었다."},{"t":"p","v":"<오마이뉴스>와의 만남"},{"t":"p","v":"<오마이뉴스>는 오연호 대표가 '모든 시민은 기자다!'를 모토로 2000년 2월 22일 2시 22분에 문을 연, 시민 언론이자, 대안 언론이다. 시민의 꽃이 진 이야기, 시민의 반려견이 숨진 이야기도 1면 톱이 될 수 있다는 게 당시 오 대표의 생각이었고, 시민 누구나 기사를 송고할 수 있었다. 당시, 한경자동차신문사에서 수습 기자 생활을 막 떼고, 이타임즈인터넷(현 전자신문인터넷)에서 웹기획자로 새 출발을 시작한 내게는 엄청난 충격이었다. <오마이뉴스>에 참여한 상근 기자들의 쟁쟁한 면모를 보고, 이력서를 내볼 용기조차 낼 수 없었다 (그래, 그건 정말 용기가 없었던 거다. 후회한다.)"},{"t":"p","v":"오연호 대표님과의 만남"},{"t":"p","v":"2002년도, 갑갑한 마음이 조금 들어서, 서강대학교 언론대학원에 진학했다. 공부를 하고 싶어서였지만, 외부에서 생각하듯이, 인맥과 학력 관리를 위해 온 것 같은 분들이 많았다. 특히, 학자금을 모두 지원해주는, 대기업, 주류언론사 출신들에서 그런 게 많이 느껴졌다. 그 속에, 눈에 띄는 한 분이 있었다. 말수가 적고, 항상 무슨 생각을 골똘히 하시는 것 같던 오연호 대표님. 그분은 오마이뉴스 사례를 중심으로 시민 언론을 진지하게 학문적으로 연구하고자 하는 것 같았다. 시험으로도 석사학위를 받을 수 있는 특수대학원이었지만, 오 대표님은 마침내 근사한 한 권의 논문으로 그 생각들을 정리해낸 것으로 기억한다."},{"t":"p","v":"제안 요청"},{"t":"p","v":"<오마이뉴스>로부터 제안 참여 요청이 왔을 때, 너무나도 기뻤다. 꼭 수주하고 싶었다. 이유는 알 수 없지만, 웹 에이전시에서 일하면서 강한 동기를 부여 받을 수 있는 얼마 안된 기회라고 생각했다. 고객사 담당자님께서 직접 찾아오셔서 '시즌2'에 해당하는 개편 내용을 설명해 주셨다. 대강의 기획은 이미 수립되어 있었고, 디테일한 부분까지 내부에서 마무리를 해나갈 것이라고 말씀하셨다. 개발도 내부 개발팀에서 진행할 예정이니, 제안 PT는 '디자인 시안'만 가지고 했으면 한다고 하셨다."},{"t":"p","v":"화면설계와 시안 디자인"},{"t":"p","v":"미팅 후, 내 머리 속은 이미 깔끔하게 정리되어 있었다. <오마이뉴스> 5년의 이야기를, 가장 중요했던 이슈들을 꼽아, '또 다른 오마이뉴스 한 장(시안)'을 만들자. 그것은 일종의 '헌정'이라고 생각했다. <오마이뉴스> 5년간의 기사를 모두 뒤졌다. 내가 기억하고 있던 주요 이슈와, 미처 몰랐던 뉴스들 중에 중요한 것을 추려서, A3 용지 1장에, '한 판의 오마이뉴스'를 그렸다. 디자이너가, 일부 텍스트를 반복해서 'Copy & Paste'하는 관행을 두고, 이번 시안만은 그렇게 하지 말고, 이 화면설계 그대로 모든 텍스트를 그대로 넣어달라고 부탁했다."},{"t":"p","v":"<오마이뉴스>가 영국 가디언 선정, 세계 5대 뉴스사이트에 선정된 것을 톱기사로 꼽고, 인천공항 기자실에서 쫓겨난 뉴스게릴라의 사연을 부톱 기사 중 하나로 꼽았다."},{"t":"p","v":"▶ <오마이뉴스> 제안 시안작업용 화면설계"},{"t":"p","v":"프레젠테이션"},{"t":"p","v":"전자신문에서 일할 때, <오마이뉴스>에 한 명의 웹 디자이너 사연이 주요 기사로 실렸다. 한 웹디자이너가, 매일 야근으로 지쳐 생활하는데, 어느 날 갑자기, 어머니께서 비소세포암에 걸리셨다는 누나의 전화를 받고 고향으로 내려가는 길의 슬픔을 담담하게 써 내려간 글이었다. 먼 타향에 홀로 와서, 부모님 안부도 물을 시간도 없이, 일에 지쳐 살아가고 있는 자신을, 문득 바라보게 된 마음이 얼마나 황망할까. 당시 팀장님께, '이 뉴스는 전자신문에서 쓸 수 없는 기사다. 우리가 인터넷매체이니, 우리가 이런 뉴스를 다뤄져야 한다. 플래시로 제작해서, 업계 뉴스로 올리게 해달라!'고 설득하고, 30만원인가를 들고 외주자를 찾아 플래시로 제작한 일이 있었다. 배경 음악은 남진의 '어머니'였다."},{"t":"p","v":"프레젠테이션이 시작되자, 나는 그 플래시 파일을 플레이했다. 그리고, <오마이뉴스>가 내 인생에서 왜 중요했는지를 말씀 드리고 나서, <오마이뉴스>의 5년이 압축된 시안을 설명 드렸다. 프레젠테이션을 마치자, 오연호 대표께서 '이 업체는 우리를 잘 알고 있네요.'라고 말씀하셨다. 프레젠테이션 장을 나올 때, 나는 속으로 생각했다. \"됐어! 이제 됐어! 떨어져도 괜찮아! 내가 만족한 제안이면, 그걸로 됐어!\""},{"t":"p","v":"아쉬움"},{"t":"p","v":"나는 <오마이뉴스>를 직접 마무리하고 싶었다. 하지만, 회사 입장에서는 고객이 기획과 개발을 \"해 주는\" \"디자인 프로젝트\"로 생각했다. 아울러, 당시 막 관심을 끌던 웹 기술, FLEX나 AJAX를 적용해 볼 수 있는 \"좋은 기회\"로 생각하기도 했다. 나는 <오마이뉴스>를 테스트 베드로 삼을 수 없다고 반대했다. 또, 고객이 '기획'을 해준다고 하면, 정말 '내부 기획자' 없이 프로젝트가 굴러 갈 수 있을 것이라고 생각하는(또는 생각하는 척 하는) 관점에 실망하기 시작했다. 고객에서 기획에 참여하면 고마운 일이지만, 고객이 생각하는 '기획'의 일과, 에이전시에서 감당해야 하는 '기획'의 일은 엄연히 다르다. 고객 측에서 그렇게 말한다고 해도, 견적서에서 기획 항목을 삭제하면서 협상을 해서는 안 된다는 게 그때나 지금이나 내 생각이다. 물론, 그렇게 해서 내게 다른 프로젝트를 맡기고 싶었을(그래야 돈을 더 많이 버니까) 회사의 입장을 이해 못하는 것은 아니다. 다만, 그런 상황에서 구성원의 사기 저하에 대한 고민은 전무했다는 것이 너무나도 아쉬울 뿐이다."},{"t":"p","v":"아무튼, 며칠밤을 새워가며 제안을 하고, 수주를 하고 나자마자, 기대와는 전혀 다른 방향으로 전개되는 논의를 보고, 나는 기대를 접고, 다른 프로젝트를 찾아 떠났다. <오마이뉴스>는 그 후 장기 프로젝트가 되었고, 투입된 인력들의 의욕은 쉽게 사그러들었다. <오마이뉴스>는 그렇게, 내게 희열이자, 아픔, 미안함이 되었다."},{"t":"p","v":"▶  참고 - <어느 웹 디자이너의 일기> 플래시 파일"}],"hero":{"src":"/images/work/p739/01.webp","alt":"2007 오마이뉴스 대표 웹사이트 개편 — 이미지 1","w":900,"h":1978},"details":[],"extra":[],"credits":[{"k":"고객사","v":""},{"k":"수행사","v":""},{"k":"기간","v":""},{"k":"PM","v":""},{"k":"디렉터","v":""},{"k":"기획","v":""},{"k":"디자인","v":""},{"k":"퍼블리싱","v":""}]},{"slug":"p732","title":"2006 하늘채 브랜드 사이트 개편","label":"하늘채 구축","layout":"A","date":"2006-08-01","year":"2006","lead":"코오롱건설 기업 홈페이지와 아파트 브랜드 하늘채 사이트를 경쟁 PT 없이 수주했다. 건설사 홍보팀장 모임에서 개편작업 중인 대림산업 홈페이지를 보시고 연락을 해오신 것이다. 디테일한 요구는 없으셨지만, '소프트하고도 럭셔리한 아파트 브랜드 사이트'를 원하셨다. 먼저 아파트 브랜드 사이트의 새로운 웹스타일가이드를 설계하고, 그와 일관성 있는 기업 홈페이지를 고민했다.","body":[{"t":"p","v":"· 프로젝트 - 코오롱건설 하늘채 브랜드 웹사이트 개편"},{"t":"p","v":"· 고객사 - 코오롱건설㈜"},{"t":"p","v":"· 에이전시 - 그라비티인터랙티브"},{"t":"p","v":"· 기간 - 2006.08~2006.10"},{"t":"p","v":"· 역할 - 제안 PM, 구축 PM (제안, 웹사이트 기획, 전체 진행 및 커뮤니케이션)"},{"t":"p","v":"· 팀 - 김형준(Creative Director), 강상희(Design), 이송범(Design), 김현주(Design), 황재식(Program)"},{"t":"p","v":"· 주소 - https://www.ihanulche.co.kr"},{"t":"p","v":"· 문의 - aprilleaf@gmail.com"},{"t":"p","v":"넉달 동안 서교동에서 과천까지 출퇴근. 막바지 1주일 동안은 고객사 근처에 여관을 잡아 놓고, 매일 18시간씩 파견 근무하던 날들이 떠오른다. 일정에는 무리가 없었는데, 고객사 PM이 원해서였다. 그 때는 그랬다..."}],"hero":{"src":"/images/work/p732/01.webp","alt":"2006 하늘채 브랜드 사이트 개편 — 이미지 1","w":640,"h":427},"details":[],"extra":[],"credits":[{"k":"고객사","v":""},{"k":"수행사","v":""},{"k":"기간","v":""},{"k":"PM","v":""},{"k":"디렉터","v":""},{"k":"기획","v":""},{"k":"디자인","v":""},{"k":"퍼블리싱","v":""}]},{"slug":"p736","title":"2006 코오롱건설 대표 웹사이트 개편","label":"코오롱건설 개편","layout":"C","date":"2006-08-01","year":"2006","lead":"코오롱건설 기업 홈페이지와 아파트 브랜드 하늘채 사이트를 경쟁 PT 없이 수주했다. 건설사 홍보팀장 모임에서 개편작업 중인 대림산업 홈페이지를 보시고 연락을 해오신 것이다. 디테일한 요구는 없으셨지만, '소프트하고도 럭셔리한 아파트 브랜드 사이트'를 원하셨다. 먼저 아파트 브랜드 사이트의 새로운 웺스타일가이드를 설계하고, 그와 일관성 있는 기업 홈페이지를 고민했다.","body":[{"t":"p","v":"· 프로젝트 - 코오롱건설 그룹 웹사이트 리뉴얼"},{"t":"p","v":"· 주소 - http://www.kolonconstruction.co.kr"},{"t":"p","v":"· 기간 - 2006.08~2006.10"},{"t":"p","v":"· 고객사 - 코오롱건설㈜"},{"t":"p","v":"· 역할 - 제안 PM, 구축 PL (제안, 웹사이트 기획, 전체 진행 및 커뮤니케이션)"},{"t":"p","v":"· 팀 - 김형준(Creative Director), 강상희(Design), 이송범(Design), 김현주(Design), 황재식(Program)"},{"t":"p","v":"· aprilleaf@gmail.com"},{"t":"p","v":"대림산업 웹사이트 개편 작업을 한창 마무리하고 있을 때, 코오롱건설에서 연락이 왔다. 건설사 홍보팀장 모임에 갔다가 소개를 받았다고 하시면서, 자사 홈페이지 개편 건을 의뢰하셨다. 3~4일 정도 밖에 시간을 주지 않으셔서 형식적인 형태의 제안서를 들고 찾아뵈었고, 경쟁 PT도 없이, 그날 업체로 선정이 되었다. 회사의 존페를 걱정하셨을 대표이사님들께서는 이날의 쾌감이 짜릿하셨을 것이다. 하나의 프로젝트를 잘 마무리한다는 것이 이렇게 동종 업계의 다른 일들로 연결된다는 것을 몸소 체험한 것이니까."},{"t":"p","v":"그런데, 개인적으로는 이때부터 조금씩 내적 갈등이 시작되었다. 전담하여 진행하던 대림산업 프로젝트가 아직 완전히 종료되지 않았기 때문이다. 테스트 및 버그 수정 작업도 해야 하고, 안정적인 오픈 과정을 확인하고, 완료보고서도 제출해야 했다. 하지만, 사내게 다른 기획자는 없었고, 코오롱건설은 파견을 요구했다."},{"t":"p","v":"회사에서는 대림산업에 '내가 몸이 아파 프로젝트에서 빠지게 되었다.'고 보고했다. 프로젝트는 대표이사님께서 직접 마무리하셨고, 나는 코오롱건설에 파견을 나갔다. 사실이 아닌 이야기를 해야 하는 상황, 진행중이던 일을 마무리 하지 못한 기획자로 고객사에 나를 각인시키는 상황을 견디기 쉽지 않았다."},{"t":"p","v":"특히, 그런식의 프로세스에 회사가 익숙해질 것이 가장 걱정이 되었다. 경영 관리를 위해서는 어쩔 수 없겠지만, 장기적으로 지속가능한 관계형성을 위해서는 리스크가 크다고 생각했다. 하지만, 창업 14년째 대림산업과 일을 계속해오고 있는 걸 보면......"}],"hero":{"src":"/images/work/p736/01.webp","alt":"2006 코오롱건설 대표 웹사이트 개편 — 이미지 1","w":640,"h":427},"details":[],"extra":[],"credits":[{"k":"고객사","v":""},{"k":"수행사","v":""},{"k":"기간","v":""},{"k":"PM","v":""},{"k":"디렉터","v":""},{"k":"기획","v":""},{"k":"디자인","v":""},{"k":"퍼블리싱","v":""}]},{"slug":"p703","title":"2006 성남문화재단 대표 웹사이트 신규 구축","label":"성남문화재단 구축","layout":"C","date":"2006-05-01","year":"2006","lead":"2004년 12월 성남시는 성남아트센터의 설립과 운영을 지원하기 위한 조직으로 성남문화재단을 오픈했다. 안그라픽스는 2005년 성남아트센터 웹사이트 신규 구축에 이어 2006년 성남문화재단 단 홈페이지를 신규 구축했다. 클라이언트의 명확한 방향성 제시와 적극적인 참여로 짧은 기간, 적은 비용, 낮은 관심이라는 제약을 극복할 수 있었다. 괴롭지만 즐거운 일.","body":[{"t":"p","v":"· 프로젝트명 - 성남문화재단 웹사이트 신규 구축"},{"t":"p","v":"· 고객사 - 성남문화재단"},{"t":"p","v":"· 에이전시 - 성남문화재단"},{"t":"p","v":"· 기간 - 2006.5~2006.06"},{"t":"p","v":"· PM - 김남용"},{"t":"p","v":"· Creative Director - 김형준"},{"t":"p","v":"· URL - http://www.snart.or.kr"},{"t":"p","v":"· Contact - aprilleaf@gmail.com"},{"t":"p","v":"가격적인 측면에서 고민이 많았던 프로젝트다. 이전에 일하던 회사에서 성남아트센터 홈페이지를 구축한 바 있고, 지인의 소개도 있었으며, 추후에도 성남아트센터 홈페이지 개편 및 운영 프로젝트로 연결 될 수 있었기 때문에 어떻게 보면, 고민 없이, 진행을 하는 편이 더 합리적인 선택이었을 것이다. 개인적으로도 문화예술 단체의 프로젝트는 단순한 '프로젝트' 그 이상의 동기부여와 만족감을 제공하기 때문에, 가능하면 진행을 하고 싶었다."},{"t":"p","v":"하지만, 바로 '지인의 소개'라는 전제가 고민을 키우는 측면이 있다. 에이전시에서 제안하는 가격과 고객사에서 요구하는 가격대 사이에 거리가 멀 경우, '사람 사이의 관계'조차 불편해지는 경우가 있기 때문이다."},{"t":"p","v":"예컨대, 고객사는 1,000만원 밖에 없다고 하고, 에이전시는 4,000만원 이하로는 어렵다고 한다. 고객사는 몇페이지 안되니 겁내지 않아도 된다고 하고, 에이전시는 그런 말을 믿고서 시작했다가 소위 '덤탱이' 쓴 악몽을 떠올리면, 고객사의 말을 믿지 않는다."},{"t":"p","v":"결론적으로, <성남문화재단> 웹사이트의 페이지 분량은 10페이지 내외에 불과했고, 기본적인 기획과 카피라이팅도 실력 좋은 고객사 담당자분으로부터 나왔다. 지금 생각해보면, 1,500만원이든, 1,000만원이든 적은 금액이 아니다."},{"t":"p","v":"하지만, 당시에는 '저렴한 프로젝트'라는 사내의 생각이 팽배했고 나 또한 적지 않게 스트레스를 받았었다. 이상적인 이야기이지만, 합리적인 비즈니스 문화가 정착된다면, 불필요할 스트레스이다."},{"t":"p","v":"그래도, 멋진 디자인과 모션그래픽으로 성의를 다해주신 김형준 CD님과 실질적으로 프로젝트를 끌고 가신 고객사 담당자님께 감사의 말씀을 전한다. 오픈 후에, 비용 문제로 수정 요청에 대해 까칠하게 대한 것에 대해 죄송하다는 말씀도 함께."}],"hero":{"src":"/images/work/p703/01.webp","alt":"2006 성남문화재단 대표 웹사이트 신규 구축 — 이미지 1","w":900,"h":1222},"details":[],"extra":[],"credits":[{"k":"고객사","v":""},{"k":"수행사","v":""},{"k":"기간","v":""},{"k":"PM","v":""},{"k":"디렉터","v":""},{"k":"기획","v":""},{"k":"디자인","v":""},{"k":"퍼블리싱","v":""}]},{"slug":"p440","title":"2006 대림산업 공식 홈페이지 개편","label":"대림산업 개편","layout":"A","date":"2006-05-01","year":"2006","lead":"2005년 크리스마스를 앞두고 대림산업 담당자로부터 연락이 왔다. ㈜그라비티인터랙티브는 7얼 창업 이후 소형 프로젝트들로 근근히 버티고 있었다. 대표님들은 곧바로 고객을 만났고, 2006년 제안에 참여 프로젝트를 수주했다. 당시 대림산업 웹사이트는 건설사 특유의 '딱딱한' UI 디자인을 보였고, 담당자는 이를 벗어나고 싶어했다.","body":[{"t":"p","v":"세련된 UI와 감성적인 비주얼 그래픽을 사용하면서도 '대림의 역사 대한민국 건설의 역사다'라는 자부심을 지원하기 위하여, 건설의 'origin'인 '모래'를 활용한 애니메이션을 생각했다. 건축을 전공한 크리에이티브 디렉터 김형준 대표의 아이디어였다. 또, 감성적 콘텐츠를 기획, 제작하여 홍보관과 역사관 2개의 마이크로사이트에 담았다."},{"t":"p","v":"· 프로젝트명 - 대림산업 홈페이지 리뉴얼"},{"t":"p","v":"· 고객사 - ":"기간","v":""},{"k":"PM","v":""},{"k":"디렉터","v":""},{"k":"기획","v":""},{"k":"디자인","v":""},{"k":"퍼블리싱","v":""}]},{"slug":"p400","title":"2005 성남아트센터 대표 웹사이트 신규 구축","label":"성남아트센터 구축","layout":"A","date":"2005-01-01","year":"2005","lead":"2005년 10월 14일, 성남시는 분당구 야탑동에 성남아트센터를 개관했다. 성남아트센터는 서울시와 경기남부권 지역민들을 주요 대상으로 한 복합문화공간으로, 예술의 전당, 세종문화회관에 버금가는 규모로 지어졌다. 서비스 사이트를 신규로 구축하는 것은 쉽지 않은 과제다. 수주 시점에는 공연, 전시, 교육, 대관, 지원사업 등 다양한 문화예술 사업이 논의되고 있었지만, 'TO BE' 모델이 명확히 정의되지 않은 상태였다. 웹사이트를 설계하고 구현하는 단계에 이르러서도 실제 제공할 서비스의 모습은 계속 변화하고 수정되었다. 신규 구축 프로젝트를 어떻게 대하고 접근해야 하는지를 가르쳐준 프로젝트였다.","body":[{"t":"p","v":"· 프로젝트명 - 성남아트센터 웹사이트 구축 (신규)"},{"t":"p","v":"· 고객사 - 성남문화재단"},{"t":"p","v":"· 에이전시 - 안그라픽스"},{"t":"p","v":"· URL - http://www.snart.or.kr"},{"t":"p","v":"· 기간 - 2005.01~2005.07"},{"t":"p","v":"· 제안 / PM / PL - 김남용"},{"t":"p","v":"· Creative Director - 김형준"},{"t":"p","v":"· 연락처 - aprilleaf@gmail.com"}],"hero":{"src":"/images/work/p400/01.webp","alt":"2005 성남아트센터 대표 웹사이트 신규 구축 — 이미지 1","w":405,"h":291},"details":[],"extra":[],"credits":[{"k":"고객사","v":""},{"k":"수행사","v":""},{"k":"기간","v":""},{"k":"PM","v":""},{"k":"디렉터","v":""},{"k":"기획","v":""},{"k":"디자인","v":""},{"k":"퍼블리싱","v":""}]},{"slug":"p388","title":"2003-2005 아시아나항공 웹사이트 운영","label":"아시아나항공","layout":"C","date":"2003-01-01","year":"2003","lead":"자전거 여행을 마치고 김옥철 사장님의 제안으로 ㈜안그라픽스에서 일하게 되었다. 입사 초기의 미션은 론리플랫닛 한국어 판권을 기반으로 한 여행정보 사이트 구축이었다. 내부적인 상황으로 프로젝트는 좌초했고, 에이전시 사업부(디지털사업부)로 자리를 옮겨 아시아나항공 웹사이트 운영을 맡았다. 아시아나항공 웹사이트가 여행정보 미디어는 아니지 않은가? 돌이켜 생각해 보면, 그때의 선택은 비겁했다. 여행정보 미디어를 만들겠다고 입사를 했는데 해당 프로젝트가 좌초되었으면 나왔어야 했다. 아니면 끝을 보던가.","body":[{"t":"p","v":"· 프로젝트 - 아시아나항공 웹사이트 운영"},{"t":"p","v":"· 주소 - http://www.flyasiana.com"},{"t":"p","v":"· 기간 - 2003.07~2005.07"},{"t":"p","v":"· 고객사 - 아시아나항공㈜"},{"t":"p","v":"· 역할 - PL (프로젝트 기획, 전체 진행 및 커뮤니케이션)"},{"t":"p","v":"· 팀 - 신기태(디자인), 진정헌(퍼블리싱) / 안그라픽스"},{"t":"p","v":"· contact - aprilleaf@gmail.com"}],"hero":null,"details":[],"extra":[],"credits":[{"k":"고객사","v":""},{"k":"수행사","v":""},{"k":"기간","v":""},{"k":"PM","v":""},{"k":"디렉터","v":""},{"k":"기획","v":""},{"k":"디자인","v":""},{"k":"퍼블리싱","v":""}]},{"slug":"2000-etnews","title":"2000 전자신문 웹사이트 UI/콘텐츠 기획","label":"전자신문","layout":"A","date":"2000-01-01","year":"2000","lead":"2000년도 코스닥(최저 52p)은 1997년도 외환 위기 때(60p)보다도 낮았다. 닷컴버블은 여기저기서 허망하게 사라져 버렸지만 스타트업의 도전은 계속 되었다. 1999년도 전자신문이 계열사 이타임즈인터넷을 설립하고 온라인 뉴스서비스를 시작하기로 한 것도, 같은 맥락에서, 잘못은 아니었다. 다만, 하루가 멀다하고 문을 닫고 스러져간 여타 닷컴들의 뒤를 그대로 좆아 내달렸던 경영진의 태도는 도저히 이해할 수가 없다. 18년이 흘러버린 지금 생각해도.","body":[{"t":"p","v":"암튼, “우리는 플랫폼이야. 플랫폼만 만들어 놓으면 콘텐츠는 여기저기서 실어달라고 줄을 설거야.”라는 기대는 어긋나 버렸다. 출판사, 연구소 등을 중심으로 한 콘텐츠 소유자들에게 전자신문은 절대 지존의 매체가 아니었다. ‘Give & Take’의 명확하지 않으면, 그들로서도 참여할 이유가 없었다. 기획팀에서 전자신문 온라인 뉴스 서비스를 기획, 론칭시킨 후에 콘텐츠 기획팀으로 자리를 옮겼다. 매출압박에 ‘뭐라도 해보자!’라는 심정으로, 콘텐츠를 ‘파는’ 기획을 하기 시작했다. 그것이 <도표서비스>와 <CEO Weekly> 였다."},{"t":"p","v":"2000년도 2월부터 2002년 7월까지 약 30개월 정도 <이타임즈인터넷>(현 전자신문인터넷, www.etnews.com)에서 일했다. 2000년도는 국내 벤처열풍의 ‘끝물’로 곧 들이닥칠 ‘닷컴붕괴’를 눈치채진 못한 투자금이 새로운 벤처기업으로 유입되던 때였다. 아울러, 국내 언론사들은 인터넷 뉴스 사이트를 새롭게 구축하거나 정비하고, 정체 불명의 ‘새로운 수익모델 창출’에 대비하던 때였다."},{"t":"p","v":"당시, 중앙일보의 <조인스닷컴>이 치고 나갔고, 한겨레신문은 네이버 지식인과 유사한 디비딕(DBDic) 서비스를 시작했다. ‘모든 시민은 기자다’를 모토로, 오연호 대표가, 주류 언론의 패러다임을 뒤흔들며, <오마이뉴스>를 시작한 것도 이 즈음이었다."},{"t":"p","v":"내가 사원으로 취업했던 <이타임즈인터넷>도 닷컴붕괴의 한복판을 지나고 있었다(2001년, 2002년 사이 S&P 500는 22%, Dow Jones Industrial Average는 13% 떨어진 반면, Nasdaq composite은 53%가 떨어졌다). 이직 과정에서, ‘증권사에 심사를 요청했는데 상장만 하면 주식 가치가 1,000배 오를 것’이라는, 지금 생각하면 너무나도 허무맹랑한 이야기가 들렸다. 30억 원을(기억이기 때문에 불확실할 수 있다.) 투자 받았기 때문에 돈 걱정은 안 해도 된다고도 했지만, 2년 만에 생존을 걱정해야 하는 처지에 빠졌다. 모두 밝힐 수는 없지만, 흥청망청 돈이 낭비되는 장면들이 목격되었고, 리더십도 제대로 발휘되지 않았다. 2002년도에는 사원들이 아직 상장도 안 한 주식을, 돈을 내고, (스톡옵션인지 우리사주인지 모른 채) 살 수 있었는데(아마 경영악화 때문에 현금이 필요했던 듯), 직원들이 이것을 사야 하나, 말아야 하나 눈치를 보면서, 일부 직원들만 구입했던 기억이 있다."},{"t":"p","v":"그러한 상황에서, 나를 가장 괴롭혔던 것은, 마케팅 담당 부서와 콘텐트 담당 부서 간의 알력이었다. (그 배경에 대해서는 각설하고) 당시, 마케팅부서장은, 홈페이지 구축과 콘텐트 담당 부서에 ‘콘텐트를 유료화해서 수익 모델을 만들 것’에 대해서 간혹 주장했는데, 콘텐트 담당 부서에서는 이것을 일종의 ‘간섭과 압력’을로 받아들이지 않았나 싶다. 이로 인해 모회사에서 아마도 ‘주류’이었을 취재기자 출신이었던 당시 팀장과 마케팅 팀장 간의 불편한 관계, 역시 취채기자 출신이었지만, 두 조직 사이에서 묘한 줄타기를 했던 간부, 이러한 상황을 방치한 대표의 태도 등이 겹치면서, 상황은 급속도로 악화되었고, 결국 콘텐트기획팀장의 교체로까지 이어졌다."},{"t":"h","v":"첫 번째 유료 콘텐트, <ETI 도표서비스> 기획으로 매출 기록"},{"t":"p","v":"당시, 콘텐트기획팀의 일원이었던 나의 유일한 관심사는, 어떻게 콘텐트를 유료화해서, 사내의 부조화와 불편하고 부당하며, 유치한(팀장들이 휴가와 술자리 등으로 자기 팀만 챙기는……) 상황을 극복할 수 있을까 하는 점이었다. 당시, 주 2회, 야간에, 서강대학교 언론대학원에서 디지털미디어를 공부했는데, 강의실에서도 콘텐트 유료화에 대한 고민이 많았다. 신문 기사를 유료로 제공하는 것에 대해서는, 모회사 전자신문에서 반대했기 때문에, 뭔가 다른 방법이 필요했다."},{"t":"p","v":"그 고민의 첫 번째 결과가 <ETI 도표서비스>(현재 <ET 통계>)였다. 업무적으로 또는 학술적으로, 신문 기사에 포함된 각종 통계 그래프와 도표들을 필요로 하는 사람들이 많은데, 인터넷 뉴스에서는 이것들을 일반 이미지 사이즈로 자동 리사이징해서 제공하다 보니, 복잡하고 구체적인 내용까지 알아볼 수가 없었다. 그런데, 우리는 당연히 그 원본 파일을 가지고 있었고, ‘원본 보기’ 기능을 제공할 수도 있었다. 바로, 이 ‘원본 다운로드’를 유료로 제공하자는 생각이었다. 1건당 500원, 월 5,000원 정액제로 기획했던 것 같다. 이 서비스로 매월 500만원 정도의 매출(첫 번째 콘텐트 매출)이 발생했다. 그것은 엄청나게 큰 희열이었다."},{"t":"p","v":"나중에, 어떤 세미나에서 만난 강사가, <ETI 도표서비스>를 언급하면서, 메이저 언론사의 횡포라고 이야기하는 것을 들었다. 공적인 자료로 ‘푼돈 장사’를 한다는 것이었다. 그렇게 생각할 수도 있다고 생각했지만 얼굴이 화끈거릴 정도는 아니었다. 닷컴 언론사는 그만큼 절박했으니까."},{"t":"h","v":"하고 싶지 않았던 <CEO Weekly>"},{"t":"p","v":"콘텐트로 매출이 발생시킨 것에 고무된 팀장님이 주제만 들고 온 것이 <CEO Weekly>였다. 당시, 나는 <오픈 리포트> 같은 사업에 관심이 있었다. 국내 공공/민간 기관 및 개인들의 <IT/경영 리포트>를 전자신문 사이트에 모두 모아 유료로 제공하고, 그 수익을 나누자는 것이 핵심이었다. 그런데, 몇몇 기관에 문의한 결과 공공 기관에서는 공적 자산이라 유료로 제공한다는 것에 난색을 표했다. 개인 저작물을 유료화하는 것에 대해서는 굉장히 많은 이슈가 떠올랐는데 그것을 해결하지 못한 채 고민만 하고 있던 때였다. 그런데, <CEO Weekly>는 한 주간의 뉴스를 요약해서 각 기업 CEO들에게 이메일로 발송한다는 개념이었다. 가격은 무려 월 50만 원대. 나는 첫째, ‘뉴스’를 최대 1주일 뒤에 읽는 게 무슨 의미가 있는가? 둘째, (팀장님이 그 담당자로 나를 세웠는데) 매주 금요일에 시간에 쫓겨 1주일간의 신문을 요약하는 것으로, 양질의 콘텐트를 만들 수 있을까? 하는 점에서 부정적이었지만, 당시 어린 ‘짬밥’으로 시도해볼 수밖에 없었다."},{"t":"p","v":"결국, 콘텐트 품질은 최악이었다. 1주일간의 전자신문 뉴스 중에서 10~20개를 고르고, 신문 기사 맨 앞의 한두 단락을 베끼는 수준에 불과했다. 그런데, 정말 화가 난 것은 그 서비스를 멈출 수가 없었다는 점이었다. (아마도 CEO가 언론 관계를 중시한) 일부 기업의 마케팅팀이나 비서실이 있었고, 이들의 구독으로, <ETI 도표서비스>에 필적하거나 상회하는 매출이 발생했던 것이다."},{"t":"p","v":"아무튼 15년 가까이 흘렀다. 지금 보니, <ET 통계>는 무료로 제공중인 것 같고(일부 유료라고 표기되어 있는데, 결재 없이 다운로드가 된다.), <etview Plus Weekly IT 트렌드>라고 이름을 바꾼 리포트 서비스도, 전담팀(전자신문 미래기술 연구센터)이 다소 합리적인 가격(월 11,000원)에 제공하고 있는 것 같다. 우여곡절은 있었겠지만, 초기 콘텐트를 기획한 사람으로서 15년 동안 동 서비스가 유지되고 있다는 사실에 보람을 느낀다. 전자신문인터넷, 지금은 괜찮겠지ㅎㅎ?"},{"t":"h","v":"참고"},{"t":"p","v":"ET통계\netview Plus Weekly IT 트렌드"}],"hero":{"src":"/images/work/2000-etnews/graph.webp","alt":"도표서비스","w":900,"h":600},"details":[{"src":"/images/work/2000-etnews/report.webp","alt":"CEO Weekly","w":900,"h":600}],"extra":[],"credits":[{"k":"고객사","v":""},{"k":"수행사","v":""},{"k":"기간","v":"2000.02 – 2002.07"},{"k":"PM","v":""},{"k":"디렉터","v":""},{"k":"기획","v":""},{"k":"디자인","v":""},{"k":"퍼블리싱","v":""}]}],"writing":[{"slug":"p1059","title":"2019 A 社 사내커뮤니케이션 콘텐츠 운영 컨설팅","label":"아모레퍼시픽 컨설팅","layout":"E","date":"2019-05-01","year":"2019","blocks":["Goal & Scope","· 사내 커뮤니케이션 플랫폼 용 콘텐츠 운영 전략","· 다양한 격차 해소를 위한 콘텐츠 제작 방안","Customer's Needs","· 세대 간, 직급 간, 조직 간 커뮤니케이션 장벽 해소 및 쇼통 문화 제고를 위한 정기적 콘텐츠 전략","· 사내 뉴스 및 SNS 플랫폼 운영","Concept Keyword","· 참여, 유머, 이입","## 프로젝트의 출발점이 된, <사내 커뮤니케이션 플랫폼 구축> 시안","2nd Contents Management Consulting","· 2019년 8월 - <사내 뉴스 플랫폼> 구축 제안에 참여했다가 실주","· 2019년 9월 - 제안 내용 중 콘텐츠 전략을 높이 평가. 콘텐츠 운영사 참여 의뢰","· 2019년 11월 - 부분 참여에서 2020년 연간 참여사로 확정","## 세대간, 조직간 커뮤니케이션 활성화를 위해 임직원을 직접 콘텐츠 안으로 끌어들이기 위한 아이디어 개념도 (Amore Bump)","· 구성원간 소통 문제는 조직 커뮤니케이션에서 가장 큰 이슈","· 사내 뉴스, SNS 플랫폼을 활용해 이 문제에 기여할 수 있는 콘텐츠를 제작키로 함","· 기존 일방향적으로 메시지를 전달해온 것에서 벗어나, 직원을 콘텐츠에 직접 참여시키는 다양한 방식을 모색","Summary","· 고객사 - 아모레퍼시픽","· 에이전시 – 엘루오씨앤씨 (www.eluocnc.com)","· 제안 PM - 김남용","· 기간 - 2019년 8월~2019년 12월","· 문의 - nykim@eluocnc.com","Note","· 2019년 12월 - 고객사의 급작스러운 경영 이슈로 프로젝트 중단"],"credit":"","section":"글"},{"slug":"p1037","title":"2018 포스코그룹 스크린세이버 제작","label":"포스코 스크린세이버","layout":"E","date":"2018-10-15","year":"2018","blocks":["Note 1","2018년도 10월 초, 포스코ICT로부터 연락을 받았다. \"스크린세이버를 제작해 본 적이 있느냐?\"고 물으셨다. 촬영을 마치고 돌아온 늦은 밤, 여수의 한 펜션에서, 우리는 포트폴리오와 벤치마킹 자료를 몇가지 유형별로 정리해서 보내드렸다. *","그리고, 10월 15일(월)에 커뮤니케이션실과 첫미팅을 진행하고 프로젝트의 배경과 목적, 조건에 대한 말씀을 나눴다.  10월 26일(금)까지 완성본을 제출해야 하는 일정과 실제 촬영(사진, 영상)이 불가능한 상황 등을 고려해서, 매우 현실 가능한 안을 정해야 했다.","포스코 커뮤니케이션실에서 제공하는 자료 사진에 모션그래픽 기법을 적용하여 역동성과 생동감을 부여하기로 했다. 몇가지 이펙트 프로그램을 고려했지만, 중간 보고와 컨펌 일정 등을 고려할 떄 난이도와 작업 시간 등에서 부담이 되었다. 그러던 중 플로타버스라는 앱을 발견, 정적인 사진 속 원하는 장면에 다양한 움직임을 적용할 수 있었다. 그 결과, 추상적이고 관념적으로 느껴지기 쉬운 새로운 경영이념 키워드를 쉽고 직관적으로 전달할 수 있었다.","· Project – 2018 포스코 스크린세이버 제작","· Running Time – 00:48","· Language – 국문","· Scenario – 김남용","· Design - 이세빈, 이윤성","· Date – 2018년 10월 15일 ~ 10월 30일","· Video - nondisclosure","· Creative Director, Motion Graphic - 이윤성 감독","· Contact – aprilleaf@gmail.com","p.s  포트폴리오와 벤치마킹 결과를 정리해 제시했던 5가지 유형","스틸 이미지의 앵글 변화 + 타이포의 모션 효과","·","· 이미지는 포스코에서 제공하는 '포스코' 관련 이미지 또는 일반적인 주제(ex, 혁신, 협업 등) 스톡 이미지 활용 *상동","· https://vimeo.com/206452264 (대외비)","포스코 관련 이미지(포스코 제공)에 시간 또는 날씨 등 데이터 연동","·","· 참고) 일반적인 스크린세이버는 화면 전체를 덮어, PC의 시간 정보가 보이지 않음","· https://www.youtube.com/watch?v=BsPKzlIwdnE","인포그래픽 + 실사와 라인드로잉, 타이포의 합성","·","· ex) https://vimeo.com/299785164","패럴랙스 애니메이션 (또는 2.5D)","·","· 각 레이어(요소별)의 속도를 달리해서, 공간감과 입체감을 부각함","· 미세하게 세부 요소들(ex, 목과 얼굴각도, 손가락 관절 등)이 움직여서 영상 효과가 남","· ex 1) https://vimeo.com/137718000","· ex 2) https://vimeo.com/79448934","· ex 3) https://vimeo.com/144989900","이미지에 영상 합성","·","· https://vimeo.com/60729303"],"credit":"","section":"글"},{"slug":"p1202","title":"2018 대림산업 79주년 기념 영상","label":"대림산업 79 Video","layout":"E","date":"2018-10-01","year":"2018","blocks":["2018년 10월 10일 대림산업 창립 79주년을 맞이하여 본사 임원들이 전국 현장에 흩어져 있는 51명의 공로상 수상 직원을 찾아 나섰다. 7,000여 대림산업 '한숲인'들을 향한 고마움과 격려의 현장을 영상에 담았다.","대림산업 79주년 기념영상 Video Thumbnail","'찾아가는 시상식'이라는 주제로 기획된 이번 행사를 기록하기 위하여 자동차, KTX는 물론이고, 배와 항공편을 이용하여 시상 임원과 동행했다. 급박하게 진행된 현장을 담기 위하여 대부분의 촬영은 핸드헬드로 촬영하였고, 일부 사업 현장은 보안 문제로 촬영을 최소화할 수밖에 없었다.","대림은 숲입니다","대림은 한숲입니다","7,000 그루의 나무","7,000 그루의 인내","7,000 그루의 용기로 만들어진 큰 숲입니다","감사합니다","감사합니다","숲, 나무를 찾아갑니다","· 대림산업 79주년 기념영상","· 고객사 - 대림산업","· 시나리오/스크립트 – 김남용","· 촬영/편집 – 이윤성","· 문의 – aprilleaf@gmail.com"],"credit":"","section":"글"},{"slug":"p1049","title":"2019 바텍 홍보영상 스토리텔링 및 카피라이팅","label":"바텍 PR Video","layout":"E","date":"2018-08-01","year":"2018","blocks":["바텍네트웍스(www.vatechnetworks.com)는 세계 No.1 덴탈 이미징 기업이다. 매출의 80% 이상을 대한민국 외 국가로부터 벌어들이고 있다. 전세계 치과용 구강센서 시장점유율, 전세계 3D 치과용 진단장비 판매 대수 1위, 대한민국 치과용 시장점유율 1위, 전세계 치과 영상장비 분야 5개년 특허출원수 1위를 기록하고 있다.","휘어지는 구강용 센서, 2D와 3D를 동시에 획득하는 스마트 CT, 탄소나토튜브 소재의 초경량 포터블 엑스레이를 세계 최초로 개발했고, 세계에서 가장 빠른 저선량 그린CT와 기존 납 방어복 대비 무게가 1/10에 불과하면서도 차폐율은 90% 이상 개선된 차폐 진료복 등을 만들었다.","2018년 8월~2019년 3월에 걸쳐 글로벌 마케팅을 위한 공식 홍보 영상을 제작을 의뢰했고, 2018년 8월~2019년 2월까지 초기 시나리오 및 내레이션 원고 작성을 담당했다.","· 프로젝트 - 2019 VATECH Corporate Film","· 고객사 - ㈜바텍","· 구성/스크립트 (1차) - 김남용","· 촬영/편집  - 이윤성","· 드론 촬영 - 유정호","· 제작기간 - 2018년 8월~2019년 3월","· 문의 - aprilleaf@gmail.com"],"credit":"","section":"글"},{"slug":"p1032","title":"2018 삼호 홍보영상 제안 및 제작","label":"삼호 PR Video","layout":"E","date":"2018-04-02","year":"2018","blocks":["삼호는 대림그룹 계열 건설사이다. 1956년 천안에서 천광사라는 이름으로 설립해, 1986년 사업합리화 대상기업*으로 지정되어 대림그룹에 편입되었다. 주택, 건축, 토목, 플랜트, 조경 사업을 담당하는 종합건설사라고 하지만, 핵심 사업은 주택을 포함한 건축 분야이다 (2017년 매출 비중 건축 86.9%, 토목 13.1%).","많은 기업들이 Public Communication의 관점을 우선하여 홍보영상을 제작하는데 비해, 삼호는 B2B 영업 목적을 우선시 했다. 기존에 제대로 된 홍보영상이 없었던 삼호는 공사 수주를 위한 영업이나 프리젠테이션 때 자사의 많은 실적들을 홍보할 도구가 필요했다. 때문에, 대표실적이라고 꼽은 65개의 실적(연혁 등 자료 실적까지 포함하면 75개)을 모두 넣고 싶어했다. 계약 당시 정한 홍보영상의 분량은 3분. 더군다나, 비용상의 문제로, 촬영은 11개의 실적에 대해서만 진행하기로 하였다. 나머지는 자료 사진을 활용.","많은 실적은 홍보영상의 시간을 두배 가까이 늘려서 해결하고, 스틸 이미지가 주는 단순함은 보충촬영*과 모션그래픽으로 개선했지만, 별다른 스토리 라인 없이 실적 이미지(영상+스틸) 나열이 주는 지루함은 극복하기 어려웠다. 고객사는 자사의 필요와 목적에 부합했는지 만족해 하셨지만, 제작사 입장에서는 내세울만한 퀄리티가 아니라서 아쉬웠다.","하지만, 이것은 항상 반복되는 갈등이다. 무엇이 옳고 그르다고 판단하기 어렵다. 고객은 그동안 축적된 실적을 한데 모아 놓은 데에 기쁨을 느낀 반면, 내부 리뷰에서는 \"뭐야, 그냥 포트폴리오네.\"라는 말이 흘러나왔다. 주어진 여건 속에서 품질을 최대한 높이기 위해, 실적 주변의 건물들의 옥상을 오르내리면서 다양한 촬영 포인트를 확보하고, 타임랩스, 드론 촬영 등을 병행한 수고는 모래처럼 사라져버린다. 서운해진다.","그런데, 그것이 중요한 것은 아니다. 목적이 무엇이었는지, 목적에 부합하는 결과물인지 생각해봐야 한다. 부합한다. 그런데 남는 아쉬움은 무엇인가? 좀더 전문가답게 치열하지 못한 점이다. 미세먼지가 흐린 날은 촬영 일정을 조절했어야 했다. 사전 답사와 공문을 보내 최적의 촬영 포인트를 고집했어야 했다. 협조가 이뤄지지 않은 실적은 과감하게 다른 실적으로 대체했어야 했다. 영상에 적합한 인물 촬영을 관철시켰어야 했다. 일정과 비용의 문제도 있지만, 디테일을 완성하기 위한 태도의 문제가 더 크다.","고객이 요구하지 않은, \"멋있어 보이는, 그럴싸한, 남들이 하는 정도\"의 영상을 만들지 못한 것이 문제가 아니라, 내가 알고 있는 '허술한 디테일'들이 문제다.","· 프로젝트 - 2018 삼호 홍보영상 제작","· 고객사 - 주식회사 삼호","· 구성/스크립트 - 김남용","· 촬영/편집 - 이윤성","· 내레이션 – 손수호","· 런닝타임 – 6:19","· 기간 - 2018년 4월 2일~7월 23일","· 문의 - aprilleaf@gmail.com"],"credit":"","section":"글"},{"slug":"p1023","title":"2018 동화그룹 사옥 로비영상 모션그래픽","label":"동화그룹 로비 Video","layout":"E","date":"2018-04-01","year":"2018","blocks":["2018년 4월 동화그룹의 발주로 동화그룹 70년 역사와 핵심사업, 비전과 가치를 담은 모션그래픽을 제작했다. 동화그룹은 창립 70주년을 맞이해, 사옥 1층 로비 벽에 설치된 디스플레이에 동화그룹과 관련된 이미지 영상을 상영하는데, 이번이 그 두 번째 프로젝트였다.","디스플레이는 3개의 1920 X 1080px 해상도 디스플레이가 가로로 이어진 형태였기 때문에, 스토리 구성과 UI 디자인, 모션그래픽 작업은 넓은 화면(5760 X 1080px)과 그 사이를 가로지르는 2개의 가로선 등을 염두에 두고 진행했다.","6가지 주제(글로벌 동화, 매출 1조원 돌파, 역사, No.1 동화, 사업 영역, 핵심가치)를 순차적(linear)으로 구성하지 않고, 각각의 주제별로 메시지를 전달할 수 있도록 파편화했다. 이는 많은 사람들이 빠른 속도로 오고 가는 디스플레이 공간의 특성을 고려해, 사람들이 엘리베이터를 기다리는 짧은 시간, 지인과 대화를 나누는 순간에도 단편적으로 메시지를 수용할 수 있도록 하기 위한 것이었다.","초기 과제는 30초의 짧은 시간에 5가지(향후 6가지로 늘어남)의 주제를 함축적으로 전달하는 것을 목표로 했지만, 고객의 요구사항이 늘어나면서 시간은 두 배를 훌쩍 넘게 되었다.","일러스트레이션 프로젝트의 가장 큰 어려운 점은 '판단의 주관성'이다. 결과물을 바라보는 기준과 이유, 목적에 따라 그 판단은 얼마든지 상이할 수 있다. 5컷의 일러스트 시안은 컬러가 동화그룹의 아이덴티티에 부합하지 않는다는 이유와 세부 요소들의 디테일한 표현 방식에 대한 이견으로 동화그룹 디자인실의 많은 요구가 반영되었다. (최종 결과물은 다음 영상 참조)","모션그래픽 프로젝트에서 가장 염두에 두는 것은 주(主)와 부(部)의 군형을 이루는 것이다. 여기서 주는 메시지이고 부는 스토리이다. 메시지를 너무 강조하면 멋이 없고, 스토리를 지루하게 나열하면(내용이 길어지는 것, 영상의 표현이 지나친 것 모두) 메시지가 약해진다.","· 프로젝트 - 동화그룹 로비 영상 (Motion Graphic for the Display in Dongwha Building)","· 고객사 - 동화그룹","· 미디어 - Wall Display (LCD, 5760 X 1080)","· 연출/시나리오/스크립트 – 김남용","· 크리에이티브 디렉터 - 김형준","· 모션그래픽 – 이윤성","· 제작기간 - 2018년 4월 ~ 6월","· 문의 – aprilleaf@gmail.com"],"credit":"","section":"글"},{"slug":"p1020","title":"2018 세아창원특수강 대경공장 홍보영상","label":"세아창원특수강 Video","layout":"E","date":"2018-03-01","year":"2018","blocks":["세아창원특수강은 특수강 전문기업이다. 1966년 설립된 삼양특수강에서 삼미종합특수강(1982), 창원특수강(1997), 포스코특수강(2007) 등으로 주인과 이름을 바꿔오다, 2015년 세아그룹에 편입되었다.","세아창원특수강은 2017년 930억 원을 투자해, 지름 10㎝ 이상 대(大)구경 강관 제품을 만드는 대경공장을 준공했다. 이로써 중국과 유럽산 대구경 제품의 대체 효과와 중소경 제품 위주였던 세아창원특수강의 글로벌 영업력 강화를 기대할 수 있게 되었다.","2018년 4월 10일 글로벌 정유 기업 A社가 세아그룹을 방문했다. 이때, 세아창원특수강은 이날, 신설한 대경공장을 홍보하고 싶어했다. 3월 중순경 의뢰가 들어왔고, 3월 20일부터 제작에 나섰다. 최종 납품까지 2주 정도의 시간 밖에 없었다. 할수 없이 자료조사와 기획, 콘티와 카피라이팅, 촬영을 거의 동시에 진행할 수밖에 없었다.","구두 계약에 이어 바로 진행한 현장 답사를 통해 5,000t 압출프레스가 보여주는 규모와 웅장함, 그리고 공정 전체를 아우르는 청결한 관리 상태로부터 완벽한 품질과 신뢰감의 이미지를 영상에 담기로 결정하고 바로 다음날부터 본 촬영에 나섰다. 세아그룹 및 계열사의 웹사이트 구축 및 운영을 다년간 해왔기 때문에, 사업의 특성을 어느 정도 이해하고 있었기 때문에 가능한 일이었다.","· 프로젝트 - 세아창원특수강 대경공장 홍보영상","· 고객사 - 세아창원특수강","· 런닝타임 - 2:44","· 언어 - 영어(자막)","· 촬영/편집 - 김대견","· 시나리오/스크립트 - 김남용","· 제작기간 - 2018.03~2018.04","· 고객문의 - aprilleaf@gmail.com","※ 고객사 요구에 따라 결과물은 비공개함"],"credit":"","section":"글"},{"slug":"p1193","title":"2018 세아 신년회 영상 제작 및 카피라이팅","label":"세아 신년회 Video","layout":"E","date":"2017-12-01","year":"2017","blocks":["10여 분의 신임 임원 승진을 기념하기 위한 신년회 영상. 전국에 흩어져 있는 그룹사 신임 임원분들의 가족을 방문해, 임원 몰래 인터뷰 영상을 제작했다.","'또 하나의 가족'이라는 주제로 회사가 임원 가족에게 전해 주는 '선물'과 승진 '소식', 가족이 임원에게 전하는 '감사'의 인사로 구성했다.","카피라이터로서 직접 촬영에 함께 했기 때문에, 감정 이입이 잘 된 카피를 작성할 수 있었다.","'임명장보다 가족이 담겨 있는 영상 한 편이 더 감동적이었다.'는 어느 임원분의 소감을 전해 들었다.","confidential","축하드립니다","사람들은 이제 당신을","'성공'이라 부를지도 모릅니다","부러워할지도 모릅니다","ㆍ","하지만, 세아는 생각합니다","오늘 당신을 있게 한 건 '팔할이 가족'이라는 걸","당신과 함께 희생하고","당신과 함께 헌신한","또 하나의 세아人, 우리의 가족","세상이 당신의 성공에 주목할 때","세아는 당신의 가족을 생각합니다","그리고, 그들이 들려주는","당신을 향한","깊고 진실한 사랑의 시","지금 전합니다","ㆍ","가족의 앨범이","당신의 한 컷으로 완성되듯이","세아의 역사는","당신으로 완성됩니다","신임 이사보 열네 분, 그리고","누구보다도","함께 최선을 다해 헌신해 오신 가족분들께","축하와 감사, 경의와 존경의 마음을 전합니다","가족이 행복한 회사를 만들겠습니다","세아","· 프로젝트 - 2018 세아그룹 신년회 영상","· 고객사 - 세아홀딩스","· 촬영/편집 - 이윤성","· 시나리오/스크립트 - 김남용","· 제작기간 - 2017.12~2008.01","· 문의 - aprilleaf@gmail.com","※ 사내용 영상으로 비공개"],"credit":"","section":"글"},{"slug":"p994","title":"2017 대림산업 78주년 기념 영상 제작","label":"대림산업 78주년 Video","layout":"E","date":"2017-09-01","year":"2017","blocks":["2017년 9월, 대림산업 창립기념일 행사에서 방송할 기념영상을 제작했다. 2017년도 주요 실적과 한숲인상 수상자 2명의 일과 생활, 인터뷰를 담았다. (영상은 사내용으로 비공개)","· 프로젝트 - 대림산업 78주년 기념 영상","· 고객사 - 대림산업","· 촬영/편집 - 이윤성","· 시나리오/스크립트 - 김남용","· 기간 - 2017.09~2017.10","· 문의 - aprilleaf@gmail.com"],"credit":"","section":"글"},{"slug":"p905","title":"2013 Daum 지속가능성보고서 영상 콘텐츠 기획","label":"Daum CSR Video 2013","layout":"E","date":"2013-07-02","year":"2013","blocks":["더파베르는 2012년도에 이어 2013년도에도 <Daum 지속가능성보고서>를 제작했다. 2012년도에는 온ㆍ오프라인 버전을 제작한 데 반해, 2013년도에는 온라인 버전으로만 구현했다. 오프라인 버전은 PDF로 대체되었다.","더 좋은 세상을 위한 새로운 행동, 다음앱","더 좋은 세상을 향한 관심, Daum 뮤직앱","Daum에 바란다. 이해관계자들","다함께 즐거운 세상을 만드는 사람들","함께 가면 멀리 간다. DARUM","2013년도에는 '웹접근성'을 주제로 누구나 이용가능한 Daum 앱을 만들기 위해 노력하는 다음인들을 영상에 담았다.","· 프로젝트 - 2013 다음지속가능성보고서 웹 콘텐츠 영상","· 고객사 - Daum","· 에이전시 - 더파베르","· 프로듀싱/시나리오/스크립트 - 김남용","· 촬영/편집 - 이윤성","· 제작기간 - 2013.07 ~ 2013-8","· 문의 - aprilleaf@gmail.com"],"credit":"","section":"글"},{"slug":"p882","title":"2013 동국제강 영상 콘텐츠 기획 - 스틸 디스커버리","label":"동국제강 PR Video 1","layout":"E","date":"2013-06-01","year":"2013","blocks":["동국제강은 후판(두께 6mm 이상의 두꺼운 강판), 봉강(건축구조용 자재로 쓰이는 가늘고 긴 철강), 형강(건축구조용 자재로 쓰이는 다양한 형태의 철강), 냉연도금강판, 컬러강판 등을 만든 종합 철강 제조기업이다.","Steel Discovery","이 제품들은 작게는 가전제품부터 크게는 해양플랜트에 이르기까지 우리 생활 전반에 쓰이지만, 내부분 내장재 또는 산업재로 쓰이기 때문에, 일반인들이 제품이나 브랜드 자체를 접하기는 쉽지 않다.","2013년 6월 동국제강 웹사이트를 개편하면서, 이를 일반 대중들에게 알리고 싶었고, 제안한 것이 <스틸 디스크버리>.","마침, 동국제강이 엑슨모빌(Exxon Mobil)로부터 벤더 승인을 받아, 북해의 해양플랜트 상부구조물(top-sides) 후판 시장에 본격 진출할 예정이어서, 이를 스토리텔링화하기로 했다.","전 과정을 촬영하고 싶었지만 비용의 제약으로 스톡 영상과 모션그래픽 기법을 접목했다.","· 동국제강 웹 콘텐츠 - 스틸 디스커버리","· 고객사 - 동국제강","· 에이전시 - 그라비티인터랙티브","· 제안/연출/시나리오/스크립트 - 김남용","· 촬영/편집 - 이윤성","· 제작기간 - 2013.06","· 문의 - aprilleaf@gmail.com"],"credit":"","section":"글"},{"slug":"p879","title":"2013 동국제강 영상 콘텐츠 기획 - Life In Ferrum","label":"동국제강 PR Video 2","layout":"E","date":"2013-06-01","year":"2013","blocks":["동국제강은 2010년 을지로 수하동에 페럼타워(Ferrum Tower)를 짓고 입주했다. 2013년 6월 그라비티인터랙티브는 동국제강/동국제강그룹 웹사이트 개편애 맞춰 신사옥, 페럼타워 속 동국인들의 일과 생활을 영상에 담았다.","Life in Ferrum","· 프로젝트 - 동국제강 웹 콘텐츠 - Life in Ferrum","· 고객사 - 동국제강","· 에이전시 - 그라비티인터랙티브","· 연출/시나리오/스크립트 - 김남용","· 촬영/편집 - 이윤성","· 제작기간 - 2013.06~2013.07","· 문의 - aprilleaf@gmail.com"],"credit":"","section":"글"},{"slug":"p875","title":"2013 동국제강 영상 콘텐츠 기획 - RJP인터뷰","label":"동국제강 PR Video 3","layout":"E","date":"2013-06-01","year":"2013","blocks":["2013년 6월 그라비티인터랙티브는 동국제강/동국제강그룹 웹사이트 개편 프로젝트를 진행했다. B2B 기업 속성상 일반 대중들에게는 잘 알려지지 않은 기업 브랜드를 제고하는 것이 당시 개편의 목적이었다. 그라비티인터랙티브는 이를 위해 몇가지 신규 콘텐츠를 제안했고, 그 중 하나가 <RJP 인터뷰>였다.","B2B 기업의 웹사이트를 가장 많이 방문하는 사람들이 대학생을 비롯한 취업준비생들이다. 이들에게, 동국제강 현직원들의 목소리를 통해 동국제강에서 하는 일을 생동감있게 전달하고자 했다. 영업, 생산, 경영지원, 구매, 연구 등 총 5개 직군 임직원을 만나 RJP 인터뷰 영상을 제작했다 (2014년 5월 부분 수정 포함).","영업","생산","경영지원","구매","연구","· 동국제강 웹 콘텐츠 - RJP 인터뷰","· 고객사 - 동국제강","· 에이전시 - 그라비티인터랙티브","· 연출/시나리오/스크립트 - 김남용","· 촬영/편집 - 이윤성","· 제작기간 - 2013.06","· 문의 - aprilleaf@gmail.com"],"credit":"","section":"글"},{"slug":"p856","title":"2012 올레닷컴 - 회원 증대 '드래곤 플라이트' 프로모션","label":"올레닷컴 프로모션","layout":"E","date":"2012-11-01","year":"2012","blocks":["2012년도 말, 고객의 요구사항은 '올레닷컴 방문자수 증대'였다. 실행까지 주어진 시간은 2주 남짓. 연말 이벤트로 당시 유행하던 카카오톡 게임의 아이템을 방문자에게 무조건 지급하는 '100% 당첨 이벤트'를 제안했고, 결과는 대성공이었다.","2012년도는 애니팡, 드래곤플라이트 등 '스마트폰 게임', '카카오톡 게임'이라고 불리는 모바일 게임이 대세가 된 해였다. 밤낮을 가리지 않고 하트를 보내고 받았다. 헤어진 연인이 3년 만에 하트를 보내왔다는 유머도 이때 나왔다. 롯데백화점을 비롯한 대형 유통사들이 소위 '애니팡 마케팅'에 나섰다. 특정한 날, 특정한 시간대에 입장하는 고객에게 선착순으로 애니팡의 하트나 드래곤플라이트의 수정을 나눠 주는 식이었다. 올레닷컴은 2012년 한해 결산을 앞두고 방문자가 목표치에 미치지 못하자, 반응이 즉각적으로 일어날 수 있는 프로모션을 고민하고 있었다. KT와 파인애플홀딩스, 더파베르의 논의 끝에, 올레닷컴에 로그인하는 이용자들에게 매일 '수정'을 나눠주는 '100% 당첨 이벤트'를 기획했다.","결과는 대성공! 문제는 그 후였다. 사람들이 갑자기 몰려들어, 서버가 다운된 적이 있었고, 이런 와중에 이벤트 신청이 제대로 되었는지를 확인하는 전화가 빗발쳤다. 또, 그것과 상관 없이, 개인이 정보를 잘못하여 신청이 제대로 이뤄지지 않은 경우 등 다양한 문의전화가 걸려 왔다. 워낙 갑작스럽게 결정된, 단기간의 프로모션이었기 때문에, 고객의 문의에 자동으로 확인하고 응답하는 시스템을 갖추지도 못했다. 이용자 한 명 한 명의 요청사항을 수작업으로 확인한 후 안내해야만 했다. 이용자들의 전화가 빗발치면서 몇 시간씩 상담 전화가 불통상태가 되어 버렸다. 급작스럽게 회선을 늘렸지만, 이미 화가 난 이용자들을 감당하기란 쉽지 않았다. 프로모션 운영의 경험이 없었기 때문에 낮은 비용에도 불구하고 용감하게 감당했던 프로젝트였다.","· 프로젝트 - KT 올레닷컴 드래곤 플라이트 프로모션 사이트 구축 (2012)","· PM - 정연주","· PL(진행) - 김남용, 최지은","· 디자인 - 양재혁","· 기간 - 2012.11 ~ 2012.12","· 문의 - aprilleaf@gmail.com"],"credit":"","section":"글"},{"slug":"p1130","title":"티머니 해외 영업용 소개 영상 (2012)","label":"티머니 모션그래픽 스토리","layout":"E","date":"2012-08-01","year":"2012","blocks":["티머니는 한국스마트카드에서 발행하는 교통카드로, 교통카드는 물론이고 편의점 등에서 스마트카드로도 사용할 수 있다. 우리에게 익숙한 이 시스템은 그동안 뉴질랜드, 말레이시아, 콜롬비아, 태국, 몽골, 태국 등으로 수출되어 왔다.","2013년 한국스마트카드는 본격적인 해외 확장을 앞두고, 해외 영업용 동영상 제작을 의뢰해 왔다. 시스템의 개념조차 낮선 이들에게 쉽고 간편하게 개념과 특장점을 설명하기 위해 일러스트와 모션그래픽 방법을 채택했다.","T-money intro Full Version","T-money TAXI Service","T-money Orange TAXI Service Intro","· 티머니 해외 영업마케팅용 동영상 제작","· 고객사 - 한국스마트카드","· 에이전시 – 그리비티인터랙티브","· 연출/구성/스크립트 - 김남용, 최지은","· 크리에이티브 디렉터 - 김형준","· 모션그래픽 - 이윤성","· 제작기간 - 2012.08~2013.01","· 문의 - aprilleaf@gmail.com"],"credit":"","section":"글"},{"slug":"p822","title":"2011~2012 『월간 w.e.b』 기고","label":"월간웹 기고","layout":"E","date":"2011-08-01","year":"2011","blocks":["Web 전문 매거진, <월간 웹>에 IT 업계와 문화에 대한 비판적 이슈를 제기한 <Eye's Close Up> 연재.","· <월간 w.e.b> 연재 - “내 정보는 나의 것” - 나의 동의를 득(得)하라! ⑴ (2011.08)","· <월간 w.e.b> 연재 - “내 정보는 나의 것” - 나의 동의를 득(得)하라! ⑵ (2011.09)","· <월간 w.e.b> 연재 - 기업 페이스북의 함정 (2011.10)","· <월간 w.e.b> 연재 - 기업 소셜미디어는 왜 재미가 없을까 (2012.03)","· <월간 w.e.b> 기고 - 2년차 콘텐츠 에이전시 대표의 이유 있는 '남 탓' (2012.09)"],"credit":"","section":"글"},{"slug":"p690","title":"2006 『두 바퀴로 유럽 지도를 그리다』 출판","label":"출판(자전거 유럽 여행기)","layout":"E","date":"2006-05-01","year":"2006","blocks":["글쎄. 자전거 여행기를 한 권 낼 수 있으면 좋겠다고 생각은 했지만 현실이 될지는 몰랐다. 그리고 몇가지 후회되는 점이 있다. 여행 이외의 목적 때문에 여행 자체에 온전히 집중할 수 없었다는 점이 가장 크다. 그리고, 내가 일했던 안그라픽스를 통해서 책을 내지 않았다는 점이다. 김옥철 대표님께서 권유를 해주시기도 했지만, 왠지 다른 사업부(출판사업부)에 민폐를 끼치고 싶지도 않았고, 회사 내에서 개인일로 이슈가 되고 싶지도 않았다. 그런데, 스스로 좀더 적극적으로 나섰다면 더 일찍 더 좋은 책으로 낼 수 있었을 것 같다. 마지막으로, 제목, 디자인, 편집 등에 있어서 내 의견을 너무 주장하지 못했다는 점이다. 막 창업한 새로운 회사가 너무 바쁘게 돌아갔다는 건 핑계다. 책을 처음 내보는 거라 출판사의 의견에 따랐다는 것도 핑계다. 온전히 내 것인데, 왜 그랬을까? 이 또한 비겁한 거다. 스스로 타협했으니까.","· 제목 - 두바퀴로 유럽 지도를 그리다","· 출판년월 - 2006년 5월","· 펴낸곳 - 이가서","· 비고 - <교보문고 개점 25주년 기념 - 대한민국 대표도서 특별 초대전> 선정"],"credit":"","section":"글"},{"slug":"p397","title":"2004 『레이디아시아나』, 유럽 자전거 여행기 연재(31회)","label":"레이디아시아나 연재","layout":"E","date":"2004-01-01","year":"2004","blocks":["2003년도 아시아나항공은 여성을 핵심 대상으로 하는 '레이디아시아나'라는 웹사이트를 서비스했다. 자전거유럽여행을 기획하면서 삼천리자전거, 대한항공, 아시아나항공, 캐논코리아 등 몇몇 기업에 제안서를 보내 스폰서십을 문의했다. 아시아나항공은 이를 수락해준 유일한 기업이었다. 여행을 다녀와서 레이디아시아나 홈페이지에 여행기를 싣는 조건으로 왕복항공권을 지원받았다.","· 제목 : 김남용의 유럽 자전거 여행기","· 미디어 : 아시아나항공, 레이디아시아나(www.ladyasiana.com)","· 기간 : 2004년","· 회수 : 31회","· 원고 읽기","2003년, 유럽으로 자전거 여행으로 떠나기로 결심했지만 여행 경비가 얼만큼 필요할지 감이 오질 않았다. 3개월 동안의 짧지 않은 일정이었지만, 서유럽 10개 남짓한 나라를 모두 돌아다니려면 도중에 기차도 이용해야 했고, 대도시에서는 캠핑장 대신 민박집이나 게스트하우스도 이용해야 했다. 가진 돈이 많아서 가는 여행이 아니었기 때문에, 가능한 여행 경비를 충당할 수 있는 방법을 모색했다."],"credit":"","section":"글"},{"slug":"p383","title":"2003 『주간동아』, 유럽 자전거 여행기 연재","label":"주간동아 연재","layout":"E","date":"2003-07-17","year":"2003","blocks":["15년쯤 지나서 생각해 보니, 하지 않았으면 얻지 못했을, 엄청난 무언가를 배우거나 얻은 것은 아닌 것 같다. 하지만, 무턱대고 하고야 말(해내고가 아니라), 하지 않으면 숨이 막혀 죽을 것 같은, 이유보다 마음이 앞서서 저지르고 마는, 그런 종류의 여행도 있는 것이니까. 아깝지는 않다. 아직도 문득문득 폭염 속 이탈리아 산지미냐노로 가던 메마른 길, 모든 것을 쥐어짜내던 그 날이 생각난다. 그러면 됐지 뭐.","· 제목 - 김남용의 유럽 자전거 여행","· 기간 - 2003년 7월 17일 ~ 2003년 8월 28일","· 회수 - 4회","· 매체 - 2003년 자전거 유럽 여행기를 <주간동아>에 4회 연재","2003년 자전거 유럽 여행을 앞두고 이런 저런 책을 구해 읽고 있었다. 주간동아 전원경 기자가 남편과 함께 쓴, <영국 : 바꾸지 않아도 행복한 나라>라는 책은, 그 중에서, 영국, 나아가 다른 나라를 '깊게' 관찰하고 고 기록으로 남기려면 어떻게 해야 하는가를 깨닫게 해준 책이었다. 그 책을 읽으면서 단순한 여행작가가 아니라, '체류 작가'라는 '망상에 가까운 꿈'을 갖게 되었는데, 그 꿈은, 아마도 이루기는 힘들겠지만, 지금도 여전히 유효한 '꿈'이다.","· 김남용의 유럽 자전거 여행 ① ｜ 독일 로텐부르크 - 두 바퀴에 몸 싣고 ‘중세’를 가다 (2003.07.17)","· 김남용의 유럽 자전거 여행 ② ｜ 이탈리아 토스카나 - 지긋지긋함과 매력에 ‘두 번 미칠 뻔’ (2003.07.31)","· 김남용의 유럽 자전거 여행 ③ ｜ 프로방스 - 자연과 예술, 아름다움이 주는 포만감 (2003.08.14)","· 김남용의 유럽 자전거 여행 ④ ｜ 레이크 디스트릭트 - 뉴캐슬을 지나 에든버러로(2003-08-28)","당시 부족한 경비로 여행을 계획중이던 나는 닥치는대로, 이곳 저곳에 손을 빌렸다. 여행 계획서를 보내고, 아시아나항공에 '항공권 협찬'을 문의했고, '삼천리 자전거'에 여행경비 협찬을 요청했다. 위 책을 읽은 후에는 <주간동아> 당시 전원경 기자님께 여행 중 기고가 가능한지 물었고 승낙을 받았다. 비록, '여행 경비에 여유가 있다면, 앞으로는 여행 중에 어딘가에 기고를 한다는 무모한 도전을 하지는 않을 것'이라고 다짐했지만......","그래도, 당시 <주간동아> 연재는 여행을 도중에 포기하지 않고, 유의미하게 마무리하는데 큰 도움이 되었다. 여행기를 기고하던 두 달 동안에는 도대체 무엇을 위해 여행을 하고 있는 것인지, 헷갈릴 정도였다. 유럽내 인터넷 환경이 좋지 않던 당시에, 도시에만 도착하면, 인터넷 카페를 찾아 헤매느라 시간과 비용을 적잖이 썼는데, 그게 제법 우울하게 느껴졌다. 하지만, 기고를 마치고 난 이후 한 달은 목표와 목적을 잃고 또 다른 감정 상태로 부유했다. 기록도 꼼꼼히 하지 않았고, 사람들과의 만남도 현격하게 줄어들었다. 말도 줄었고, 어떤 슈퍼마켓에서는 나도 모르게 우리말로 계산을 하고 나온 적도 있었다.","누구나, 언제나, 내 옆의 행운은 보지 못한다. 그런 점에서, <주간동아>에게 다시 한번 감사드리고 싶다."],"credit":"","section":"글"},{"slug":"겨울새","title":"겨울새","label":"겨울새","layout":"E","date":"1992-12-01","year":"1992","blocks":["철이 되면 철새로\n너희들은 내게로 오지\n얼마나 머무를까\n늦여름부터 설레어 주던\n예년의 코스모스 밭은\n콘크리트 속으로 숨고\n하늘을 돌며\n하늘을 돌며\n내리지 못하는 날갯짓을\n곁눈으로 훔치던 나는\n창문 닫고 돌아 누워\n얼.마.나.머.무.를.까.","철이 되면 철새로 와서\n철이 되면 철새로 가버리며\n봄마다 실연(실연)을 주던 너희들은\n이 땅에게도 시련이었겠지\n초가을부터 여민\n단단한 옷깃 사이로\n너희들의 고향보다\n더 찬 바람이 불고\n나는 성에 낀 창문 열고\n훠-이. 훠-이. 소리친다.\n돌아가다오. 내리지 말고.\n한발작도 딛지 말고.","첫 서리는 가루약처럼\n드문 드문\n하늘에 번져\n그 서리는\n몸살져 누운\n이 땅의 이마를 어루만지고,\n눈가루는 표백제마냥\n희뿌옇게\n하늘을 탈색시켜\n새들은 부스럭거리며\n하늘을 지쳐 힘겹게 날고.","그 뒤로 그 마을엔\n겨울새가 날지 않았고\n아무도\n새의 소식을 묻지 않았다\n한 구석, 농담처럼\n꽃은 피고\n옷깃 풀기 시작한\n사람 몇몇\n남쪽에서 날아와, 주춤\n내리지 못하는\n몇 마리 새에게\n겸연쩍게 등돌려 서는\n그 뒤의 그 마을엔"],"credit":"1992. 제25회 한양대학교 한대신문 학술상 당선작 (우수상)","section":"글"}],"life":[{"slug":"p729","title":"2006 자전거 전문지,  인터뷰","label":"더바이크 인터뷰","layout":"E","date":"2006-07-03","year":"2006","blocks":["자전거 전문지의 요청으로 인터뷰를 진행했는데, 사실 자료도 남아있지 않고, 기억도 정확하게 나질 않는다. 다만, 당시 기자님이 송해련 기자님이었는데, 지금은 <THE BIKE>에서 편집장으로 근무하고 계신걸 알게 되었다. 기억속에는 <월간 바이크>, <자전거 생활> 류의 잡지명으로 어렴풋하게 남아 있는데, 어쨌든 송해련 편집장님께서 2007년도 이후 현재까지 근무하고 계신 곳이 <THE BIKE>이니, 그 셋 중에 하나, 아니면, 또 다른 어떤 이름이겠거니 싶다. 암튼, 그 당시에는 '나도 자전거 잡지에서 일하고 싶다.'고 생각했는데, 여행에만 조금 익숙했지, 자전거에 대해서는 아는게 없는 '자알못'이라서, 도전조차 해보질 못했다.","· 제목 – 자전거 유럽 여행","· 매체 – 더바이크(THE BIKE)","· 형식 – 인터뷰","· 일시 – 2006년 7월"],"credit":"","section":"삶"},{"slug":"p726","title":"2006 『KBS 3 라디오』, 유지인의 음악편지 출연","label":"KBS 3 라디오 출연","layout":"E","date":"2006-07-02","year":"2006","blocks":["KBS3 라디오 <유지인의 음악편지>에 다른 두 분의 여행작가와 함께 초대받아 좌담식 인터뷰를 진행했다. 각각 몇 권씩의 여행책을 집필하신 여행작가님들께서는 '후회는 하지 않지만, 여행작가 일만으로는 생계를 꾸려가기 어려운 게 현실'이라고.","· 제목 - 맛있는 강의, 행복한 생활","· 미디어 - KBS 3라디오","· 프로그램 - 유지인의 음악편지","· 일시 - 2006년 7월 2일 (일요일)2013.11.01~2014.04.24 (23회)","· 방송 1부 - http://bit.ly/1THmWSf","· 방송 2부 - http://bit.ly/1LlAVuk"],"credit":"","section":"삶"},{"slug":"p722","title":"2006 현대증권 사외보 『You First』 인터뷰","label":"현대증권 인터뷰","layout":"E","date":"2006-07-02","year":"2006","blocks":["현대증권 사외보, <You First> 인터뷰. 한남동 유엔빌리지 근처 스튜디오에서 사진 촬영도 진행했는데 꽤 어색했다. 어느 매체건 연락이 오면 오는대로 모든 섭외에 응했다. 지금 생각해보면 굳이 그럴 필요가 없었는데, 나도 모르게 바람이 들었었나 보다.","· 제목 – 두 바퀴로 그린 유럽 자전거 여행","· 매체 – 현대증권 사외보 <You First> 105호 (2006년 7월)","· 형식 – 인터뷰","· 일시 – 2006년 7월","· URL – http://webzine.youfirst.co.kr/webzine/105/h4_04.html (2016년 KB금융그룹으로 인수되면서 삭제)"],"credit":"","section":"삶"},{"slug":"p712","title":"2006 디지털매거진 『월간 w.e.b.』 인터뷰","label":"월간웹 인터뷰","layout":"E","date":"2006-07-01","year":"2006","blocks":["2003년 3개월 동안의 자전거 여행을 마치고 돌아와서 사회생활을 시작한 곳은 웹에이전시, 안그라픽스 디지털사업부였다. 그리고 2년 후 ㈜그라비티인터랙티브라는 회사 창업에 합류했는데, 업계 전문지인 <월간 w.e.b>의 윤유성 기자님으로부터 인터뷰 요청이 왔다. 업계에 이런 기사를 통해 내 얼굴을 알리는 것을 원하지 않았지만, 막 창업한 회사 홍보에 도움이 될까 싶어서, 때늦은 인터뷰 요청에 응했었다.","· 제목 – 내 생에 가장 아름다운 여행, 김남용","· 매체 – 디지털매거진, <월간 w.e.b>","· 형식 – 인터뷰","· 일시 – 2006년 7월","· 주소 – http://www.ditoday.com/articles/articles_view.html?idno=7493"],"credit":"","section":"삶"},{"slug":"p709","title":"2006 『북새통』 인터뷰","label":"북새통 인터뷰","layout":"E","date":"2006-06-22","year":"2006","blocks":["출판 마케팅 그룹 <북새통> 사외보 인터뷰. 신종호 편집장님께서 전화를 주셨다. 홍대 놀이터 근처의 스파게티집으로 노랑색 MTB를 끌고 나갔다. 신종호 님은 편집장 겸 시인이셨는데, 지금의 나라면, 커피 말고, 술 한잔을 청했을 것 같다. 인터뷰 특성상 들떠 있는 척 했지만, 사실, 나는 어느 정도 지난 여행에 심드렁해지고, 또 다시 '별볼 일 없는' 생활 속으로 젖어들고 있던 때였다.","· 제목 – 자전거 여행가 김남용 - 왜 지금 하면 안 되는 거지?","· 매체 – <북새통>","· 형식 – 서면 인터뷰","· 일시 – 2006년 6월 22일","· 참고자료 - http://blog.naver.com/johan34/80130564920","※북새통의 그 기사는 온라인에서 찾을 수 없다. 감사하게도, 어느 블로거께서 자신의 블로그에, 기사 일부를 옮겨 놓으셨다."],"credit":"","section":"삶"},{"slug":"p424","title":"2005 『에이비로드』 서면 인터뷰","label":"에이비로드 인터뷰","layout":"E","date":"2005-02-01","year":"2005","blocks":["<에이비로드>는 일본 여행 미디어, 의 콘텐트 일부를 번역하고, 일부 콘텐트는 자체 생산하여 출판하는 월간 여행 매거진이다. 2005년 1월 편집자의 요청으로 <서면 인터뷰> 형식의 원고를 보냈고, 그 중 일부분이 윤색되어 오프라인 매거진에 실렸다.","· 제목 – 김남용, 두 개의 바퀴로 유럽을 풍미한 사나이","· 매체 – 여행 월간지, 에이비로드","· 형식 – 서면 인터뷰","· 일시 – 2005년 2월 1일","· 주소 – http://bit.ly/1YPD83t (2018년 3월 현재, 온라인서비스 중단 중)"],"credit":"","section":"삶"},{"slug":"p392","title":"2003 『울산MBC 라디오』, 아침을 달린다 출연","label":"울산MBC 라디오","layout":"E","date":"2003-11-01","year":"2003","blocks":["울산MBC 라디오 <아침을 달린다> 제작팀으로부터 연락을 받았다. 격주로 자전거 유럽 여행에 관한 이야기를 해달라는 요청이었다. 녹음방송이긴 했지만 생방송이 끝나는 시간에 맞춰서 녹음을 해야했기 때문에 일하는 회사의 출근시간대에 진행이 되었다. 사람들이 출근하기 전에는 조바심을 내면서, 한 명이라도 출근을 하고 나면 눈치를 보면서 어렵게 진행했던 기억이 있다. 지나고 보니 방송을 할만큼 경험과 식견도 없는데, 괜한 짓을 했다는 생각이 든다.","· 제목 - 김남용의 유럽 견문록","· 미디어 - 울산MBC","· 프로그램 - 안녕하세요. 아침을 달린다","· 기간(회수) - 2003.11.01~2004.04.24 (23회)","■ 방송본","· 울산MBC 라디오, <아침을 달린다> 1회","· 울산MBC 라디오, <아침을 달린다> 2회","· 울산MBC 라디오, <아침을 달린다> 3회","· 울산MBC 라디오, <아침을 달린다> 4회","· 울산MBC 라디오, <아침을 달린다> 5회","· 울산MBC 라디오, <아침을 달린다> 6회","· 울산MBC 라디오, <아침을 달린다> 7회","· 울산MBC 라디오, <아침울 달린다> 8회","· 울산MBC 라디오, <아침을 달린다> 9회","· 울산MBC 라디오, <아침을 달린다> 10회","· 울산MBC 라디오, <아침을 달린다> 11회","· 울산MBC 라디오, <아침을 달린다> 12회","· 울산MBC 라디오, <아침을 달린다> 13회","· 울산MBC 라디오, <아침을 달린다> 14회","· 울산MBC 라디오, <아침울 달린다> 15회","· 울산MBC 라디오, <아침을 달린다> 16회","· 울산MBC 라디오, <아침을 달린다> 17회","· 울산MBC 라디오, <아침을 달린다> 18회","· 울산MBC 라디오, <아침을 달린다> 19회","· 울산MBC 라디오, <아침을 달린다> 20회","· 울산MBC 라디오, <아침을 달린다> 21회","· 울산MBC 라디오, <아침을 달린다> 22회"],"credit":"","section":"삶"}]};
const OPEN_X=16, CLOSE_X=300, OPEN_DELAY=120, CLOSE_DELAY=200;
const MIN_SLOTS = 3;   /* 이미지가 없어도 자리는 보여준다 — 채울 곳 표시 */

const SECTIONS = {
  work:    {label:'일', items:DATA.work    || []},
  writing: {label:'글', items:DATA.writing || []},
  life:    {label:'삶', items:DATA.life    || []},
};

const body=document.body, hint=document.getElementById('hint'),
      backdrop=document.getElementById('backdrop'), drawer=document.getElementById('drawer'),
      elNav=document.getElementById('dnav'), elTitles=document.getElementById('titles'),
      sheet=document.getElementById('sheet');

let section='work', current=SECTIONS.work.items[0]||null, preview=null, open=null;

const esc = t => String(t==null?'':t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ── 드로어 ─────────────────────────────────── */
function setOpen(v){
  if(open===v) return;
  open=v; body.dataset.drawer=v?'open':'closed';
  hint.setAttribute('aria-expanded',String(v));
  drawer.toggleAttribute('inert',!v);
  if(!v && preview){ preview=null; render(); }
}
setOpen(false);
hint.addEventListener('click',e=>{e.stopPropagation(); setOpen(!open);});
backdrop.addEventListener('click',()=>setOpen(false));
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&open){setOpen(false); hint.focus();} });

const fine=matchMedia('(hover:hover) and (pointer:fine) and (min-width:768px)');
let tOpen=null,tClose=null;
function onMove(e){
  const x=e.clientX;
  if(!open){ if(x<=OPEN_X){ if(tOpen===null) tOpen=setTimeout(()=>{tOpen=null;setOpen(true);},OPEN_DELAY); }
             else if(tOpen!==null){clearTimeout(tOpen); tOpen=null;} }
  else{ if(x>=CLOSE_X){ if(tClose===null) tClose=setTimeout(()=>{tClose=null;setOpen(false);},CLOSE_DELAY); }
        else if(tClose!==null){clearTimeout(tClose); tClose=null;} }
}
function bindFine(){ removeEventListener('pointermove',onMove); if(fine.matches) addEventListener('pointermove',onMove,{passive:true}); }
bindFine(); fine.addEventListener('change',bindFine);

let sx=null,sy=null;
addEventListener('touchstart',e=>{const t=e.touches[0]; if(!open&&t.clientX<=24){sx=t.clientX; sy=t.clientY;}},{passive:true});
addEventListener('touchmove',e=>{ if(sx===null)return; const t=e.touches[0];
  if(t.clientX-sx>40 && Math.abs(t.clientY-sy)<50){setOpen(true); sx=null;} },{passive:true});
addEventListener('touchend',()=>{sx=null;},{passive:true});

/* ── 이미지 슬롯 ────────────────────────────── */
function slot(img, cls){
  if(!img) return '<div class="slot is-empty '+(cls||'')+'"></div>';
  const d = (img.w&&img.h) ? ' width="'+img.w+'" height="'+img.h+'"' : '';
  return '<div class="slot '+(cls||'')+'"><img src="'+esc(img.src)+'" alt="'+esc(img.alt)+'"'+d+' loading="lazy"></div>';
}
function detailRow(details){
  const list = details.slice();
  while(list.length < MIN_SLOTS) list.push(null);      /* 빈 자리도 보여준다 */
  const n = Math.min(list.length, 6);
  return '<div class="details" data-n="'+n+'">'+list.slice(0,6).map(d=>slot(d)).join('')+'</div>';
}
function creditList(credits, two){
  return '<dl class="credits'+(two?' two':'')+'">'+credits.map(c=>
    '<div class="cred"><dt>'+esc(c.k)+'</dt><dd>'+esc(c.v)+'</dd></div>').join('')+'</dl>';
}
function paras(list){
  return list.map(b => b.t==='h'
    ? '<h2 class="sub">'+esc(b.v)+'</h2>'
    : '<p class="para">'+esc(b.v).replace(/\n/g,'<br>')+'</p>').join('');
}

/* ── 레이아웃 ───────────────────────────────── */
function layoutA(it){
  return '<div class="A-media">'+ slot(it.hero,'hero') + detailRow(it.details) +'</div>'+
    '<div class="A-text">'+
      '<h1 class="title">'+esc(it.title)+'</h1>'+
      (it.lead ? '<p class="lead">'+esc(it.lead)+'</p>' : '<p class="lead"></p>')+
      '<div>'+paras(it.body)+'</div>'+
      creditList(it.credits, true)+
    '</div>'+
    (it.extra.length ? '<div class="overflow">'+it.extra.map(d=>slot(d)).join('')+'</div>' : '');
}
function layoutC(it){
  const d = it.details.slice();
  while(d.length < 3) d.push(null);
  return '<div class="C-media">'+ slot(it.hero,'hero') + slot(d[0]) +
      '<div class="stack">'+slot(d[1])+slot(d[2])+'</div>'+
    '</div>'+
    '<div class="C-head"><h1 class="title">'+esc(it.title)+'</h1></div>'+
    '<div class="C-cols">'+
      '<div>'+(it.lead ? '<p class="lead">'+esc(it.lead)+'</p>' : '')+'</div>'+
      '<div>'+paras(it.body)+'</div>'+
      '<div>'+creditList(it.credits,false)+'</div>'+
    '</div>'+
    (d.length>3 || it.extra.length
      ? '<div class="overflow">'+d.slice(3).concat(it.extra).filter(Boolean).map(x=>slot(x)).join('')+'</div>' : '');
}
function layoutE(it){
  return '<h1 class="E-title">'+esc(it.title)+'</h1>'+
    '<div class="E-body">'+it.blocks.map(b=>'<p class="E-stanza">'+esc(b)+'</p>').join('')+'</div>'+
    (it.credit ? '<p class="E-credit">'+esc(it.credit)+'</p>' : '');
}

/* ── 렌더 ───────────────────────────────────── */
function renderNav(){
  elNav.innerHTML='';
  for(const [k,v] of Object.entries(SECTIONS)){
    const b=document.createElement('button');
    b.type='button'; b.textContent=v.label;
    b.setAttribute('aria-current',String(k===section));
    b.addEventListener('click',()=>{
      section=k; preview=null; current=SECTIONS[k].items[0]||null;
      renderNav(); renderTitles(); render();
    });
    elNav.appendChild(b);
  }
}
function renderTitles(){
  elTitles.innerHTML='';
  const items=SECTIONS[section].items;
  if(!items.length){ elTitles.innerHTML='<li><button type="button" disabled>준비 중</button></li>'; return; }
  items.forEach(it=>{
    const li=document.createElement('li'), b=document.createElement('button');
    b.type='button';
    b.innerHTML='<span class="dash"></span><span>'+esc(it.label||it.title)+'</span>';
    b.setAttribute('aria-current',String(current&&current.slug===it.slug));
    b.addEventListener('pointerenter',()=>{ if(fine.matches){preview=it; render();} });
    b.addEventListener('click',()=>{ current=it; preview=null; setOpen(false); renderTitles(); render(); });
    li.appendChild(b); elTitles.appendChild(li);
  });
}
function render(){
  const it=preview||current;
  body.dataset.section=section;
  body.dataset.layout=(it&&it.layout)||'A';
  const tc=document.getElementById('themeColor');
  if(tc) tc.content=getComputedStyle(body).backgroundColor;
  if(!it){ sheet.dataset.layout='E'; sheet.innerHTML='<h1 class="E-title">준비 중</h1>'; return; }
  sheet.dataset.layout=it.layout||'A';
  sheet.innerHTML = it.layout==='E' ? layoutE(it) : (it.layout==='C' ? layoutC(it) : layoutA(it));
}
renderNav(); renderTitles(); render();
</script>
</body>
</html>
