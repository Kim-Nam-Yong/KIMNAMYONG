<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>삶 · KIMNAMYONG</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
:root{
  --paper:#FFFFFF; --surface:#F7F8F9; --ink:#16181C; --ink-soft:#6E7681;
  --line:#E4E8EC; --accent:#3A5A78; --danger:#A8443C; --ok:#3F7A55;
  --sans:"Pretendard Variable",Pretendard,-apple-system,'Apple SD Gothic Neo',system-ui,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0C0E11; --surface:#14171B; --ink:#E4E6E9; --ink-soft:#8C949E;
    --line:#252A31; --accent:#7FA6C4; --danger:#D08078; --ok:#7FB894;
  }
}
:root[data-theme="dark"]{
  --paper:#0C0E11; --surface:#14171B; --ink:#E4E6E9; --ink-soft:#8C949E;
  --line:#252A31; --accent:#7FA6C4; --danger:#D08078; --ok:#7FB894;
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans);
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}
[hidden]{display:none !important}

/* ── 상단 바 ─────────────────────────────── */
.bar{
  display:flex; align-items:center; gap:.75rem;
  padding:.9rem clamp(1rem,3vw,1.75rem);
  border-bottom:1px solid var(--line); background:var(--paper);
  position:sticky; top:0; z-index:10;
}
.brand{font-size:.72rem; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-soft)}
.brand b{color:var(--ink); font-weight:600}
.bar .spacer{flex:1}
.who{font-size:.78rem; color:var(--ink-soft)}

.btn{
  border:1px solid var(--line); background:var(--paper); color:var(--ink);
  padding:.5rem .9rem; border-radius:6px; cursor:pointer;
  font-size:.82rem; transition:background .15s var(--ease),border-color .15s var(--ease);
}
.btn:hover{background:var(--surface)}
.btn-primary{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.btn-primary:hover{opacity:.88; background:var(--ink)}
.btn-danger{color:var(--danger); border-color:var(--line)}
.btn-danger:hover{border-color:var(--danger)}
.btn:disabled{opacity:.45; cursor:not-allowed}

/* ── 로그인 ──────────────────────────────── */
.gate{
  min-height:100vh; min-height:100dvh; display:grid; place-items:center;
  padding:2rem; text-align:center;
}
.gate-box{width:100%; max-width:340px; display:flex; flex-direction:column; gap:1rem}
.gate h1{font-size:1.25rem; font-weight:600; margin:0}
.gate p{font-size:.85rem; color:var(--ink-soft); margin:0; line-height:1.7}
.field{
  width:100%; padding:.7rem .85rem; border:1px solid var(--line);
  border-radius:6px; background:var(--paper);
}
.note{font-size:.8rem; line-height:1.6; padding:.7rem .85rem; border-radius:6px}
.note-ok{color:var(--ok); background:color-mix(in srgb,var(--ok) 10%,transparent)}
.note-err{color:var(--danger); background:color-mix(in srgb,var(--danger) 10%,transparent)}

/* ── 작업 화면 ───────────────────────────── */
.work{display:grid; grid-template-columns:230px 1fr; min-height:calc(100dvh - 57px)}
.list{border-right:1px solid var(--line); background:var(--surface); display:flex; flex-direction:column}
.list-head{
  display:flex; align-items:center; gap:.5rem;
  padding:.85rem 1rem; border-bottom:1px solid var(--line);
}
.list-head span{font-size:.7rem; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-soft); flex:1}
.entries{list-style:none; margin:0; padding:.35rem; overflow-y:auto; flex:1}
.entries button{
  width:100%; text-align:left; background:none; border:0; cursor:pointer;
  padding:.6rem .65rem; border-radius:5px; display:flex; align-items:center; gap:.5rem;
  font-variant-numeric:tabular-nums; color:var(--ink-soft); font-size:.85rem;
}
.entries button:hover{background:var(--paper)}
.entries button[aria-current="true"]{background:var(--paper); color:var(--ink); font-weight:500}
.dot{width:5px; height:5px; border-radius:50%; background:var(--accent); flex:none; opacity:0}
.entries button[data-draft="true"] .dot{opacity:1; background:var(--ink-soft)}
.excerpt{
  flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  font-size:.78rem; opacity:.65;
}
.empty-list{padding:1.5rem 1rem; font-size:.82rem; color:var(--ink-soft); text-align:center}

.editor{display:flex; flex-direction:column; padding:clamp(1rem,3vw,1.75rem); gap:1rem}
.editor-head{display:flex; align-items:center; gap:1rem; flex-wrap:wrap}
.editor-head label{font-size:.78rem; color:var(--ink-soft); display:flex; align-items:center; gap:.45rem}
textarea{
  flex:1; min-height:340px; width:100%; resize:vertical;
  padding:1rem 1.1rem; border:1px solid var(--line); border-radius:8px;
  background:var(--paper); line-height:1.9; font-size:15px;
}
.editor-foot{display:flex; align-items:center; gap:.6rem; flex-wrap:wrap}
.status{font-size:.8rem; color:var(--ink-soft); flex:1}
.status.dirty{color:var(--accent)}

@media (max-width:767px){
  .work{grid-template-columns:1fr; min-height:auto}
  .list{border-right:0; border-bottom:1px solid var(--line)}
  .entries{max-height:34vh}
  textarea{min-height:44vh}
}
</style>
</head>
<body>

<!-- 로그인 -->
<section class="gate" id="gate" hidden>
  <div class="gate-box">
    <h1>삶</h1>
    <p>등록된 주소로 로그인 링크를 보냅니다.<br>비밀번호는 사용하지 않습니다.</p>
    <input class="field" id="email" type="email" placeholder="이메일" autocomplete="email">
    <button class="btn btn-primary" id="sendLink">로그인 링크 받기</button>
    <div class="note note-ok" id="gateOk" hidden></div>
    <div class="note note-err" id="gateErr" hidden></div>
  </div>
</section>

<!-- 작업 화면 -->
<div id="app" hidden>
  <header class="bar">
    <span class="brand"><b>KIMNAMYONG</b> · 삶</span>
    <span class="spacer"></span>
    <span class="who" id="who"></span>
    <button class="btn" id="logout">로그아웃</button>
  </header>

  <div class="work">
    <nav class="list" aria-label="글 목록">
      <div class="list-head">
        <span>기록</span>
        <button class="btn" id="newEntry">새 글</button>
      </div>
      <ul class="entries" id="entries"></ul>
    </nav>

    <main class="editor">
      <div class="editor-head">
        <label>날짜 <input class="field" id="date" type="date" style="width:auto"></label>
        <label><input id="published" type="checkbox"> 공개</label>
      </div>
      <textarea id="body" placeholder="오늘의 단상"></textarea>
      <div class="editor-foot">
        <span class="status" id="status"></span>
        <button class="btn btn-danger" id="del" hidden>삭제</button>
        <button class="btn btn-primary" id="save">저장</button>
      </div>
    </main>
  </div>
</div>

<script src="./supabase-config.js"></script>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const cfg = window.SUPABASE_CONFIG || {};
const $ = id => document.getElementById(id);

if (!cfg.url || !cfg.key) {
  document.body.innerHTML =
    '<div class="gate"><div class="gate-box">' +
    '<h1>설정 필요</h1><p>supabase-config.js 에 프로젝트 URL과 publishable key를 채워주세요.</p>' +
    '</div></div>';
  throw new Error('Supabase config missing');
}

const db = createClient(cfg.url, cfg.key);
let entries = [], current = null, dirty = false;

const fmt = d => d ? d.replaceAll('-', '.') : '';
const today = () => new Date().toISOString().slice(0, 10);

/* ── 인증 ─────────────────────────────────── */
async function boot() {
  const { data: { session } } = await db.auth.getSession();
  if (session) { showApp(session); } else { $('gate').hidden = false; }
}
db.auth.onAuthStateChange((_e, session) => {
  if (session) showApp(session); else { $('app').hidden = true; $('gate').hidden = false; }
});

$('sendLink').addEventListener('click', async () => {
  const email = $('email').value.trim();
  $('gateOk').hidden = true; $('gateErr').hidden = true;
  if (!email) { $('gateErr').textContent = '이메일을 입력해주세요.'; $('gateErr').hidden = false; return; }
  $('sendLink').disabled = true; $('sendLink').textContent = '보내는 중…';
  const { error } = await db.auth.signInWithOtp({
    email, options: { emailRedirectTo: location.href.split('#')[0] }
  });
  $('sendLink').disabled = false; $('sendLink').textContent = '로그인 링크 받기';
  if (error) { $('gateErr').textContent = error.message; $('gateErr').hidden = false; }
  else { $('gateOk').textContent = email + ' 으로 링크를 보냈습니다. 메일함을 확인해주세요.'; $('gateOk').hidden = false; }
});

$('logout').addEventListener('click', async () => { await db.auth.signOut(); });

async function showApp(session) {
  $('gate').hidden = true; $('app').hidden = false;
  $('who').textContent = session.user.email;
  await load();
  if (!current) newEntry();
}

/* ── 데이터 ───────────────────────────────── */
async function load() {
  const { data, error } = await db.from('life_entries')
    .select('*').order('written_on', { ascending: false }).order('created_at', { ascending: false });
  if (error) { setStatus('불러오기 실패 — ' + error.message, true); return; }
  entries = data || [];
  renderList();
}

function renderList() {
  const ul = $('entries'); ul.innerHTML = '';
  if (!entries.length) {
    ul.innerHTML = '<li class="empty-list">아직 기록이 없습니다.</li>';
    return;
  }
  entries.forEach(e => {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('aria-current', String(current && current.id === e.id));
    b.dataset.draft = String(!e.published);
    b.innerHTML = '<span class="dot"></span><span>' + fmt(e.written_on) + '</span>' +
                  '<span class="excerpt">' + (e.body || '').slice(0, 30).replace(/</g, '&lt;') + '</span>';
    b.title = e.published ? '' : '미공개';
    b.addEventListener('click', () => open(e));
    li.appendChild(b); ul.appendChild(li);
  });
}

function open(e) {
  if (dirty && !confirm('저장하지 않은 내용이 있습니다. 버리고 이동할까요?')) return;
  current = e;
  $('date').value = e.written_on;
  $('body').value = e.body;
  $('published').checked = e.published;
  $('del').hidden = false;
  setDirty(false); setStatus('');
  renderList();
}

function newEntry() {
  if (dirty && !confirm('저장하지 않은 내용이 있습니다. 버리고 새로 쓸까요?')) return;
  current = null;
  $('date').value = today();
  $('body').value = '';
  $('published').checked = true;
  $('del').hidden = true;
  setDirty(false); setStatus('새 글');
  renderList(); $('body').focus();
}
$('newEntry').addEventListener('click', newEntry);

['body', 'date', 'published'].forEach(id =>
  $(id).addEventListener('input', () => setDirty(true)));

function setDirty(v) {
  dirty = v;
  if (v) setStatus('저장하지 않은 변경', false, true);
}
function setStatus(msg, isErr, isDirty) {
  const el = $('status');
  el.textContent = msg;
  el.className = 'status' + (isDirty ? ' dirty' : '');
  el.style.color = isErr ? 'var(--danger)' : '';
}

$('save').addEventListener('click', async () => {
  const body = $('body').value.trim();
  if (!body) { setStatus('본문이 비어 있습니다.', true); return; }
  const row = { written_on: $('date').value || today(), body, published: $('published').checked };
  $('save').disabled = true; setStatus('저장 중…');

  const q = current
    ? db.from('life_entries').update(row).eq('id', current.id).select().single()
    : db.from('life_entries').insert(row).select().single();
  const { data, error } = await q;
  $('save').disabled = false;

  if (error) { setStatus('저장 실패 — ' + error.message, true); return; }
  current = data; $('del').hidden = false;
  setDirty(false); setStatus('저장됨');
  await load();
});

$('del').addEventListener('click', async () => {
  if (!current) return;
  if (!confirm(fmt(current.written_on) + ' 기록을 삭제합니다. 되돌릴 수 없습니다.')) return;
  const { error } = await db.from('life_entries').delete().eq('id', current.id);
  if (error) { setStatus('삭제 실패 — ' + error.message, true); return; }
  await load(); newEntry();
});

addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

boot();
</script>
</body>
</html>
